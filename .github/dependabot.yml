# Opens a monthly pull request when a GitHub Action used by the workflows has a new version.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
  # Android libraries and the analytics Python packages: weekly, one pull request per ecosystem, so CI (incl. seo-check) runs on each.
  # Gradle goes to next, where app releases are built; major versions (AGP, billing, Firebase BoM) need code changes and are done by hand.
  - package-ecosystem: "gradle"
    directory: "/android"
    target-branch: "next"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # androidx.core 1.19 needs compileSdk 37 and Android Gradle plugin 9.1 (the app: 36 and 8.13.2), so its minor bump stopped the build
      # (#16, App guardian run 40552732633, 27.10). It comes by hand with that upgrade after the freeze (22.11); webkit and the rest still come weekly
      - dependency-name: "androidx.core:core"
        versions: [">= 1.19.0"]
    groups:
      android-deps:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/analytics"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
