# Opens a monthly pull request when a GitHub Action used by the workflows has a new version.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
  # Android libraries and the analytics Python packages: weekly, one pull request per ecosystem, so CI (incl. seo-check) runs on each.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      android-deps:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/analytics"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
