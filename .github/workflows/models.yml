name: Model names
on:
  schedule:
    - cron: "50 5 7 * *"   # monthly, the day after modelstats (same main-writer group: a pending run would otherwise be cancelled)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node .github/scripts/models.mjs
      - run: |
          cp out/models.json models.json
          if [ -n "$(git status --porcelain models.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add models.json && git commit -m "Update model names" && { git push || { git pull --rebase -q origin main && git push; }; }
          fi
