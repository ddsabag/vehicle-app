name: Model names
on:
  schedule:
    - cron: "20 5 6 * *"   # monthly, after the market data
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/models.mjs
      - run: |
          cp out/models.json models.json
          if [ -n "$(git status --porcelain models.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add models.json && git commit -m "Update model names" && git push
          fi
