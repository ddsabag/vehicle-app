name: Model names
on:
  schedule:
    # monthly, the 5th: before the magazine (6th 08:07) rebuilds the model pages from models.json. 07:10 is well after market.yml (04:40)
    # and clear of SEO auto-publish (10:40/18:40, same main-writer group: a third queued run would cancel a pending one)
    - cron: "10 7 5 * *"
  workflow_dispatch:
    inputs:
      skip_gate:
        description: "Publish even when the sanity check finds the build incomplete or far off the published file (read the run log first)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: main-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # a failed or partial scan fails here and nothing is committed (the job goes red, so failure-alert reports it)
      - run: node .github/scripts/models.mjs
        env:
          SKIP_GATE: ${{ inputs.skip_gate && '1' || '0' }}
      - run: |
          cp out/models.json models.json
          if [ -n "$(git status --porcelain models.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add models.json && git commit -m "Update model names" && { git push || { git pull --rebase -q origin main && git push; }; }
          fi
