name: Market intelligence
# Monthly, after market.json (5th) and modelstats.json (6th, up to 2 hours): turns them into per-model market tags (market-tags.json) for the PRO "תנודות בשוק" card.
on:
  schedule:
    - cron: "30 9 7 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/market-intel.mjs --selftest
      - run: node .github/scripts/market-intel.mjs
      - run: |
          if [ -n "$(git status --porcelain market-tags.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add market-tags.json && git commit -m "Update market tags" && git push
          fi
