name: Social check (branch)
# Temporary: tests the two Meta tokens from the unreleased bot branch (mode check: reads only, posts nothing, no Telegram).
# Removed again before the bot is merged.
on:
  push:
    branches: [social-autopost]
    paths: [.github/workflows/social-check-branch.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      META_PUBLISH_TOKEN: ${{ secrets.META_PUBLISH_TOKEN }}
      IG_PUBLISH_TOKEN: ${{ secrets.IG_PUBLISH_TOKEN }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/social-publish.mjs selftest
      - run: node .github/scripts/social-publish.mjs check
