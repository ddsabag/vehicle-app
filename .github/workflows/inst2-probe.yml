name: Installs gap probe (one-off, probe-perf branch)
# Read-only, 5.11.2026: why Play Console and /live count installs differently (Google Play reports and GA4 by day and country).
# The output is encrypted with .github/seo-data.pub.pem, so no business number is in the log or the branch in clear. Runs on a push to the
# probe-perf branch only; output on the probe-inst2-out branch.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/inst2-probe.mjs", ".github/workflows/inst2-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/inst2-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish on probe-inst2-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b probe-inst2-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Installs gap probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-inst2-out
