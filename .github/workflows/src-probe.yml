name: Site sources probe (one-off, probe-perf branch)
# 2.11, CEO thread: which source of site visits fell 25-31.10. Read-only GA4; output encrypted on branch src-probe-out.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/src-probe.mjs", ".github/workflows/src-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: node .github/scripts/src-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish on src-probe-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b src-probe-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Site sources probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" src-probe-out
