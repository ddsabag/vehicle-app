name: GA4 settings probe (one-off, probe-perf branch)
# Read-only, 7.11.2026: the GA4 property's retention, Google signals, streams and dimension count for the measurement checklist.
# Prints settings only, never a business number. Runs on a push to the probe-perf branch only.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/ga4set-probe.mjs", ".github/workflows/ga4set-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/ga4set-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
