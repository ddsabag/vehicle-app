name: Release guard findings close (one-off, probe-perf branch)
# Closes the open day-7 finding of 1.38.4 (relguard:1.38.4-d7) through the router, the way the guard's own pass path does (12.11):
# the silent event is the cars view switch, still in 1.38.4 and rare by design; compare falls by week on every 1.38.x alike and the
# product thread has it (main 5e72747, review context). Quiet Telegram line, state on alert-state.
# (5.11: closed the three 1.38.3 findings, the silent rule judging lookup_timeout.)
# 13.11: again, after GitHub's late 12:51 UTC schedule run of 12.11 reopened the checked day-7 finding; also the two silent "thin" day items of 1.38.4.
# 13.11 later: ai:guard, the second look's "reply is not JSON", fixed on main 368ea891 (PR #52; a dry run from the branch gave the cause line).
on:
  push:
    branches: [probe-perf]
    paths: [".github/workflows/relguard-close.yml"]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Close relguard:1.38.4-d* (main's alert.mjs, copied onto this branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --input-type=module -e 'const m = await import("./.github/scripts/alert.mjs"); const n = await m.resolve(["ai:guard"]); console.log("closed:", n);'
