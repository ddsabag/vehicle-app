name: Failed checks split probe (one-off)
on:
  push:
    branches: [probe/fail-split-2711]
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/failsplit-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish the encrypted output
        run: |
          mkdir o && mv failsplit.enc.json o/ && cd o && git init -q && git checkout -q -b probe-failsplit-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Failed checks probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-failsplit-out
