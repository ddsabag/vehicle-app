name: Production
# The owner's "פרסם" (or Actions → Production → Run workflow, mode=on): the newest Alpha release (its build, name and Hebrew notes) goes to
# Google Play's production track and is sent for review (play-production.mjs promote): as a staged rollout to 20% of users, or, for the very
# first production release (Google allows no staged rollout for it), to all users. Never a version that is not above the one on production,
# never over a rollout that is still running, never another version than the one named in `version`; each refusal comes on Telegram with
# the reason. What follows runs in Release watch: nothing while Google reviews it; once published, a crash or ANR NEW in the build halts it,
# and 48 hours with none (and the crash data read past them) take it to 100%. Manual only: no push, schedule or other workflow starts this
# one. mode=dry (the default, and anywhere but main) reads Play and tries the release in an edit that is deleted, never committed (this
# checks the permission and Play's own checks). Kill switch: the SHIP_TAIL variable, as in Ship tail. Owner setup: .github/SHIP-TAIL.md
# full=true (the owner asked for all users at once): the build goes to all users, no staged rollout and so no automatic halt (the watch
# still tells a new crash); an older rollout still running is replaced by it, and the same build running at a fraction goes to 100% now.
# replace=true (the owner asked not to wait for the running rollout to reach 100%): the newer build starts at 20% in its place, with the
# same automatic halt and 48 h; who already has the older version keeps it until the new one reaches them.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = read Play and show what would be sent; on = send the Alpha build to Production at 20%, or to all users with full (never above the SHIP_TAIL variable)"
        type: choice
        options: [dry, "on"]   # quoted: YAML reads a bare on as true
        default: dry
      version:
        description: "the version meant, e.g. 1.34 (empty = whatever is newest on Alpha); a different newest Alpha version is not sent"
        type: string
        required: false
      full:
        description: "all users at once instead of 20% (no automatic halt); replaces an older rollout that is still running"
        type: boolean
        default: false
      replace:
        description: "20% now in place of an older rollout that is still running, without waiting for it to reach 100%"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # alert.mjs keeps its dedupe state on the alert-state branch
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/play-production.mjs
            .github/scripts/play-alpha.mjs
            .github/scripts/tg-text.mjs
            .github/scripts/bot-names.json
            .github/scripts/alert.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Kill switch
        id: g
        run: node .github/scripts/play-production.mjs gate
        env:
          SHIP_TAIL: ${{ vars.SHIP_TAIL }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_MODE: ${{ inputs.mode }}
      - name: Send the Alpha build to Production (20%, or all users with full)
        if: ${{ steps.g.outputs.mode != 'off' }}
        run: node .github/scripts/play-production.mjs promote
        env:
          SHIP_SA_JSON: ${{ secrets.SHIP_SA_JSON }}
          MODE: ${{ steps.g.outputs.mode }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ inputs.version }}
          FULL: ${{ inputs.full && '1' || '0' }}
          REPLACE: ${{ inputs.replace && '1' || '0' }}
          PLAY_DEVELOPER_ID: ${{ vars.PLAY_DEVELOPER_ID }}
          PLAY_APP_ID: ${{ vars.PLAY_APP_ID }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
