name: Alert router check
# Offline checks of the alert router (no secrets, no network): syntax, the engine's self-test (decision table, DST, partial rollout,
# failures, privacy, CLI marker contract), the Python wrapper's self-test, the Sunday block and weekly brief tests, the Worker tests, the
# Workers deploy self-test (Ship Tail: guards, rollback, dry mode, on its own fixtures, so normal Worker edits never turn it red), the store
# listing self-test and files (a too-long description or a bad screenshot on next is red here, before "שחרר") and the block compare.
# The alert-fallback.test.sh step joins with the call sites (step C).
# Paths: router files and every call-site directory (the self-test scans call-site keys; spec 15.1).
on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "analytics/**"
      - "worker/**"
      - ".github/ship-tail.json"
      - ".github/store-listing/**"
  push:
    branches: [main, next]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "analytics/**"
      - "worker/**"
      - ".github/ship-tail.json"
      - ".github/store-listing/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: for f in .github/scripts/alert.mjs .github/scripts/waiting.mjs .github/scripts/live-watch.mjs worker/lib/alert-lib.js worker/mail/worker.js worker/uptime/worker.js worker/reviews/worker.js worker/live/worker.js; do [ ! -f "$f" ] || node --check "$f"; done
      - name: Jobs pinned to ubuntu-24.04
        run: "! grep -rnE '^[[:space:]]*runs-on:[[:space:]]*ubuntu-latest' .github/workflows/"
      - name: Engine self-test
        run: node .github/scripts/alert.mjs selftest
      - name: Ship tail self-tests (alpha-only guard, data-rebuild skip, release notes, GA4 create-only, analytics contract)
        run: node .github/scripts/play-alpha.mjs selftest && node .github/scripts/ga4-admin.mjs selftest
      # the contract's other side: every event the dashboard (worker/live) and the reports (analytics/) read is still sent by the page, the
      # app's code, worker/api or GA4 itself, so a new tile is red here before its event exists, not at the next change to the page (1 s)
      - name: Dashboard reads still sent
        run: node .github/scripts/analytics-flows.cjs --static
      - name: Store listing self-test and files (iw-IL only, Play's limits, nothing committed when Play keeps something else)
        run: node .github/scripts/play-listing.mjs selftest && node .github/scripts/play-listing.mjs check
      - name: Data safety self-test and file (Play's export format, sent only when it changed)
        run: node .github/scripts/play-data-safety.mjs selftest && node .github/scripts/play-data-safety.mjs check
      - name: Release watch self-test (reads only, new issues told once, 72 h windows)
        run: node .github/scripts/release-watch.mjs selftest
      - name: Production self-test (production only, 20% start, halt on a new crash, 100% 48 h after published, manual start only)
        run: node .github/scripts/play-production.mjs selftest
      - name: Live watch self-test (the 20.10 hang is caught, a tab closed mid-load is not)
        run: node .github/scripts/live-watch.mjs selftest
      - name: Pipe canary self-test (a broken analytics pipe is caught, quiet days are not, no count in the log)
        run: node .github/scripts/pipe-canary.mjs selftest
      - name: Data truth self-tests (no plate published, alert keys and wording, every weekly check on made-up registers)
        run: node .github/scripts/site-data-truth.mjs --selftest && node .github/scripts/data-invariants.mjs --selftest
      - name: Release guard self-test (day 1, 3 and 7 only, four guardrails, thin data not judged)
        run: node .github/scripts/release-guard.mjs selftest
      - name: Bots board self-test (cron words, Hebrew names of every scheduled bot in bot-names.json and worker.js)
        run: node .github/scripts/bots-status.mjs selftest
      - name: Python wrapper self-test
        run: python3 -I analytics/alert.py --selftest
      - name: Sunday block self-test
        run: node .github/scripts/waiting.mjs --selftest
      - name: Weekly brief block test
        run: python3 -I -B analytics/test_run_block.py
      - name: Weekly report Play vitals test (the days asked end where Google's data ends)
        run: python3 -I -B analytics/test_play_vitals.py
      - name: Worker block test
        run: node worker/lib/test.mjs
      - name: Uptime Worker test
        run: node worker/uptime/test.mjs
      - name: Mail Worker test
        run: node worker/mail/test.mjs
      - name: Reviews Worker test
        run: node worker/reviews/test.mjs
      - name: Workers deploy self-test
        run: node .github/scripts/workers-deploy.mjs --selftest
      # worker/lib/alert-lib.js: QUIET and the isDaytime body equal alert.mjs's; each Worker that already holds the block holds it byte-identical
      - name: Worker block compare
        run: |
          node --input-type=module - <<'EOF'
          import fs from "node:fs";
          const read = f => (fs.existsSync(f) ? fs.readFileSync(f, "utf8") : null);
          const quiet = s => (/\bconst QUIET\s*=\s*(\{[^}]*\})/.exec(s) || [])[1];
          const body = s => {   // isDaytime's body, from its opening brace to the matching one
            const i = s.indexOf("function isDaytime(");
            if (i < 0) return null;
            const a = s.indexOf(") {", i) + 2;
            for (let j = a, depth = 0; j < s.length; j++) { if (s[j] === "{") depth++; else if (s[j] === "}" && !--depth) return s.slice(a, j + 1); }
            return null;
          };
          const START = "// >>> alert-lib v1", END = "// <<< alert-lib v1";
          const block = s => { const a = s.indexOf(START), b = s.indexOf(END); return a < 0 && b < 0 ? null : a < 0 || b < a ? "broken" : s.slice(a, b + END.length); };
          const eng = read(".github/scripts/alert.mjs"), lib = read("worker/lib/alert-lib.js");
          let bad = 0;
          const check = (c, m) => { console.log((c ? "ok   " : "FAIL ") + m); if (!c) bad++; };
          const ref = lib && block(lib);
          check(ref && ref !== "broken", "worker/lib/alert-lib.js holds the alert-lib v1 block");
          check(quiet(eng) && quiet(eng) === quiet(ref || ""), "QUIET equals alert.mjs");
          check(body(eng) && body(eng) === body(ref || ""), "isDaytime body equals alert.mjs");
          for (const f of ["worker/uptime/worker.js", "worker/mail/worker.js", "worker/reviews/worker.js"]) {
            const s = read(f), b = s && block(s);
            if (!b) { console.log(`skip ${f}: ${s ? "no alert-lib v1 block yet" : "not in the repo yet"}`); continue; }
            check(b === ref, f + " block is byte-identical to worker/lib/alert-lib.js");
          }
          process.exit(bad ? 1 : 0);
          EOF
