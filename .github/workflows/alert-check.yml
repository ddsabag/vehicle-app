name: Alert router check
# Offline checks of the alert router (no secrets, no network): syntax, the engine's self-test (decision table, DST, partial rollout,
# failures, privacy, CLI marker contract), the Python wrapper's self-test, the Sunday block and weekly brief tests, the Worker tests, the
# Workers deploy self-test (Ship Tail: guards, rollback, dry mode, on its own fixtures, so normal Worker edits never turn it red) and the
# block compare.
# The alert-fallback.test.sh step joins with the call sites (step C).
# Paths: router files and every call-site directory (the self-test scans call-site keys; spec 15.1).
on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "analytics/**"
      - "worker/**"
      - ".github/ship-tail.json"
  push:
    branches: [main, next]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "analytics/**"
      - "worker/**"
      - ".github/ship-tail.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: for f in .github/scripts/alert.mjs .github/scripts/waiting.mjs worker/lib/alert-lib.js worker/mail/worker.js worker/uptime/worker.js worker/reviews/worker.js; do [ ! -f "$f" ] || node --check "$f"; done
      - name: Jobs pinned to ubuntu-24.04
        run: "! grep -rnE '^[[:space:]]*runs-on:[[:space:]]*ubuntu-latest' .github/workflows/"
      - name: Engine self-test
        run: node .github/scripts/alert.mjs selftest
      - name: Ship tail self-tests (alpha-only guard, data-rebuild skip, release notes, GA4 create-only)
        run: node .github/scripts/play-alpha.mjs selftest && node .github/scripts/ga4-admin.mjs selftest
      - name: Python wrapper self-test
        run: python3 -I analytics/alert.py --selftest
      - name: Sunday block self-test
        run: node .github/scripts/waiting.mjs --selftest
      - name: Weekly brief block test
        run: python3 -I -B analytics/test_run_block.py
      - name: Worker block test
        run: node worker/lib/test.mjs
      - name: Uptime Worker test
        run: node worker/uptime/test.mjs
      - name: Mail Worker test
        run: node worker/mail/test.mjs
      - name: Reviews Worker test
        run: node worker/reviews/test.mjs
      - name: Workers deploy self-test
        run: node .github/scripts/workers-deploy.mjs --selftest
      # worker/lib/alert-lib.js: QUIET and the isDaytime body equal alert.mjs's; each Worker that already holds the block holds it byte-identical
      - name: Worker block compare
        run: |
          node --input-type=module - <<'EOF'
          import fs from "node:fs";
          const read = f => (fs.existsSync(f) ? fs.readFileSync(f, "utf8") : null);
          const quiet = s => (/\bconst QUIET\s*=\s*(\{[^}]*\})/.exec(s) || [])[1];
          const body = s => {   // isDaytime's body, from its opening brace to the matching one
            const i = s.indexOf("function isDaytime(");
            if (i < 0) return null;
            const a = s.indexOf(") {", i) + 2;
            for (let j = a, depth = 0; j < s.length; j++) { if (s[j] === "{") depth++; else if (s[j] === "}" && !--depth) return s.slice(a, j + 1); }
            return null;
          };
          const START = "// >>> alert-lib v1", END = "// <<< alert-lib v1";
          const block = s => { const a = s.indexOf(START), b = s.indexOf(END); return a < 0 && b < 0 ? null : a < 0 || b < a ? "broken" : s.slice(a, b + END.length); };
          const eng = read(".github/scripts/alert.mjs"), lib = read("worker/lib/alert-lib.js");
          let bad = 0;
          const check = (c, m) => { console.log((c ? "ok   " : "FAIL ") + m); if (!c) bad++; };
          const ref = lib && block(lib);
          check(ref && ref !== "broken", "worker/lib/alert-lib.js holds the alert-lib v1 block");
          check(quiet(eng) && quiet(eng) === quiet(ref || ""), "QUIET equals alert.mjs");
          check(body(eng) && body(eng) === body(ref || ""), "isDaytime body equals alert.mjs");
          for (const f of ["worker/uptime/worker.js", "worker/mail/worker.js", "worker/reviews/worker.js"]) {
            const s = read(f), b = s && block(s);
            if (!b) { console.log(`skip ${f}: ${s ? "no alert-lib v1 block yet" : "not in the repo yet"}`); continue; }
            check(b === ref, f + " block is byte-identical to worker/lib/alert-lib.js");
          }
          process.exit(bad ? 1 : 0);
          EOF
