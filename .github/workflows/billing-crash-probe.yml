name: Billing crash probe (one-off)
on:
  push:
    branches: [probe/billing-crash]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node .github/scripts/billing-crash-probe.mjs
        env:
          SHIP_SA_JSON: ${{ secrets.SHIP_SA_JSON }}
