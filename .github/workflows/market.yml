name: Market data
on:
  schedule:
    - cron: "40 4 5 * *"   # monthly; the Ministry publishes closed months in the first days of the month
  workflow_dispatch:
    inputs:
      skip_gate:
        description: "Publish even when the sanity check finds the build incomplete or far off the published file (read the run log first)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: main-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # a failed or partial scan fails here and nothing is committed (the job goes red, so failure-alert reports it)
      - run: node .github/scripts/market.mjs
        env:
          SKIP_GATE: ${{ inputs.skip_gate && '1' || '0' }}
      - run: |
          cp out/market.json market.json
          if [ -n "$(git status --porcelain market.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add market.json && git commit -m "Update market data" && { git push || { git pull --rebase -q origin main && git push; }; }
          fi
