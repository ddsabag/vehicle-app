name: Market data
on:
  schedule:
    - cron: "40 4 5 * *"   # monthly; the Ministry publishes closed months in the first days of the month
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/market.mjs
      - run: |
          cp out/market.json market.json
          if [ -n "$(git status --porcelain market.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add market.json && git commit -m "Update market data" && git push
          fi
