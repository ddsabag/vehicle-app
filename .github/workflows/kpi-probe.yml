name: KPI probe (CEO weekly file and the weekly report's numbers, probe-perf branch)
# The weekly numbers for the CEO thread's private file ceo/kpis.json (26.10): /live's own code as it is on main, run on the last whole week
# Sunday to Saturday; beside it the weekly report's own JSON (analytics/ from main, nothing sent) for the Sunday anomaly review, which has
# no other way to read it (the report keeps no artifact: a public repository's artifacts are downloadable). Both encrypted with
# .github/seo-data.pub.pem, on branch probe-kpi-out; the logs say only which part answered. Not for main.
# A run: a new last line in .github/kpi-run.txt ("end=YYYY-MM-DD" on that line picks another week's Saturday for the KPI file).
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/kpi-probe.mjs", ".github/workflows/kpi-probe.yml", ".github/kpi-run.txt"]
permissions:
  contents: read
concurrency: { group: kpi-probe, cancel-in-progress: false }
jobs:
  kpi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      kpi: ${{ steps.run.outputs.kpi }}
      live: ${{ steps.run.outputs.live }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: /live's code as it is on main
        run: |
          git fetch -q --depth=1 origin main
          git show FETCH_HEAD:worker/live/worker.js > "$RUNNER_TEMP/w.js"
          git show FETCH_HEAD:worker/live/wrangler.toml > "$RUNNER_TEMP/w.toml"
          echo "MAIN_SHA=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_ENV"
          end=$(tail -n 1 .github/kpi-run.txt 2>/dev/null | grep -oE 'end=[0-9]{4}-[0-9]{2}-[0-9]{2}' | cut -c5- || true)
          if [ -n "$end" ]; then echo "KPI_END=$end" >> "$GITHUB_ENV"; fi
      - id: run
        run: |
          node .github/scripts/kpi-probe.mjs
          # outputs in base64: a JSON secret's lines ("{", "}") are masks, and an output that contains a mask is dropped
          echo "kpi=$(base64 -w0 out/kpi.enc.json)" >> "$GITHUB_OUTPUT"
          if [ -f out/live.enc.json ]; then echo "live=$(base64 -w0 out/live.enc.json)" >> "$GITHUB_OUTPUT"; fi
        env:
          W_JS: ${{ runner.temp }}/w.js
          W_TOML: ${{ runner.temp }}/w.toml
          W_TMP: ${{ runner.temp }}/kpi-worker.mjs
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  weekly:
    # pip packages run here, so this job only reads (as the report's own job does); the encrypted file goes to "publish" as an output
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      weekly: ${{ steps.run.outputs.weekly }}
    steps:
      - uses: actions/checkout@v4
      - name: analytics/ as it is on main
        run: |
          git fetch -q --depth=1 origin main
          rm -rf analytics && git checkout -q FETCH_HEAD -- analytics models.json
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: pip install -q -r analytics/requirements.txt
      - id: run
        run: |
          python analytics/run.py --out "$RUNNER_TEMP/wk"
          f=$(ls "$RUNNER_TEMP"/wk/luchit-weekly-*.json | head -1)
          node .github/scripts/kpi-probe.mjs encrypt "$f" out/weekly.enc.json
          echo "weekly=$(base64 -w0 out/weekly.enc.json)" >> "$GITHUB_OUTPUT"
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || secrets.BREVO_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    # no third-party code here: writes the encrypted files the other two jobs passed on, whichever answered
    needs: [kpi, weekly]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Publish on probe-kpi-out (encrypted only)
        env:
          KPI: ${{ needs.kpi.outputs.kpi }}
          LIVE: ${{ needs.kpi.outputs.live }}
          WEEKLY: ${{ needs.weekly.outputs.weekly }}
        run: |
          mkdir out && cd out
          if [ -n "$KPI" ]; then printf '%s' "$KPI" | base64 -d > kpi.enc.json; fi
          if [ -n "$LIVE" ]; then printf '%s' "$LIVE" | base64 -d > live.enc.json; fi
          if [ -n "$WEEKLY" ]; then printf '%s' "$WEEKLY" | base64 -d > weekly.enc.json; fi
          echo "kpi ${{ needs.kpi.result }}, weekly ${{ needs.weekly.result }}, run ${{ github.run_id }}" > run.txt
          ls *.enc.json > files.txt 2>/dev/null || true
          git init -q && git checkout -q -b probe-kpi-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "KPI probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-kpi-out
          # a job that answered but whose file did not arrive turns this run red (probe-perf runs never page anyone)
          if [ "${{ needs.kpi.result }}" = success ] && [ ! -s kpi.enc.json ]; then echo "::error::the KPI file did not arrive"; exit 1; fi
          if [ "${{ needs.weekly.result }}" = success ] && [ ! -s weekly.enc.json ]; then echo "::error::the weekly report's file did not arrive"; exit 1; fi
