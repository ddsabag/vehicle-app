name: Upgrade and alerts check (one-off)
# 5.11.2026: does updating the app from 1.38.3 to 1.38.4 keep saved cars and car-file documents? Runs only on pushes to this branch.
on:
  push:
    branches: [qa/upgrade-check]
permissions:
  contents: read
jobs:
  apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Build both versions with one debug key (old = 1.38.3 release commit, new = 1.38.4 release commit)
        run: |
          git worktree add ../old 025f3af0
          git worktree add ../new d25cec2e
          for v in old:155 new:163; do d=${v%%:*}; c=${v##*:}; (cd ../$d/android && VN=$(grep -oP 'APP_VERSION = "\K[^"]+' ../index.html) && gradle --no-daemon assembleQa -PversionCode=$c -PversionName=$VN && cp app/build/outputs/apk/qa/app-qa.apk $GITHUB_WORKSPACE/$d.apk); done
          ls -la *.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: "*.apk"
          retention-days: 2
  device:
    needs: apks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.api == 35 && 'swangle_indirect' || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: node .github/scripts/alerts-check.cjs new.apk alerts-${{ matrix.api }}.json
