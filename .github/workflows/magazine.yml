name: Magazine
# Everything the magazine publishes, in one workflow (formerly Magazine, Magazine data articles and Newsletter):
# - monthly article, the 6th at 08:07 UTC (magazine.mjs, one run a month): the market summary of the latest closed month. Its prose comes
#   from Claude (magazine-ai.mjs through the shared helper claude.mjs, repo secret ANTHROPIC_API_KEY; plan of 28.10): no key, an API error,
#   a refusal or a draft that fails the number check leaves the fixed template, and the repository variable MAGAZINE_AI=0 switches Claude off.
#   The title always comes from the data. A key or credit failure raises ai:key (Dudu acts), an unreachable API ai:mag (quiet).
# - weekly data article, Thursday 05:30 UTC (magazine-data.mjs): at most ONE data article not yet out for the current modelstats refresh,
#   new models of a closed quarter first, then recalls, then off-road. Text comes only from model/stats.json (no AI prose). Model pages are
#   not rebuilt for it (21-day rule): the "mentioned in the magazine" links appear on them with the next pages.mjs run.
#   Both go through the same check-and-publish step: published on its own after seo-check passes (silent Telegram notice), otherwise an alert.
#   The job is named after the part ("article" or "data-article") so Failure alert never takes a failure of one for a repeat of the other.
# - newsletter (newsletter.mjs): after the monthly article PR is merged (a push that changes magazine/posts.json on main) it prepares the Brevo
#   campaign for it. By default it only saves a DRAFT in Brevo for you to review and send (a Telegram line says it is waiting); the repository
#   variable NEWSLETTER_AUTOSEND=true sends it automatically (and Telegram says it went out). Run it by hand (part = newsletter) for a preview. It is not a main writer, so it keeps its own queue.
# - ai-test, by hand only: the comparison of the monthly prose, the template and Claude's draft side by side for the last 5 closed months,
#   sealed on the branch magazine-ai-test. Writes no site file and never main, so it keeps its own queue too.
# The run name carries the part ("Magazine (data)"): Failure alert counts only a newer run of the same part as taking a cancelled run's place,
# and Web deploy skips the newsletter runs (they never change main; the push that started one already triggers Web deploy itself).
run-name: Magazine (${{ github.event.schedule == '30 5 * * 4' && 'data' || github.event_name == 'push' && 'newsletter' || inputs.part || 'monthly' }})
on:
  schedule:
    - cron: "7 8 6 * *"    # monthly article: the 6th (off the full hour, when GitHub delays or drops the most scheduled runs), after market.yml and models.yml (5th) and after modelstats.yml has finished (starts 05:20, up to 2 hours)
    - cron: "30 5 * * 4"   # weekly data article: Thursday
  push:
    branches: [main]
    paths: ["magazine/posts.json"]   # newsletter only
  workflow_dispatch:
    inputs:
      part:
        description: "monthly = the monthly article | data = one data article | newsletter = the newsletter (see mode) | ai-test = template vs Claude, last 5 months (no site file)"
        type: choice
        options: [monthly, data, newsletter, ai-test]
        default: monthly
      mode:
        description: "Newsletter only: preview = render only | draft = save in Brevo | send = send now"
        type: choice
        options: [preview, draft, send]
        default: preview
permissions:
  contents: write
  pull-requests: write
  pages: write
concurrency:
  # the articles commit to main and share its queue; the newsletter only reads, as before, and the comparison writes only its own branch
  group: ${{ (github.event_name == 'push' || inputs.part == 'newsletter') && 'newsletter' || inputs.part == 'ai-test' && 'magazine-ai-test' || 'main-writer' }}
  cancel-in-progress: false
jobs:
  article:
    # the part is picked by the cron line that fired (github.event.schedule), not by the clock, since GitHub starts scheduled runs late
    name: ${{ (github.event.schedule == '30 5 * * 4' || inputs.part == 'data') && 'data-article' || 'article' }}
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.part != 'newsletter' && inputs.part != 'ai-test') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event.schedule == '30 5 * * 4' || inputs.part == 'data') && 10 || 40 }}
    env:
      KIND: ${{ (github.event.schedule == '30 5 * * 4' || inputs.part == 'data') && 'data' || 'monthly' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # the ministry's recall lists per maker (catalog-data branch, catalog.yml) for the model pages' recall section (model-recalls.mjs);
      # without them pages.mjs builds the pages without that section and prints a warning
      - name: Recall lists for the model pages
        run: |
          git fetch -q --depth 1 origin catalog-data && mkdir -p cat-data && git archive FETCH_HEAD r meta.json | tar -x -C cat-data \
            || echo "::warning::catalog-data could not be read: the model pages are built without their recall section"
      # the monthly prose comes from Claude (magazine-ai.mjs): the SDK only when the key is there and MAGAZINE_AI is not 0; a failed install
      # leaves the template, the same as no key
      - name: Claude SDK for the monthly prose
        if: env.KIND == 'monthly' && vars.MAGAZINE_AI != '0'
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then echo "no ANTHROPIC_API_KEY: the template writes the article"; exit 0; fi
          sdk=$(node --input-type=module -e 'console.log((await import(process.cwd() + "/.github/scripts/claude.mjs")).SDK)')
          npm install --prefix .github/scripts --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "$sdk" >/dev/null \
            || echo "::warning::the Claude SDK did not install: the template writes the article"
      - name: Write the article
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ env.KIND == 'monthly' && secrets.ANTHROPIC_API_KEY || '' }}
          MAGAZINE_AI: ${{ vars.MAGAZINE_AI }}
        run: |
          if [ "$KIND" = data ]; then
            done=""
            for t in newmodels recalls offroad; do
              if node .github/scripts/magazine-data.mjs $t; then done=$t; break; fi
            done
            if [ -z "$done" ]; then echo "nothing new to publish"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            slug=$(node -e 'console.log(require("./magazine/posts.json").find(p=>p.slug.startsWith("'$done'-")).slug)')
            echo "slug=$slug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # a scheduled run only writes a new month: when market.json was not refreshed on the 5th (its sanity check failed, or the ministry
          # had not closed the month yet), its latest month is the one already out, and that article must not be rewritten
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            slug=$(node -e 'const k=Object.keys(require("./market.json").months).sort().pop();console.log(k.slice(0,4)+"-"+k.slice(4))')
            if [ -e "magazine/$slug/index.html" ]; then echo "magazine/$slug is already out: market.json has no newer month"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          set +e
          node .github/scripts/magazine.mjs
          code=$?
          # exit 2 = the latest month is not closed yet or looks partial: nothing to publish
          if [ $code -eq 2 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - name: Check and publish
        if: steps.gen.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          DATA_SLUG: ${{ steps.gen.outputs.slug }}
          WRITER: ${{ steps.gen.outputs.writer }}
          AI: ${{ steps.gen.outputs.ai }}
        run: |
          # Dudu 2026-10-15: publish on its own after the automatic checks; a failed check sends an alert (monthly: and opens a PR instead).
          # tg <text> [silent] [level] [router key]: through the alert router (alert.mjs, Dudu 25.10) when a key is given; it hands back = the direct send
          tg() {
            if [ -n "${4:-}" ]; then
              out=$(timeout 45 node .github/scripts/alert.mjs send "${3:-day}" "$4" --today "$([ "${2:-false}" = true ] && echo silent || echo loud)" --plain --link "https://luchit.app/magazine/" --text "$1" 2>/dev/null || true)
              case "$out" in *ALERT_DONE*) return 0 ;; esac
            fi
            [ -n "$TELEGRAM_BOT_TOKEN" ] && curl -s -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$1" --data-urlencode "disable_notification=${2:-false}" || true
          }
          cls() { node .github/scripts/tg-text.mjs tag "$1" seo; }   # the Telegram standard's first line (plain text), e.g. "✅ בוצע · SEO"
          # the monthly prose (magazine-ai.mjs): ai:key when the key or the credit failed (Dudu acts), ai:mag when the API could not be reached
          # (quiet); an answered call closes both. The article goes on either way, and its notice says who wrote the text (wline).
          wline=""
          if [ "$KIND" = monthly ]; then
            case "$AI" in
              ok) timeout 30 node --input-type=module -e 'const r = await import(process.cwd() + "/.github/scripts/alert.mjs"); await r.resolve(["ai:mag", "ai:key"]);' >/dev/null 2>&1 || true ;;
              key) tg "$(node .github/scripts/tg-text.mjs tag today bots)"$'\n'"המפתח של Claude לא עובד, או שהקרדיט החודשי נגמר"$'\n'"כתבת המגזין החודשית נכתבה בינתיים מהתבנית הקבועה, בלי Claude."$'\n'"👉 מה לעשות: לבדוק ב-Console של Anthropic, ב-workspace luchit-bots, שהמפתח פעיל ושנשאר קרדיט. אם צריך מפתח חדש, להדביק אותו ב-GitHub בסוד ANTHROPIC_API_KEY." false day "ai:key" ;;
              mag) tg "$(cls info)"$'\n'"Claude לא היה זמין לכתבת המגזין החודשית"$'\n'"הכתבה נכתבה מהתבנית הקבועה, כמו לפני Claude, ובחודש הבא זה ינוסה שוב."$'\n'"👌 לא צריך לעשות כלום." true summary "ai:mag" ;;
            esac
            case "$WRITER:$AI" in
              claude:*) wline="הטקסט נכתב עם Claude ועבר את הבדיקות האוטומטיות."$'\n' ;;
              template:ok) wline="הטקסט נכתב מהתבנית הקבועה, כי הטיוטה של Claude לא עברה את הבדיקות האוטומטיות."$'\n' ;;
              template:key|template:mag) wline="הטקסט נכתב מהתבנית הקבועה, כי Claude לא היה זמין."$'\n' ;;
            esac
          fi
          if [ "$KIND" = monthly ]; then
            node .github/scripts/pages.mjs
            paths=(magazine sitemap.xml model)
            if [ -z "$(git status --porcelain "${paths[@]}")" ]; then echo "nothing new"; exit 0; fi
            # the newest monthly article (slug YYYY-MM): on a day a data article also came out, that one can share the date and sort first
            slug=$(node -e 'console.log(require("./magazine/posts.json").find(p=>/^\d{4}-\d{2}$/.test(p.slug)).slug)')
            msg="Magazine: article for $slug (automatic publish after checks)"
          else
            paths=(magazine sitemap.xml)
            slug=$DATA_SLUG
            msg="Magazine: $slug (automatic data article after checks)"
          fi
          title=$(node -e 'console.log(require("./magazine/posts.json").find(p=>p.slug==="'$slug'").title)')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if node .github/scripts/seo-check.mjs; then
            git add "${paths[@]}"
            git commit -m "$msg"
            git push origin HEAD:main || { git pull --rebase -q origin main && git push origin HEAD:main; }
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null 2>&1 || true
            tg "$(cls done)"$'\n'"כתבה חדשה במגזין עלתה לאתר"$'\n'"$title"$'\n'"https://luchit.app/magazine/$slug/"$'\n'"$wline""👌 לא צריך לעשות כלום." true summary "mag:pub:$slug"
            node .github/scripts/flash.mjs content info "המגזין פורסם: $title" "https://luchit.app/magazine/$slug/"
          elif [ "$KIND" = monthly ]; then
            branch="magazine/$slug"
            git checkout -b "$branch"
            git add "${paths[@]}"
            git commit -m "Magazine: article for $slug"
            git push --force origin "$branch"
            gh pr create --base main --head "$branch" --title "Magazine: $slug" --body "The automatic checks failed, so this article was not published. See the run log." || true
            tg "$(cls today)"$'\n'"כתבת המגזין החודשית לא עלתה"$'\n'"הבדיקות האוטומטיות של הדפים נכשלו, ולכן הכתבה ($slug) נשמרה בבקשת שינוי (PR) ב-GitHub ולא פורסמה."$'\n'"👉 מה לעשות: לכתוב לי בשרשור SEO, ואבדוק ואפרסם אותה." false day "mag:fail:$slug"
            node .github/scripts/flash.mjs content alert "כתבת המגזין $slug לא פורסמה: בדיקות ה-SEO האוטומטיות נכשלו, נפתח PR"
          else
            # a data article is not kept: the next weekly run writes it again. The red run also makes Failure alert page, as before.
            tg "$(cls today)"$'\n'"כתבת נתונים במגזין לא עלתה"$'\n'"הבדיקות האוטומטיות של הדפים נכשלו ($slug). ההרצה השבועית הבאה תכתוב אותה מחדש."$'\n'"👉 מה לעשות: אם זה חוזר גם בשבוע הבא, לכתוב לי בשרשור SEO." false day "mag:fail:$slug"
            node .github/scripts/flash.mjs content alert "כתבת המגזין $slug לא פורסמה: בדיקות ה-SEO האוטומטיות נכשלו"
            exit 1
          fi
  ai-test:
    # by hand only (part = ai-test): the comparison before Claude writes the monthly prose (plan of 28.10). For the last 5 closed months of
    # market.json, magazine.mjs with MAGAZINE_DRY=1 writes the fixed template and Claude's draft side by side, and no site file. The output
    # holds token counts, so it leaves the run sealed with the SEO data key (.github/seo-data.pub.pem), on the branch magazine-ai-test.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.part == 'ai-test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Self-tests (the Claude helper and the magazine prose, offline)
        run: node .github/scripts/claude.mjs --selftest && node .github/scripts/magazine-ai.mjs --selftest
      - name: Claude SDK
        run: |
          sdk=$(node --input-type=module -e 'console.log((await import(process.cwd() + "/.github/scripts/claude.mjs")).SDK)')
          npm install --prefix .github/scripts --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "$sdk" >/dev/null
      - name: The last 5 closed months, the template and Claude side by side
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAGAZINE_DRY: "1"
        run: |
          months=$(node -e 'const n = new Date(), cur = n.getUTCFullYear() * 100 + n.getUTCMonth() + 1; console.log(Object.keys(require("./market.json").months).filter(k => +k < cur).sort().slice(-5).join(" "))')
          for ym in $months; do node .github/scripts/magazine.mjs "$ym" || echo "$ym: exit $?"; done
      - name: Seal it and put it on the branch magazine-ai-test
        run: |
          node --input-type=module -e '
            import fs from "node:fs"; import crypto from "node:crypto";
            const dir = "out/magazine-ai", all = fs.readdirSync(dir).filter(f => f.endsWith(".json")).sort().map(f => JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")));
            const key = crypto.randomBytes(32), iv = crypto.randomBytes(12), c = crypto.createCipheriv("aes-256-gcm", key, iv);
            const data = Buffer.concat([c.update(JSON.stringify(all)), c.final()]);
            const ek = crypto.publicEncrypt({ key: fs.readFileSync(".github/seo-data.pub.pem", "utf8"), padding: crypto.constants.RSA_PKCS1_OAEP_PADDING, oaepHash: "sha256" }, key);
            fs.mkdirSync("sealed", { recursive: true });
            fs.writeFileSync("sealed/magazine-ai.enc.json", JSON.stringify({ v: 1, ek: ek.toString("base64"), iv: iv.toString("base64"), tag: c.getAuthTag().toString("base64"), data: data.toString("base64") }));
            console.log("sealed:", all.map(x => x.slug + " " + (x.claude ? "claude" : "template")).join(", "));'
          cd sealed && git init -q && git checkout -q -b magazine-ai-test && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Magazine prose comparison (sealed)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" magazine-ai-test
  newsletter:
    if: ${{ github.event_name == 'push' || inputs.part == 'newsletter' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write   # only for the alert router's state on the alert-state branch; the newsletter never writes main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: node .github/scripts/newsletter.mjs
        env:
          BREVO_KEY: ${{ secrets.BREVO_KEY || secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (vars.NEWSLETTER_AUTOSEND == 'true' && 'send' || 'draft') }}
      - uses: actions/upload-artifact@v7
        with: { name: newsletter-preview, path: out/newsletter.html }
