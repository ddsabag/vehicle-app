name: Magazine
on:
  schedule:
    - cron: "20 5 6 * *"   # the 6th, after market.yml has refreshed market.json on the 5th
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the monthly article
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          node .github/scripts/magazine.mjs
          code=$?
          # exit 2 = the latest month is not closed yet or looks partial: nothing to publish
          if [ $code -eq 2 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - name: Open a pull request for review
        if: steps.gen.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/pages.mjs
          if [ -z "$(git status --porcelain magazine sitemap.xml model)" ]; then echo "nothing new"; exit 0; fi
          slug=$(node -e 'console.log(require("./magazine/posts.json")[0].slug)')
          branch="magazine/$slug"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add magazine sitemap.xml model
          git commit -m "Magazine: article for $slug"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --title "Magazine: $slug" --body "Monthly market article, generated from market.json. Review the text and the numbers, then merge to publish." || echo "PR already exists"
