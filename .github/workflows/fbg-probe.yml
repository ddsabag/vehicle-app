name: FB group tags probe (one-off, probe-perf branch)
# Read-only, 7.11.2026: what each Facebook group tag brought to date, for marketing's posting pace proposal.
# The output is encrypted with .github/seo-data.pub.pem, so no business number is in the log or the branch in clear. Runs on a push to the
# probe-perf branch only; output on the probe-fbg-out branch.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/fbg-probe.mjs", ".github/workflows/fbg-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/fbg-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish on probe-fbg-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b probe-fbg-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "FB group tags probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-fbg-out
