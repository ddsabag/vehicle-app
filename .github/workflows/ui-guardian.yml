name: UI guardian (browser)
# PROBE BRANCH ONLY (qa-webkit-probe, 26.10): the Safari-engine findings of run 40363962519 (b3e37d7b), explained and checked.
# A: the b3e37d7b suite with only diagnostics added (what lay over a control, the open sheet, every toast) on the two failing journeys.
# B: one file stored in the page's database, in a test context that keeps nothing and in a profile on disk.
# C: this branch's suite in Safari's engine, as the guardian runs it. Every step reports and none fails the run.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Install test tools (not part of the app)
        run: |
          npm install --no-save --no-package-lock playwright axe-core pixelmatch@5.3.0 pngjs@7.0.0
          npx playwright install --with-deps chromium webkit
      - name: "A: the b3e37d7b suite with diagnostics, Safari's engine"
        continue-on-error: true
        run: |
          git show b3e37d7b:.github/scripts/ui-flows.cjs > .github/scripts/ui-flows-old.cjs
          node --input-type=module - <<'EOF'
          import fs from "node:fs";
          const f = ".github/scripts/ui-flows-old.cjs"; let s = fs.readFileSync(f, "utf8");
          const sub = (a, b) => { if (!s.includes(a)) throw new Error("anchor missing: " + a.slice(0, 60)); s = s.replace(a, b); };
          sub(`const told = (p) => p.evaluate(() => (document.getElementById("toast") || {}).textContent || "");`,
              `const told = (p) => p.evaluate(() => [...(window.__toasts || []), (document.getElementById("toast") || {}).textContent || ""].filter(Boolean).join(" | "));`);
          sub(`window.__fx = 0; const fx = () => { window.__fx++; };`,
              `window.__toasts = []; document.addEventListener("DOMContentLoaded", () => { const t = document.getElementById("toast"); if (t) new MutationObserver(() => { const x = t.textContent.trim(); if (x) window.__toasts.push(x); }).observe(t, { childList: true, characterData: true, subtree: true }); }); window.__fx = 0; const fx = () => { window.__fx++; };`);
          sub(`await page.evaluate(() => { window.__cls.v = 0; window.__cls.src = []; });`,
              `await page.evaluate(() => { window.__cls.v = 0; window.__cls.src = []; window.__toasts = []; });`);
          sub(`add("block", "logic", run, step, "could not act: " + e.message.split("\\n")[0].slice(0, 120));`,
              `const st = await page.evaluate(() => ({ open: [...document.querySelectorAll(".sheet:not([hidden]), .doc-view, .ch-menu")].filter((x) => x.getClientRects().length).map((x) => x.id || x.className), kb: document.body.classList.contains("kb") })).catch(() => ({})); add("block", "logic", run, step, "could not act: " + e.message.split("\\n")[0].slice(0, 120) + " [" + ((String(e.message).match(/<[^\\n]*?> intercepts pointer events/) || [""])[0].slice(0, 90)) + "] open " + JSON.stringify(st));`);
          fs.writeFileSync(f, s); console.log("patched");
          EOF
          node .github/scripts/ui-flows-old.cjs --engine webkit --no-sweep --filter '^(file-door|keeps)/one/web-390/light$' --out uf-old || true
          node -e 'for (const x of require("./uf-old/findings.json")) console.log(x.sev, x.run, x.step, "::", x.msg)' || true
      - name: "B: a file in the page's database, two kinds of context"
        continue-on-error: true
        run: |
          node - <<'EOF' || true
          const { webkit } = require("playwright"); const fs = require("node:fs"), os = require("node:os"), path = require("node:path"), http = require("node:http");
          const srv = http.createServer((q, r) => { r.writeHead(200, { "content-type": "text/html" }); r.end("<!doctype html><title>t</title>"); });
          const probe = (page) => page.evaluate(() => new Promise((ok) => {
            const r = indexedDB.open("probe", 1);
            r.onupgradeneeded = () => r.result.createObjectStore("docs", { keyPath: "id", autoIncrement: true });
            r.onerror = () => ok("open failed: " + (r.error && r.error.message));
            r.onsuccess = () => { try { const t = r.result.transaction("docs", "readwrite"); t.objectStore("docs").add({ blob: new Blob(["x"], { type: "image/jpeg" }) });
              t.oncomplete = () => ok("stored"); t.onerror = () => ok("refused: " + (t.error && t.error.name + " " + t.error.message)); t.onabort = () => ok("aborted: " + (t.error && t.error.name + " " + t.error.message)); }
              catch (e) { ok("threw: " + e.name + " " + e.message); } };
          }));
          (async () => {
            await new Promise((ok) => srv.listen(0, "127.0.0.1", ok)); const url = `http://127.0.0.1:${srv.address().port}/`;
            const b = await webkit.launch(); const c1 = await b.newContext(); const p1 = await c1.newPage(); await p1.goto(url);
            console.log("WebKit, a context that keeps nothing:", await probe(p1)); await b.close();
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), "wk-")); const c2 = await webkit.launchPersistentContext(dir); const p2 = await c2.newPage(); await p2.goto(url);
            console.log("WebKit, a profile on disk:", await probe(p2)); await c2.close(); srv.close();
          })();
          EOF
      - name: "C: this branch's suite in Safari's engine, as the guardian runs it"
        continue-on-error: true
        run: |
          node .github/scripts/ui-flows.cjs --engine webkit --no-sweep --filter '/web-390/|/web-768/light' --out ui-flows-webkit || true
          node -e 'for (const x of require("./ui-flows-webkit/findings.json")) console.log(x.sev, x.run, x.step, "::", x.msg)' || true
