name: IndexNow
# After a push to main changes site pages, tell Bing and the other IndexNow engines which URLs changed.
on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml"]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every sitemap URL"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sleep 60   # GitHub Pages deploy
      - run: node .github/scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
        env:
          ALL: ${{ inputs.all && '1' || '0' }}
