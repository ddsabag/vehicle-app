name: Sunday review checks probe (one-off, probe-perf branch)
# Read-only, 15.11.2026: saves without from=add by app version (1.38.5 check) and the 1.38.5 storage events, for the Sunday review.
# The output is encrypted with .github/seo-data.pub.pem, so no business number is in the log or the branch in clear. Runs on a push to the
# probe-perf branch only; output on the probe-sun1511-out branch.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/sun1511-probe.mjs", ".github/workflows/sun1511-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/sun1511-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish on probe-sun1511-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b probe-sun1511-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Share-word read probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-sun1511-out
