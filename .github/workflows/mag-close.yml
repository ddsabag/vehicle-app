name: Magazine stale failure close (one-off, ops-mag-close branch)
# Closes mag:fail:2026-10 in the router: the 6.11 08:53 UTC monthly run's checks failed (PR #35, closed), and the 09:22 hand run published
# the article (mag:pub:2026-10), but the publish path did not resolve the fail key (SEO's PR #37 adds that). Not told again: the publish
# message already said it. State on alert-state; ops, morning triage 7.11.2026.
on:
  push:
    branches: [ops-mag-close]
    paths: [".github/workflows/mag-close.yml"]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Close mag:fail:2026-10 (main's alert.mjs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module -e 'const m = await import("./.github/scripts/alert.mjs"); const n = await m.resolve(["mag:fail:2026-10"], { tell: false }); console.log("mag:fail:2026-10 closed:", n);'
