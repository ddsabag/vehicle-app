name: Magazine data articles
# Weekly (Thursday 05:30 UTC) publishes at most ONE data article that is not yet out for the current modelstats refresh:
# recalls first, then off-road. Text comes only from model/stats.json (no AI prose). Publishes on its own after seo-check passes,
# with a Telegram notice; a failed check publishes nothing and sends an alert. Model pages are not rebuilt here (21-day rule): the
# "mentioned in the magazine" links appear on them with the next pages.mjs run.
on:
  schedule:
    - cron: "30 5 * * 4"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: magazine-data
jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish one data article
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          tg() { [ -n "$TELEGRAM_BOT_TOKEN" ] && curl -s -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$1" --data-urlencode "disable_notification=${2:-false}" || true; }   # 2nd argument "true" = silent (routine notice)
          done=""
          for t in recalls offroad; do
            if node .github/scripts/magazine-data.mjs $t; then done=$t; break; fi
          done
          if [ -z "$done" ]; then echo "nothing new to publish"; exit 0; fi
          slug=$(node -e 'console.log(require("./magazine/posts.json").find(p=>p.slug.startsWith("'$done'-")).slug)')
          title=$(node -e 'console.log(require("./magazine/posts.json").find(p=>p.slug==="'$slug'").title)')
          if node .github/scripts/seo-check.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add magazine sitemap.xml
            git commit -m "Magazine: $slug (automatic data article after checks)"
            git push origin HEAD:main || { git pull --rebase -q origin main && git push origin HEAD:main; }
            gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true
            tg "המגזין פורסם: $title https://luchit.app/magazine/$slug/" true
            node .github/scripts/flash.mjs content info "המגזין פורסם: $title" "https://luchit.app/magazine/$slug/"
          else
            tg "כתבת המגזין $slug לא פורסמה: בדיקות ה-SEO האוטומטיות נכשלו."
            node .github/scripts/flash.mjs content alert "כתבת המגזין $slug לא פורסמה: בדיקות ה-SEO האוטומטיות נכשלו"
            exit 1
          fi
