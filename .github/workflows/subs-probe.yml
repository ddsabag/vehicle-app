name: Magazine subscribers probe (one-off, probe-perf branch)
# Read-only, 22.11.2026: the magazine list in Brevo by date and source (no addresses), encrypted with .github/seo-data.pub.pem.
# Runs on a push to the probe-perf branch only; output on the probe-subs-out branch.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/subs-probe.mjs", ".github/workflows/subs-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/subs-probe.mjs
        env:
          BREVO_KEY: ${{ secrets.BREVO_KEY || secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
      - name: Publish on probe-subs-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b probe-subs-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Subscribers probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-subs-out
