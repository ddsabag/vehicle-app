name: GA probe (one-off, probe-go branch)
on:
  push:
    branches: [probe-go]
    paths: [".github/scripts/live25-probe.mjs", ".github/scripts/rt2-probe.mjs", ".github/scripts/rt-probe.mjs", ".github/scripts/ch-probe.mjs", ".github/scripts/ui-probe.mjs", ".github/scripts/live-ui.mjs", ".github/scripts/cf-off-probe.mjs", ".github/scripts/site-probe.mjs", ".github/scripts/deploy-probe.mjs", ".github/scripts/ga-burst-probe.mjs", ".github/scripts/cf-filter-probe.mjs", ".github/scripts/cf-dup-probe.mjs", ".github/scripts/live24-probe.mjs", ".github/scripts/live24.mjs", ".github/scripts/live-probe.mjs", ".github/scripts/audit-probe.mjs", ".github/scripts/cf-probe.mjs", ".github/workflows/ga-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm i --no-save --no-audit --no-fund playwright-core@1.48.2 > /dev/null 2>&1; ls -la /usr/bin/google-chrome
      - run: mkdir -p out && node .github/scripts/live25-probe.mjs > out/report.txt 2>&1; wc -c out/report.txt
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish on inspect-output
        run: |
          cd out && git init -q && git checkout -q -b inspect-output && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "GA probe"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" inspect-output
