name: Data status
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/status.mjs
      - name: Publish to data-status branch
        run: |
          cd out
          git init -q -b data-status
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add status.json
          git commit -qm "status $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data-status
