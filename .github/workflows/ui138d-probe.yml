name: UI 1.38 js_error probe D (one-off, probe-perf branch)
# Read-only, 5.11.2026: the 1.38 vs 1.37 read (GA4) js_error by day, kind and page for product.
# The output is encrypted with .github/seo-data.pub.pem, so no business number is in the log or the branch in clear. Runs on a push to the
# probe-perf branch only; output on the probe-ui138d-out branch.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/ui138d-probe.mjs", ".github/workflows/ui138d-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/ui138d-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish on probe-ui138d-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b probe-ui138d-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "UI 1.38 js_error probe D (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-ui138d-out
