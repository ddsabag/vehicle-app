name: Fuel price
on:
  schedule:
    - cron: "17 5 * * *"   # daily; the regulated price changes on the 1st of the month
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: node .github/scripts/fuel.mjs
      - run: |
          if ! git diff --quiet -- fuel.json || [ -n "$(git status --porcelain fuel.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fuel.json && git commit -m "Update fuel price" && git push
          fi
