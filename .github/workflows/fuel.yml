name: Fuel price
on:
  schedule:
    - cron: "17 5 * * *"   # daily: the regulated price changes on the 1st and sometimes mid-month (an excise change); a day with no change commits nothing
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # pdftotext reads the official PDF; if apt fails, the script still runs (the PDF read fails and is logged) instead of a false failure alert
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils >/dev/null
        continue-on-error: true
      - run: node .github/scripts/fuel.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          if ! git diff --quiet -- fuel.json || [ -n "$(git status --porcelain fuel.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fuel.json && git commit -m "Update fuel price" && { git push || { git pull --rebase -q origin main && git push; }; }
          fi
