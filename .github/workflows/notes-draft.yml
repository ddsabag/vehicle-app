name: Release notes draft
# Release-notes drafter (product thread; monthly API credit, Dudu 1.11.2026 21:16 "נלך על 2 החבילות"): on a push to a release-* branch whose
# android/release-notes.txt does not yet carry its APP_VERSION, one Claude call (Sonnet 5.5, structured output) turns the commits since main
# into a Hebrew draft that passes Ship tail's rules (notes-draft.mjs). It never edits the release branch: notes-<version>.txt goes to the
# branch release-drafts and one quiet notes:<version> item to the router (owner: product), which edits it before "שחרר".
# With no key, no SDK or an API error the run stays green: ai:notes (ai:key when the key or the credit is the cause) goes to the router.
# Not in failure-alert's re-run list: a run sends a paid request, so a crash is told and never re-run by itself.
on:
  push:
    branches: ["release-*"]
  workflow_dispatch:
    inputs:
      dry:
        description: "No call to Claude (checks the plumbing only)"
        type: boolean
        default: false
      force:
        description: "Draft even when the notes for this version are already written"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: notes-draft-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The Claude SDK (the version pinned in claude.mjs; the app never loads it)
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund --loglevel=error "$(sed -n 's/^export const SDK = "\(.*\)";$/\1/p' .github/scripts/claude.mjs)"
      - name: Draft the release notes
        run: node .github/scripts/notes-draft.mjs
        env:
          OUT: out
          BASE: origin/main
          DRY: ${{ inputs.dry && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Publish to the branch release-drafts
        if: ${{ hashFiles('out/notes-*.txt') != '' && !inputs.dry }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp out/notes-*.txt "$RUNNER_TEMP/" && cd "$(mktemp -d)" && git init -q && git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin release-drafts 2>/dev/null; then git checkout -q -B release-drafts FETCH_HEAD; else git checkout -q --orphan release-drafts; fi
          cp "$RUNNER_TEMP"/notes-*.txt . && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Release notes draft from ${GITHUB_REF_NAME}" || { echo "nothing new"; exit 0; }
          git push -q origin release-drafts
