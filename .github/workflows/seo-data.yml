name: SEO data snapshot
# Encrypted Search Console snapshot (queries, pages, sitemap status, URL Inspection of every sitemap URL) for the SEO work.
# Daily at 03:30 UTC and on demand. Output: branch seo-data (encrypted, readable only with the private key kept outside the repo).
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      extra_urls:
        description: "Extra URLs to inspect, comma-separated"
        default: ""
permissions:
  contents: write
concurrency: seo-data
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: node .github/scripts/seo-data.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          EXTRA_URLS: ${{ inputs.extra_urls }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish on the seo-data branch
        run: |
          cd out && git init -q && git checkout -q -b seo-data && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "SEO snapshot"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" seo-data
