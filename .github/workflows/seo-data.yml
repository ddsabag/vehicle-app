name: SEO data snapshot
# Encrypted Search Console snapshot (queries, pages, sitemap status, URL Inspection of every sitemap URL) for the SEO work.
# Daily at 03:30 UTC and on demand. Output: branch seo-data (encrypted, readable only with the private key kept outside the repo).
# Also the index guard: a Telegram when the number of indexed pages falls 10% or a key page (home, /check/, /magazine/) leaves the index.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      extra_urls:
        description: "Extra URLs to inspect, comma-separated"
        default: ""
      weekly:
        description: "Also write the weekly analysis draft (runs by itself on Mondays)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: seo-data
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Monday (or asked)? Then the weekly analysis draft too
        if: ${{ github.event_name == 'schedule' || inputs.weekly }}
        run: if [ "$(date -u +%u)" = 1 ] || [ "${{ inputs.weekly }}" = true ]; then echo "SEO_WEEKLY_PLAIN=$RUNNER_TEMP/seo-plain.json" >> "$GITHUB_ENV"; fi
      - run: node .github/scripts/seo-data.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          EXTRA_URLS: ${{ inputs.extra_urls }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # index guard (index-guard.mjs): one Telegram when Google drops indexed pages, through the alert router
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
      - name: Publish on the seo-data branch
        run: |
          cd out && git init -q && git checkout -q -b seo-data && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "SEO snapshot"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" seo-data
      # the weekly analysis draft (seo-weekly.mjs): Claude writes it from the week's facts; sealed with the same key, on the branch seo-weekly.
      # A failure here never fails the snapshot: the weekly SEO round then works from the snapshot alone, as before.
      - name: Weekly analysis draft
        if: ${{ env.SEO_WEEKLY_PLAIN != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -s "$SEO_WEEKLY_PLAIN" ] || { echo "::warning::weekly analysis: no snapshot to read"; exit 0; }
          node .github/scripts/seo-weekly.mjs --selftest >/dev/null || { echo "::warning::weekly analysis: self-test failed, nothing written"; exit 0; }
          sdk=$(node --input-type=module -e 'console.log((await import(process.cwd() + "/.github/scripts/claude.mjs")).SDK)')
          npm install --prefix .github/scripts --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "$sdk" >/dev/null
          timeout 20m node .github/scripts/seo-weekly.mjs "$SEO_WEEKLY_PLAIN" || { echo "::warning::weekly analysis: the draft was not written this week"; exit 0; }
          rm -f "$SEO_WEEKLY_PLAIN"
          cd out-weekly && git init -q && git checkout -q -b seo-weekly && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Weekly SEO analysis draft (sealed)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" seo-weekly
