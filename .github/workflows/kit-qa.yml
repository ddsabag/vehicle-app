name: Kit visual QA
run-name: Kit visual QA${{ (github.event.schedule || inputs.schedule) && format(' ({0})', github.event.schedule || inputs.schedule) || '' }}
# Claude looks at every image of the queued weekly kit before the autopost bot publishes it (.github/scripts/kit-qa.mjs; owner: marketing
# thread; Dudu approved 1.11.2026, monthly API credit package B): the PNG posts, the reel cover and five frames of each reel, one
# claude-sonnet-5-5 look each. Report only: branch kit-draft-out, qa-<kit date>/report.md; a finding never fails a run or stops a post.
# The kit run starts it by hand right after it queues a kit (input kit); the schedule is the fallback for a kit no run has looked at.
# Off: repo variable KIT_QA=off. No secret ANTHROPIC_API_KEY or no kit: it skips. Red only when the script itself crashes.
on:
  schedule:
    - cron: "40 13 * * 4"   # Thursday afternoon, after the kit run queued the week's kit
  workflow_dispatch:
    inputs:
      kit:
        description: "The kit folder on branch social-queue (kits/<this>), such as 2026-11-05; empty: the newest kit, if it has no report yet"
        required: false
        type: string
      schedule:
        description: "The backup clock's cron line (it starts a late slot by hand); empty by hand"
        required: false
        type: string
        default: ""
permissions:
  contents: write   # branch kit-draft-out, and the alert router's state (branch alert-state)
  actions: read     # slot-done.mjs lists this workflow's runs
concurrency:
  group: kit-draft-out
  cancel-in-progress: false
jobs:
  qa:
    if: ${{ vars.KIT_QA != 'off' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Was this slot already run? (the backup clock and GitHub's late run must not both call Claude)
        id: slot
        run: node .github/scripts/slot-done.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOT: ${{ github.event.schedule || inputs.schedule }}
      - uses: actions/setup-node@v7
        if: ${{ steps.slot.outputs.done != '1' }}
        with: { node-version: 20 }
      - name: The kit (branch social-queue)
        if: ${{ steps.slot.outputs.done != '1' }}
        id: kit
        env:
          KIT: ${{ inputs.kit }}
        run: |
          case "$KIT" in ""|[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::kit is a date such as 2026-11-05"; exit 1 ;; esac
          for i in 1 2 3 4; do git fetch -q --depth=1 origin social-queue && break; [ $i = 4 ] && exit 1; sleep $((i * 5)); done
          Q=$(git rev-parse FETCH_HEAD)
          if [ -z "$KIT" ]; then
            # the fallback looks only at the newest queued kit: older kits have gone out already (deep audit 22.11.2026)
            KIT=$(git ls-tree --name-only "$Q" kits/ | sed 's|kits/||' | sort -r | sed -n 1p)
            [ -n "$KIT" ] || { echo "::notice::no kit on social-queue: nothing to look at"; exit 0; }
            # the picked folder name goes into later run lines: only a date is passed on (deep audit 22.11.2026)
            case "$KIT" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::social-queue holds a kit folder that is not a date"; exit 1 ;; esac
            # its report, if any, is on kit-draft-out; when that branch exists but cannot be read, skip rather than pay for a second look
            R=0; git ls-remote --exit-code --heads origin kit-draft-out > /dev/null 2>&1 || R=$?
            DONE=""
            if [ "$R" = 0 ]; then
              for i in 1 2 3; do
                if git fetch -q --depth=1 origin kit-draft-out 2>/dev/null; then DONE=$(git ls-tree --name-only FETCH_HEAD | sed -n 's/^qa-//p'); break; fi
                [ $i = 3 ] && { echo "::notice::branch kit-draft-out could not be read: skips rather than look at kit $KIT twice"; exit 0; }
                sleep $((i * 5))
              done
            elif [ "$R" != 2 ]; then echo "::notice::could not ask GitHub for branch kit-draft-out: skips rather than look at kit $KIT twice"; exit 0; fi
            if echo "$DONE" | grep -qx "$KIT"; then echo "::notice::the newest kit ($KIT) already has a report: nothing to look at"; exit 0; fi
          fi
          git ls-tree --name-only "$Q" "kits/$KIT/" | grep -q . || { echo "::notice::no kits/$KIT on social-queue: skips"; exit 0; }
          mkdir -p kit && git archive "$Q" "kits/$KIT" | tar -x -C kit
          echo "dir=kit/kits/$KIT" >> "$GITHUB_OUTPUT"; echo "kit=$KIT" >> "$GITHUB_OUTPUT"
      - name: ffmpeg (for the reel frames; without it the frames are skipped)
        if: ${{ steps.slot.outputs.done != '1' && (steps.kit.outputs.kit) }}
        continue-on-error: true
        run: command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
      - name: The Claude API SDK (this run only; the app never loads it)
        if: ${{ steps.slot.outputs.done != '1' && (steps.kit.outputs.kit) }}
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund "$(node --input-type=module -e 'console.log((await import("./.github/scripts/claude.mjs")).SDK)')"
      - name: Kit visual QA
        id: qa
        if: ${{ steps.slot.outputs.done != '1' && (steps.kit.outputs.kit) }}
        env:
          ANTHROPIC_API_KEY: ${{ vars.AI != 'off' && secrets.ANTHROPIC_API_KEY || '' }}
          AI: ${{ vars.AI }}   # one switch for every Claude bot (claude.mjs gate; CEO review 12.11.2026)
          AI_CAP_USD: ${{ secrets.AI_CAP_USD }}   # a secret, so the amount never shows in the public log (rule 11)
          AI_GRANTS: ${{ secrets.AI_GRANTS }}
          KIT_QA: ${{ vars.KIT_QA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || secrets.BREVO_KEY }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          DRY_RUN: ${{ github.ref_name != 'main' && '1' || '0' }}
        run: node .github/scripts/kit-qa.mjs --kit "${{ steps.kit.outputs.dir }}" --out qa-out
      - name: The report to branch kit-draft-out
        if: ${{ steps.slot.outputs.done != '1' && (!cancelled() && steps.qa.outputs.wrote == '1') }}
        run: |
          bash .github/scripts/kit-out-push.sh qa-out "qa-${{ steps.kit.outputs.kit }}" "Kit visual QA: ${{ steps.kit.outputs.kit }}" "${{ secrets.GITHUB_TOKEN }}"
