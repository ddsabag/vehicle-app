name: Probe plate block
# One-off (data thread, 11.11): runs on a push to probe/plate-block only; data.gov.il read-only; the output is encrypted, the log prints states only
on:
  push:
    branches: [probe/plate-block]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: node .github/scripts/probe-plate-block.mjs

      - name: Publish the encrypted output
        if: false
        run: |
          cd out && git init -q && git checkout -q -b probe-plate-block-output && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Encrypted output"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-plate-block-output
