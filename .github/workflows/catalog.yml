name: Model catalogue
# The static model catalogue the comparison reads (maker › model › year › trim + engine, with the list price, counts and recalls):
# built from the ministry's datasets and published as small per-maker files on the catalog-data branch (one commit, force-pushed).
# The app falls back to live ministry queries when a file is missing, so a failed run costs nothing but freshness.
on:
  schedule:
    - cron: "20 9 * * *"   # 09:20 UTC (12:20 Israel summer time, 11:20 winter): a failure alert never comes at night, clear of the 04:00-04:30 data.gov.il checks
  workflow_dispatch:
    inputs:
      skip_gate:
        description: "Publish even when the catalogue dropped against the day before (the drop is real)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # the per-car recall list read against the active and inactive registers adds about 7 minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --max-old-space-size=6144 .github/scripts/catalog-build.mjs
        env:
          OUT: cat-out
          SKIP_GATE: ${{ inputs.skip_gate && '1' || '0' }}
      - name: Run the picker rules on what is new in the register (report + state next to the catalogue)
        run: node .github/scripts/catalog-rules.mjs
        env:
          OUT: cat-out
      - name: Telegram line when a rule needs a human (new models, unknown name cuts)
        if: ${{ hashFiles('cat-out/rules-alert.txt') != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "no Telegram credentials"; exit 0; }
          curl -s -o /dev/null -w "telegram %{http_code}\n" "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text@cat-out/rules-alert.txt" --data-urlencode "parse_mode=HTML" --data-urlencode "disable_notification=$(grep -q '^<b>🔵\|^<b>✅' cat-out/rules-alert.txt && echo true || echo false)" --data-urlencode "disable_web_page_preview=true"
          rm -f cat-out/rules-alert.txt
      - name: Mend and check the recall answers (what the build lost is kept from the day before; the per-car list's reach, new recall rows that match no model; report + state next to the catalogue)
        run: node .github/scripts/recall-health.mjs
        env:
          OUT: cat-out
      - name: Telegram line when the recall check found a change
        if: ${{ hashFiles('cat-out/recall-alert.txt') != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "no Telegram credentials"; exit 0; }
          curl -s -o /dev/null -w "telegram %{http_code}\n" "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text@cat-out/recall-alert.txt" --data-urlencode "parse_mode=HTML" --data-urlencode "disable_notification=$(grep -q '^<b>🔵\|^<b>✅' cat-out/recall-alert.txt && echo true || echo false)" --data-urlencode "disable_web_page_preview=true"
          rm -f cat-out/recall-alert.txt
      - name: Publish on the catalog-data branch
        run: |
          test -s cat-out/meta.json && ls cat-out/c | wc -l
          cd cat-out && git init -q && git checkout -q -b catalog-data && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Catalogue $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" catalog-data
