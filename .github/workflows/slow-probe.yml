name: Slow lookup probe (one-off, probe-slow branch)
# Read-only: how many car checks are slow and why (20.10). Runs on a push to the probe-slow branch only; output on the probe-slow-out branch
on:
  push:
    branches: [probe-slow]
    paths: [".github/scripts/slow-probe.mjs", ".github/scripts/forms-probe.mjs", ".github/workflows/slow-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: mkdir -p out && node .github/scripts/forms-probe.mjs > out/forms.txt 2>&1; wc -c out/forms.txt
        env:
          N: "40"
      - name: Publish on probe-slow-out
        run: |
          cd out && git init -q && git checkout -q -b probe-slow-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Plate forms probe"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-slow-out
