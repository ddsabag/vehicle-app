name: Slow checks probe (one-off, probe-perf branch)
# Read-only, 23.10: how long car checks really take (GA4 lookup events and duration buckets), for the "slow checks" definition question.
# The output is encrypted with .github/seo-data.pub.pem, so no business number is in the log or the branch in clear. Runs on a push to the
# probe-perf branch only; output on the probe-slow-out branch.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/slow-probe.mjs", ".github/workflows/slow-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/slow-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish on probe-slow-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b probe-slow-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Slow checks probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-slow-out
