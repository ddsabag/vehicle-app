name: Model statistics
on:
  schedule:
    - cron: "20 5 6 * *"   # monthly, a day after the market data
  workflow_dispatch:
    inputs:
      skip_gate:
        description: "Publish even when the sanity check finds the build incomplete or far off the published file (read the run log first)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: main-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # a failed or partial scan fails here and nothing is committed (the job goes red, so failure-alert reports it)
      - run: node --max-old-space-size=6000 .github/scripts/modelstats.mjs
        env:
          SKIP_GATE: ${{ inputs.skip_gate && '1' || '0' }}
      - run: |
          cp out/modelstats.json modelstats.json
          if [ -n "$(git status --porcelain modelstats.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add modelstats.json && git commit -m "Update model statistics" && { git push || { git pull --rebase -q origin main && git push; }; }
          fi
