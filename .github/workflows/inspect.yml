name: Inspect datasets
on:
  workflow_dispatch:
    inputs:
      plates:
        description: "Comma-separated plates"
        default: "75350003,46644401"
      script:
        description: "Script in .github/scripts"
        default: "inspect.mjs"
      queries:
        description: "Comma-separated dataset search words"
        default: "שעבוד,משועבד,יבוא אישי,רישום רכב,מסירות"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          mkdir -p out
          node .github/scripts/${{ inputs.script }} 2>&1 | tee out/report.txt
        env:
          PLATES: ${{ inputs.plates }}
          QUERIES: ${{ inputs.queries }}
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Publish the report on the inspect-output branch
        run: |
          cd out && git init -q && git checkout -q -b inspect-output && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Report"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" inspect-output
