name: Inspect datasets
on:
  workflow_dispatch:
    inputs:
      plates:
        description: "Example plates only (38548003, 1234567, 7654321); empty = the app's example plate. Never a real car's plate in any form (clear, base64, hash): the run log and inspect-output are PUBLIC. Anything else stops the run before any step prints it"
        default: ""
      script:
        description: "Script in .github/scripts"
        default: "inspect.mjs"
      queries:
        description: "Comma-separated dataset search words"
        default: "שעבוד,משועבד,יבוא אישי,רישום רכב,מסירות"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04   # Playwright 1.49.1 predates Ubuntu 26.04 (ubuntu-latest from November 2026)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # GitHub prints each step's env at the top of the public log, so the plates input is checked here first, read from the event file and
      # never from env or the script text: anything but the example plates stops the run without printing it (the step below has it in env)
      - name: Example plates only
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { probePlates } = await import(process.cwd() + "/.github/scripts/datasets.mjs");
            const raw = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")).inputs?.plates || "";
            try { probePlates(raw); console.log("plates input: example plates only"); }
            catch { console.log("::error::PLATES takes the example plates only (38548003, 1234567, 7654321). The value is not printed; run again without it."); process.exit(1); }'
      - name: Install a browser (site-* scripts open the live site)
        if: ${{ startsWith(inputs.script, 'site-') }}
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Install the Claude SDK (claude-* scripts; branch ops-claude-key-probe only)
        if: ${{ startsWith(inputs.script, 'claude-') }}
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @anthropic-ai/sdk@0.133.0
      - run: |
          mkdir -p out
          case "$SCRIPT" in *[!a-z0-9-]*.mjs|"") echo "bad script name"; exit 1;; esac
          [ "${SCRIPT##*.}" = mjs ] || { echo "bad script name"; exit 1; }
          node ".github/scripts/$SCRIPT" 2>&1 | tee out/report.txt
        env:
          SCRIPT: ${{ inputs.script }}
          PLATES: ${{ inputs.plates }}
          QUERIES: ${{ inputs.queries }}
          ANTHROPIC_API_KEY: ${{ startsWith(inputs.script, 'claude-') && secrets.ANTHROPIC_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Publish the report on the inspect-output branch
        run: |
          cd out && git init -q && git checkout -q -b inspect-output && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Report"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" inspect-output
