name: Copy audit
# Weekly Hebrew copy audit (product thread; monthly API credit, Dudu 1.11.2026 21:16 "נלך על 2 החבילות"): one Claude call (Sonnet 5.5,
# structured output) reads the user-visible Hebrew of the app, the site, the store listing and the release notes, and flags wording a user
# would read wrong (two names for one thing, a promise the app does not keep, certainty the data lacks, a gendered form, the golden rule,
# spelling). A point is kept only when its quote is on the line it names (copy-audit.mjs). No call when the texts did not change since the
# last good run. Suggests only: copy-audit.json goes to the branch copy-audit and one quiet copy:<date> item to the router (owner: product).
# With no key, no SDK or an API error the run stays green: ai:copy (ai:key when the key or the credit is the cause) goes to the router.
# Not in failure-alert's re-run list: a run sends a paid request, so a crash is told and never re-run by itself.
on:
  schedule:
    - cron: "41 5 * * 1"   # Mondays 05:41 UTC (08:41 Israel summer time, 07:41 winter)
  workflow_dispatch:
    inputs:
      dry:
        description: "No call to Claude (checks the plumbing only)"
        type: boolean
        default: false
      force:
        description: "Call even when the texts did not change since the last good run"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: copy-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The Claude SDK (the version pinned in claude.mjs; the app never loads it)
        continue-on-error: true   # without it the bot says why and the thread checks by hand
        run: npm install --no-save --no-audit --no-fund --loglevel=error "$(sed -n 's/^export const SDK = "\(.*\)";$/\1/p' .github/scripts/claude.mjs)"
      - name: The last run's file
        run: mkdir -p prev && { git fetch -q --depth 1 origin copy-audit 2>/dev/null && git show FETCH_HEAD:copy-audit.json > prev/copy-audit.json || echo "no earlier run"; }
      - name: Read the wording
        run: node .github/scripts/copy-audit.mjs
        env:
          OUT: out
          PREV: prev/copy-audit.json
          DRY: ${{ inputs.dry && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # the router (alert.mjs): its state lives on the branch alert-state
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Publish to the branch copy-audit (one commit per run that called Claude)
        if: ${{ hashFiles('out/copy-audit.json') != '' && !inputs.dry }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e 'const r=require("./out/copy-audit.json"); process.exit(r.ok && !r.skipped ? 0 : 1)' || { echo "nothing new to keep"; exit 0; }
          cp out/copy-audit.json "$RUNNER_TEMP/" && cd "$(mktemp -d)" && git init -q && git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin copy-audit 2>/dev/null; then git checkout -q -B copy-audit FETCH_HEAD; else git checkout -q --orphan copy-audit; fi
          cp "$RUNNER_TEMP/copy-audit.json" . && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Copy audit $(date -u +%F)" || { echo "nothing new"; exit 0; }
          git push -q origin copy-audit
