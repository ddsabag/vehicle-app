name: Failure alert
# One Telegram message (loud) when a scheduled or push-triggered production workflow crashes on main without having sent its own alert.
# Scripts that already alert on their own finish green on purpose, so this only fires for the failures nobody else reported (e.g. a build or a job that died).
# Manual runs (workflow_dispatch) and the next-branch UI checks are left out: the person who started them sees the result.
# Pull-request runs and runs from a fork are left out too: a fork's branch may be named main (24.10 ops review).
# A run cancelled before any job started is not a failure when a newer run of the same workflow took its place (that run redoes the work); one pushed out of the shared
# main-writer queue by another workflow lost its work and is reported loudly, as is one cancelled mid-job (e.g. a timeout).
# A run whose only cancelled jobs never started (e.g. SEO auto-publish's publish job pushed out of the queue after its check job ran) counts as cancelled before it started.
# A repeat failure (the previous run of the same workflow on main also failed, in one of the same jobs, at most 26 h earlier, with no manual run that succeeded in between
# and no run in between in which one of those jobs ran and passed; in Site smoke test, SEO daily digest, Magazine and Data truth, whose jobs are skipped by the kind of run, a green
# run that skipped all of them is passed over, in any other workflow a green run ends the streak)
# is sent silently and not added to /live again; the first one is loud. Another job failing, or a failure after a gap (a monthly or days-1-3 job), is news and loud.
# Self-repair (Dudu 25.10: fix by itself, tell only "done"): a workflow in tg-text.mjs RETRY (reads, checks and data rebuilds, safe to run twice) that
# failed for the first time, or was pushed out of the queue, is re-run once by this job, which waits for it: passed = one silent ✅, failed again = the loud
# message. The re-run's own completion (attempt 2+) is left to the job that started it. Other workflows (publishing, mail, Play, Worker deploys) are not re-run.
# Every message goes through the alert router first (alert.mjs wf, Dudu 26.10: every problem, and how it ended): the workflow's level in WF_LEVELS
# decides the ring (a day-level failure at night is quiet, then the morning ring), a repeat is one episode (no new message inside 22.5 h, then a
# reminder), a self-repair is recorded as already over, and each one is in the morning ledger. When the router does not take it, the direct send below.
# Job "recovered": a green run on main closes that run name's open failure and says so once, quietly ("✅ בוצע"); in the four workflows whose jobs
# are skipped by the kind of run, only when every job that failed in the latest failed run ran and passed here.
# Names must match each workflow's name: exactly (no error when one does not).
on:
  workflow_run:
    branches: [main]
    workflows:
      - "Android build"
      - "Alert daily"
      - "Data guard"
      - "Fuel price"
      - "Ministry watch"
      - "Web deploy (build)"
      - "SEO check"
      - "SEO auto-publish"
      - "Web watch"
      - "Magazine"
      - "Experimenter"
      - "Market data"
      - "Model catalogue"
      - "Model names"
      - "Model statistics"
      - "Ownership data mirror"
      - "Reviews monitor"
      - "SEO daily digest"
      - "SEO data snapshot"
      - "Campaign data snapshot"
      - "Release guard"
      - "Site smoke test"
      - "Site smoke test (after deploy)"
      - "Weekly analytics report"
      - "Back-on-road detector"
      - "Workers deploy"
      - "Social publish"
      - "Ship tail"
      - "Store listing"
      - "Release watch"
      - "Settlements"
      - "Data truth"
      - "App guardian (real app)"   # owner: product (QA); nightly on main, red = blocking findings, so never re-run by this job
      - "UI guardian (browser)"
      - "Visual review"   # owner: product (QA); Claude's look at the guardians' screenshots, report only: red = its own crash, never a finding
      - "Alert router check"   # the checks of a push to main: red = something released broken (alert.mjs selftest: no workflow on main goes unwatched)
      - "ASO check"
      - "Live watch"
    types: [completed]
permissions:
  contents: write   # flash.mjs writes the flashes branch the /live dashboard reads
  actions: write    # jobs and previous runs of the failed workflow; the one automatic re-run
jobs:
  tell:
    if: ${{ (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'cancelled') && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'workflow_dispatch' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50   # 3 minutes, plus up to 45 waiting for an automatic re-run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            .github/scripts/flash.mjs
            .github/scripts/tg-text.mjs
            .github/scripts/bot-names.json
            .github/scripts/alert.mjs
          sparse-checkout-cone-mode: false
      - name: Send the alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ github.event.workflow_run.name }}   # the run's name: "Magazine (data)" for a workflow with a run-name, else the workflow's name
          WF: ${{ github.event.workflow.name || github.event.workflow_run.name }}   # the workflow's own name ("Magazine")
          URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_CREATED: ${{ github.event.workflow_run.created_at }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}   # the alert router (alert.mjs): its state lives on the branch alert-state
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || secrets.BREVO_KEY }}   # the router's email path for a critical failure
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "no Telegram credentials"; exit 0; }
          # one Hebrew message per case (tg-text.mjs wfFailure: classification line, what happened, what to do, the log link); level from alert.mjs WF_LEVELS
          send() {
            local out silent text r extra=""
            out=$(node .github/scripts/tg-text.mjs wf "$1" "$NAME" "$WF" "$URL" 2>/dev/null) || out=""
            if [ -n "$out" ]; then silent=${out%%$'\n'*}; text=${out#*$'\n'}; else silent=0; text=$(printf 'לוחית: הבוט "%s" נכשל\n%s' "$NAME" "$URL"); fi
            [ "$1" = repeat ] && silent=1
            # the router first: ALERT_DONE = it sent (or deduped) the message and recorded it; anything else = the direct send, as before
            case "$1" in repeat) extra="--repeat";; fixed) extra="--outcome self";; esac
            r=$(timeout 45 node .github/scripts/alert.mjs wf "$NAME" --of "$WF" --html --today "$([ "$silent" = 1 ] && echo silent || echo loud)" --text "$text" --link "$URL" $extra 2>/dev/null) || r=""
            case "$r" in *ALERT_DONE*) echo "router: ${r##*$'\n'}"; return 0;; esac
            curl -s -o /dev/null -w "telegram %{http_code}\n" "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$text" \
              --data-urlencode "parse_mode=HTML" --data-urlencode "disable_web_page_preview=true" --data-urlencode "disable_notification=$([ "$silent" = 1 ] && echo true || echo false)"
          }
          HE=$(node .github/scripts/tg-text.mjs bot "$NAME" 2>/dev/null) || HE=$NAME
          retry=$(node .github/scripts/tg-text.mjs retry "$WF" 2>/dev/null) || retry=0
          if [ "$retry" = 1 ] && [ "${ATTEMPT:-1}" -gt 1 ] 2>/dev/null; then echo "attempt $ATTEMPT of a self-repairing workflow: the run that re-ran it reports"; exit 0; fi
          # the one automatic re-run (whole run when it never started, else the failed jobs), then wait for it: 0 passed, 1 failed or still running after 45 min, 2 not started
          rerun() {
            if [ "$1" = lost ]; then gh run rerun "$RUN_ID" -R "$GITHUB_REPOSITORY" || return 2; else gh run rerun "$RUN_ID" --failed -R "$GITHUB_REPOSITORY" || return 2; fi
            echo "re-run started, waiting"; sleep 30
            timeout 45m gh run watch "$RUN_ID" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 >/dev/null 2>&1 && return 0 || return 1
          }
          # re-run (when allowed) and say how it ended; returns 1 when nothing was re-run, so the caller sends its usual message
          repair() {
            [ "$retry" = 1 ] || return 1
            local rc=0; rerun "$1" || rc=$?
            case $rc in
              0) echo "the re-run passed: silent done message"; send fixed;;
              1) echo "the re-run failed too: loud message"; send again; node .github/scripts/flash.mjs infra alert "בוט נכשל: $HE" "$URL";;
              *) echo "could not start a re-run"; return 1;;
            esac
            return 0
          }
          # names of the jobs of a run that started and did not succeed (failed, timed out, or cancelled while running), one per line; "x" when the API
          # call fails. A job cancelled while it waited in a queue has no steps and is not listed.
          bad() { local n; n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/jobs?per_page=100" \
            --jq '.jobs[] | select((.steps | length) > 0 and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled")) | .name' 2>/dev/null) || n=x; echo "$n"; }
          # runs of the same workflow on main, newest first, as number:id:status:conclusion:event:created (epoch seconds; empty when the API call fails)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?branch=main&per_page=30" \
            --jq '.workflow_runs[] | "\(.run_number):\(.id):\(.status):\(.conclusion):\(.event):\(.created_at // "" | try fromdateiso8601 catch 0)"' 2>/dev/null) || runs=""
          mine=$(bad "$RUN_ID")
          if [ "$CONCLUSION" = cancelled ] && [ -z "$mine" ]; then
            # never started: superseded when a newer run of this workflow exists, otherwise another workflow took its place in the queue and the work is lost.
            # A workflow whose run name names its part, "<name> (<part>)" (Magazine: monthly, data, newsletter), is superseded only by a newer run of the same part.
            newer=""
            case "$TITLE" in
              "$WF ("*")")
                newer=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?branch=main&per_page=30" --jq '.workflow_runs[] | "\(.run_number)\t\(.display_title)"' 2>/dev/null \
                  | awk -F'\t' '$1 + 0 > ENVIRON["RUN_NUMBER"] + 0 && $2 == ENVIRON["TITLE"] { print $1; exit }') || newer="";;
              *) for r in $runs; do [ "${r%%:*}" -gt "$RUN_NUMBER" ] 2>/dev/null && { newer=${r%%:*}; break; }; done;;
            esac
            if [ -n "$newer" ]; then echo "cancelled before any job started, superseded by run #$newer: no alert"; exit 0; fi
            echo "cancelled before any job started, no newer run of this workflow (of this part) took its place: the work is lost"
            repair lost && exit 0
            send lost
            node .github/scripts/flash.mjs infra alert "בוט לא רץ: $HE" "$URL"
            exit 0
          fi
          # walk back to the previous completed run: it failed too, in one of the same jobs, within 26 h = repeat. A manual run that succeeded ends the streak;
          # a manual one that failed never paged, so it is passed over, and so is one cancelled before any of its jobs ran, or one that succeeded without running
          # any of the failed jobs. Anything else (a success of one of those jobs, an API error, other jobs, an older failure) counts as a first failure.
          repeat=""
          now=$(date -d "${RUN_CREATED:-now}" +%s 2>/dev/null) || now=$(date +%s)
          for r in $runs; do
            IFS=: read -r num id st concl ev at <<<"$r"
            { [ "$num" -lt "$RUN_NUMBER" ] 2>/dev/null && [ "$st" = completed ]; } || continue
            if [ "$ev" = workflow_dispatch ]; then [ "$concl" = success ] && break; continue; fi
            case "$concl" in
              failure|timed_out|cancelled) ;;
              startup_failure|skipped) continue;;   # never paged and did no work (e.g. Site smoke test's push job standing down), so look further back
              success)
                # a run in which none of the failed jobs ran (e.g. a push run of Site smoke test, where the infra job is skipped) says nothing about them:
                # look further back. Within 26 h only; an API error, or a run in which one of them ran and passed, ends the streak as before.
                # Only for the workflows whose jobs are skipped by the kind of run (event or part); in any other workflow a skipped job can mean the
                # work was already done (Web deploy's deploy when the site already serves main), so a success ends the streak as before.
                case "$WF" in "Site smoke test"|"SEO daily digest"|"Magazine"|"Data truth") ;; *) break;; esac
                case "$at" in ''|*[!0-9]*) break;; esac
                { [ "$mine" != x ] && [ $((now - at)) -lt 93600 ]; } || break
                ran=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '.jobs[] | select((.steps | length) > 0) | .name' 2>/dev/null) || break
                hit=""
                while IFS= read -r j; do
                  if [ -n "$j" ] && grep -qxF -- "$j" <<<"$ran"; then hit=1; fi
                done <<<"$mine"
                if [ -n "$hit" ]; then break; fi
                continue;;
              *) break;;
            esac
            prev=$(bad "$id")
            if [ "$concl" = cancelled ] && [ -z "$prev" ]; then continue; fi
            case "$at" in ''|*[!0-9]*) at=0;; esac
            if [ "$prev" != x ] && [ "$mine" != x ] && [ $((now - at)) -lt 93600 ]; then
              while IFS= read -r j; do
                if [ -n "$j" ] && grep -qxF -- "$j" <<<"$prev"; then repeat=1; fi
              done <<<"$mine"
            fi
            break
          done
          if [ -n "$repeat" ]; then
            echo "the previous run failed too: silent message, no new flash"
            send repeat
            exit 0
          fi
          repair failed && exit 0
          send failed
          node .github/scripts/flash.mjs infra alert "בוט נכשל: $HE" "$URL"
  # a green run closes this run name's open failure in the router and says so once, quietly; nothing open = nothing sent
  recovered:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            .github/scripts/alert.mjs
            .github/scripts/bot-names.json
          sparse-checkout-cone-mode: false
      - name: Close a failure this run fixed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ github.event.workflow_run.name }}
          WF: ${{ github.event.workflow.name || github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          # Site smoke test, SEO daily digest, Magazine and Data truth skip jobs by the kind of run (event, schedule line or part), so a green run
          # proves only the jobs it ran: every job that failed in the newest earlier failed run (of this part) must have run and passed here
          case "$WF" in
            "Site smoke test"|"SEO daily digest"|"Magazine"|"Data truth")
              part=""; case "$TITLE" in "$WF ("*")") part=$TITLE;; esac
              prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?branch=main&status=completed&per_page=30" \
                --jq '.workflow_runs[] | "\(.run_number)\t\(.conclusion)\t\(.id)\t\(.display_title)"' 2>/dev/null \
                | awk -F'\t' -v part="$part" '$1 + 0 < ENVIRON["RUN_NUMBER"] + 0 && (part == "" || $4 == part) && ($2 == "failure" || $2 == "timed_out" || $2 == "cancelled") { print $3; exit }') || prev=""
              [ -n "$prev" ] || { echo "no earlier failed run found: nothing to close"; exit 0; }
              failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prev/jobs?per_page=100" \
                --jq '.jobs[] | select((.steps | length) > 0 and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled")) | .name' 2>/dev/null) || exit 0
              passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "success") | .name' 2>/dev/null) || exit 0
              while IFS= read -r j; do
                if [ -n "$j" ] && ! grep -qxF -- "$j" <<<"$passed"; then echo "the job that failed did not run here: the failure stays open"; exit 0; fi
              done <<<"$failed";;
          esac
          timeout 60 node .github/scripts/alert.mjs recovered "$NAME" --link "$URL" || true
