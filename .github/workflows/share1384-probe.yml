name: Share-word read probe (one-off, probe-perf branch)
# Read-only, 8.11.2026: share_open per check by app version (1.38.4 vs 1.38.0-3 vs 1.37), for the share-word verdict.
# The output is encrypted with .github/seo-data.pub.pem, so no business number is in the log or the branch in clear. Runs on a push to the
# probe-perf branch only; output on the probe-share1384-out branch.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/share1384-probe.mjs", ".github/workflows/share1384-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/share1384-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish on probe-share1384-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b probe-share1384-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Share-word read probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-share1384-out
