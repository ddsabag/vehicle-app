name: Code errors probe (one-off, probe-perf branch)
# Read-only, 24.10: what the pipe canary's 8 code errors of 23.10 were (GA4), and whether the live site throws today (Chromium, demo plate).
# The output is encrypted with .github/seo-data.pub.pem, so no business number is in the log or the branch in clear. Runs on a push to the
# probe-perf branch only; output on the probe-err-out branch.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/err-probe.mjs", ".github/workflows/err-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/err-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
      - name: Publish on probe-err-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b probe-err-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Code errors probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-err-out
