name: Experimenter
# Reads the wording experiments from GA4 and, when one variant is clearly better, writes the winner to experiments.json on main
# (the app reads it from the site). A quiet Telegram message is sent only when an experiment is decided. Needs GA_PROPERTY_ID and GA_SERVICE_ACCOUNT_JSON.
# Paused (2026-10-18): too little traffic for a fair result, so there is no schedule and experiments.json has "off": true (everyone sees
# variant 0). To resume: put back the weekly cron (was "20 6 * * 3") and remove "off" from experiments.json; an "off" experiment is skipped
# even on a manual run. Keep experiments.json on the site: without it the app keeps each device's old random variant.
# share_label is retired (release 1.38, 29.10.2026): the car header's share button is an icon with no text, so resuming it would measure nothing.
# Failure alert skips manual runs, so it watches this workflow again only once the cron is back.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Calculate only, do not write experiments.json"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: main-writer
  cancel-in-progress: false
jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analytics/requirements.txt
      - run: python analytics/experiments.py --selftest
      - name: Decide
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python analytics/experiments.py ${{ inputs.dry_run && '--dry' || '' }}
          [ -f out-experiments.txt ] && node .github/scripts/flash.mjs experiment info "$(cat out-experiments.txt)" || true
      - name: Commit the winner
        run: |
          rm -f out-experiments.txt
          if git diff --quiet experiments.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add experiments.json
          git commit -q -m "Experimenter: experiment decided"
          git push origin HEAD:main || { git pull --rebase -q origin main && git push origin HEAD:main; }
