name: Decision brief (probe-perf branch)
# Strategy thread, package A4 of the monthly API credit (Dudu 1.11.2026 21:16 UTC). Before a heavy decision task, the thread writes its
# questions in .github/brief-questions.md (first line "source: kpi" for the weekly KPI probe's data, or "source: inst" for inst-probe.mjs as
# it stands) and pushes it here. The probe runs and writes its raw JSON to the runner's temp folder only; decision-brief.mjs asks Opus 5.5 for
# a brief whose every number is filled by code from that raw JSON (a line with a number of the model's own is dropped). Output encrypted with
# .github/seo-data.pub.pem on branch probe-brief-out, with the probe's own encrypted output beside it (the raw stays the fallback).
# Not for main. The log says only which part answered and line counts.
on:
  push:
    branches: [probe-perf]
    paths: [".github/brief-questions.md"]
permissions:
  contents: write
concurrency: { group: decision-brief, cancel-in-progress: false }
jobs:
  brief:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: The Claude SDK (the version pinned in claude.mjs)
        continue-on-error: true   # without it the brief says why and the raw is still published
        run: npm install --no-save --no-audit --no-fund --loglevel=error "$(sed -n 's/^export const SDK = "\(.*\)";$/\1/p' .github/scripts/claude.mjs)"
      - name: Which probe
        run: |
          src=$(head -n 1 .github/brief-questions.md | sed -n 's/^source: *\([a-z]*\).*/\1/p')
          case "$src" in kpi|inst) echo "SRC=$src" >> "$GITHUB_ENV" ;; *) echo "::error::first line must be 'source: kpi' or 'source: inst'"; exit 1 ;; esac
          git fetch -q --depth=1 origin main
          git show FETCH_HEAD:worker/live/worker.js > "$RUNNER_TEMP/w.js"
          git show FETCH_HEAD:worker/live/wrangler.toml > "$RUNNER_TEMP/w.toml"
          echo "MAIN_SHA=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_ENV"
      - name: The probe (raw JSON to the runner's temp folder only)
        run: node ".github/scripts/${SRC}-probe.mjs"
        env:
          RAW_OUT: ${{ runner.temp }}/raw.json
          W_JS: ${{ runner.temp }}/w.js
          W_TOML: ${{ runner.temp }}/w.toml
          W_TMP: ${{ runner.temp }}/kpi-worker.mjs
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: The brief (every number filled from the raw JSON by code)
        run: node .github/scripts/decision-brief.mjs "$RUNNER_TEMP/raw.json" .github/brief-questions.md out/brief.enc.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Publish on probe-brief-out (encrypted only)
        run: |
          rm -f "$RUNNER_TEMP/raw.json"
          cd out && echo "source $SRC, main $MAIN_SHA, run ${{ github.run_id }}" > run.txt
          git init -q && git checkout -q -b probe-brief-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Decision brief (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-brief-out
