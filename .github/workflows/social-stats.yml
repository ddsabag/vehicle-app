name: Social stats
# Public follower/view counts of the לוחית social pages, typed in by hand (TikTok has no free stats API for a new page).
# Run it from the Actions tab (or via the browser-extension prompt) after reading TikTok Analytics; the live dashboard (/live) shows the numbers.
# Only public aggregate numbers go here (the repo is public): never names, never business revenue.
on:
  workflow_dispatch:
    inputs:
      tiktok_followers:
        description: "TikTok: followers (number)"
        default: "0"
      tiktok_views:
        description: "TikTok: video views, last 7 days"
        default: "0"
      tiktok_likes:
        description: "TikTok: likes, last 7 days"
        default: "0"
      tiktok_profile_views:
        description: "TikTok: profile views, last 7 days"
        default: "0"
      tiktok_videos:
        description: "TikTok: videos published so far"
        default: "0"
permissions:
  contents: write
concurrency: flashes
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/social-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TT_FOLLOWERS: ${{ inputs.tiktok_followers }}
          TT_VIEWS: ${{ inputs.tiktok_views }}
          TT_LIKES: ${{ inputs.tiktok_likes }}
          TT_PROFILE: ${{ inputs.tiktok_profile_views }}
          TT_VIDEOS: ${{ inputs.tiktok_videos }}
