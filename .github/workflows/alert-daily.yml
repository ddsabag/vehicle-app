name: Alert daily
# The alert router's daily job (router spec 8.1): claim the day, Telegram self-test (getMe + getChat, sends nothing), the morning ring of night items,
# the luchit-uptime check (only when the repo variable ALERT_UPTIME_URL is set), the Monday "Sunday summary went out" check, then the heartbeat and the prune.
# State lives on branch alert-state (keys, levels and times only, never message text).
# Two lines a day so exactly one lands at 08:xx in Jerusalem in summer and winter; the engine's gate makes the other one a no-op. A run GitHub starts
# hours late still acts until 22:00 local when the day is not done (2.11.2026: the morning ran at 17:34 and, with a 14:00 cap, never went out).
# A red run means Telegram failed its self-test or the morning ring did not go out (an email is sent when a Brevo key exists); failure-alert reports
# the red run too (with its own Brevo email when Telegram is down), and GitHub's own email while that is switched on.
# The morning ledger (quiet, only when there was a problem): every problem of the last 24 h and what happened to it.
# Manual runs skip the hour check and are dry by default (nothing sent, nothing written).
# Job "prep" (Dudu 1.11, the monthly API credit): the facts of the morning triage (triage-prep.mjs) on branch triage-out, so the Claude Code
# triage that follows reads one file and stops early on a clean morning; Haiku only writes a cause line when something is not clean.
# It never turns the run red (a failed prep leaves the triage to its full steps).
on:
  schedule:
    - cron: "5 5 * * *"
    - cron: "5 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print what would happen, send and write nothing"
        type: boolean
        default: true
permissions:
  contents: write   # branches alert-state and triage-out
  actions: read     # prep: the runs on main and the failed jobs' logs
jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/alert.mjs
            .github/scripts/bot-names.json
          sparse-checkout-cone-mode: false
      - name: Daily
        run: node .github/scripts/alert.mjs daily
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || secrets.BREVO_KEY }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          ALERT_UPTIME_URL: ${{ vars.ALERT_UPTIME_URL }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
  prep:
    needs: daily
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/alert.mjs
            .github/scripts/bot-names.json
            .github/scripts/claude.mjs
            .github/scripts/triage-prep.mjs
            .github/scripts/ai-usage.mjs
            .github/scripts/alert-noise.mjs
            .github/seo-data.pub.pem
          sparse-checkout-cone-mode: false
      - name: Install the Claude SDK (the cause lines only; a failed install leaves them out)
        continue-on-error: true
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @anthropic-ai/sdk@0.133.0   # = SDK in claude.mjs
      - name: Gather the morning triage's facts
        run: node .github/scripts/triage-prep.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # Console workspace luchit-bots, capped; a clean morning makes no call
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      - name: Weekly alert-noise review (Sundays, Sonnet, suggestions only; credit package B)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          # once a week: the last noise.json is carried forward, and a Sunday that already has one does not ask again
          mkdir -p triage-out
          if git fetch -q --depth=1 origin triage-out 2>/dev/null && git show FETCH_HEAD:noise.json > triage-out/noise.json 2>/dev/null; then
            grep -q "\"at\": \"$(date -u +%F)" triage-out/noise.json && { echo "noise review: already done today"; exit 0; }
          else rm -f triage-out/noise.json; fi
          node .github/scripts/alert-noise.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Publish triage.json on branch triage-out (public, names, links and router keys only)
        if: ${{ hashFiles('triage-out/triage.json') != '' }}
        run: |
          cd triage-out && git init -q && git checkout -q -b triage-out && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Triage facts"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" triage-out
