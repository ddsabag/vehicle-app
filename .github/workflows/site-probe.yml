name: Site probe
# Strategy thread: passive, encrypted snapshots of public pages (GET only, no forms, no logins). Runs on a push to this branch.
on:
  push:
    branches: [strategy/site-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - env:
          LIST: https://meshumeshet.com/ https://meshumeshet.com/about https://meshumeshet.com/board https://www.check-car.co.il/ https://www.check-car.co.il/check/ https://lohit.co.il/ https://plateapp.ai/ https://plateapp.ai/check https://www.carzone.co.il/car-report https://www.carzone.co.il/pro/dealers/ https://autoboom.co.il/check-car https://carportal.co.il/ https://autodata.report/ https://clearcar.co.il/ https://caro.co.il/ https://data.gov.il/terms
          HIST: lohit.co.il meshumeshet.com plateapp.ai clearcar.co.il caro.co.il autodata.report
        run: node .github/scripts/page-list.mjs "$RUNNER_TEMP/site.enc.json"
      - name: Publish to the branch probe-site-out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$(mktemp -d)" && git init -q && git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan probe-site-out && cp "$RUNNER_TEMP/site.enc.json" . && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "site snapshot $(date -u +%F)"
          git push -q -f origin probe-site-out
