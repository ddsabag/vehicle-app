name: Site probe
# Strategy thread: passive, encrypted snapshots of public pages (GET only, no forms, no logins). Runs on a push to this branch.
on:
  push:
    branches: [strategy/site-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - env:
          LIST: https://kalcar.co.il/dealers https://kalcar.co.il/widget https://kalcar.co.il/extension https://kalcar.co.il/legal/terms https://kalcar.co.il/legal/privacy https://kalcar.co.il/legal/sources https://kalcar.co.il/gear https://kalcar.co.il/r/demo https://kalcar.co.il/inspect https://kalcar.co.il/inspection-centers https://kalcar.co.il/insurance https://kalcar.co.il/insurance-history https://kalcar.co.il/history https://kalcar.co.il/alerts https://kalcar.co.il/finance https://kalcar.co.il/services https://kalcar.co.il/reviews https://kalcar.co.il/stats
          HIST: 
        run: node .github/scripts/page-list.mjs "$RUNNER_TEMP/site.enc.json"
      - name: Publish to the branch probe-site-out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$(mktemp -d)" && git init -q && git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan probe-site-out && cp "$RUNNER_TEMP/site.enc.json" . && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "site snapshot $(date -u +%F)"
          git push -q -f origin probe-site-out
