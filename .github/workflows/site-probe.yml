name: Site probe
# Strategy thread: passive, encrypted snapshots of public pages (GET only, no forms, no logins). Runs on a push to this branch.
on:
  push:
    branches: [strategy/site-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - env:
          LIST: https://www.check-car.co.il/business/ https://www.check-car.co.il/advertising/ https://lohit.co.il/developers https://lohit.co.il/terms https://lohit.co.il/contact https://lohit.co.il/sitemap.xml https://carportal.co.il/financing https://carportal.co.il/insurance https://carportal.co.il/find-car https://clearcar.co.il/about https://caro.co.il/about https://autodata.report/about https://data.gov.il/he/terms https://info.data.gov.il/datagov/terms/ https://www.gov.il/he/departments/policies/data_gov_il_terms
          HIST: tlink.co.il
        run: node .github/scripts/page-list.mjs "$RUNNER_TEMP/site.enc.json"
      - name: Publish to the branch probe-site-out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$(mktemp -d)" && git init -q && git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan probe-site-out && cp "$RUNNER_TEMP/site.enc.json" . && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "site snapshot $(date -u +%F)"
          git push -q -f origin probe-site-out
