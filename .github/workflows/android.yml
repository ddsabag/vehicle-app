name: Android build

# Builds the release APK and AAB from the web app, signs them with the upload key when the
# signing secrets exist, and keeps them on a draft release that only collaborators see (never on a public branch).
on:
  push:
    branches: [deps-check]
    paths: ["index.html", "market.json", "modelstats.json", "service.json", "lib/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      skip_guard:
        description: "Build even if the data guard found a breaking ministry schema change"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Ministry schema gate (stops the build when a dataset the app reads changed shape)
        run: node .github/scripts/data-guard.mjs --gate
        env:
          GUARD_SKIP: '1'

      - name: Minify the page for the release build
        run: |
          mkdir -p /tmp/minify && cd /tmp/minify && npm init -y >/dev/null && npm i terser@5 >/dev/null
          cd "$GITHUB_WORKSPACE"
          ln -sfn /tmp/minify/node_modules .github/scripts/node_modules
          node .github/scripts/obfuscate.mjs
          rm .github/scripts/node_modules

      - name: Private service-interval data (kept out of the public repo)
        env:
          SERVICE_JSON_B64: ${{ secrets.SERVICE_JSON_B64 }}
        run: |
          if [ -n "$SERVICE_JSON_B64" ]; then echo "$SERVICE_JSON_B64" | base64 -d > service.json; echo "service.json added to the build"; else echo "no service data secret; building without it"; fi

      - name: Firebase config for anonymous usage statistics (optional)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json; echo "firebase config added"; else echo "no firebase secret; analytics stays off"; fi

      - name: Build
        working-directory: android
        run: |
          # the user-facing version comes from the app itself (APP_VERSION in index.html)
          VN=$(grep -oP 'APP_VERSION = "\K[^"]+' ../index.html)
          echo "VN=$VN" >> "$GITHUB_ENV"
          gradle --no-daemon assembleRelease bundleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=$VN

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/
          cp android/app/build/outputs/bundle/release/app-release.aab out/app-release-unsigned.aab
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$BT/lib/apksigner.jar" out/
          echo "versionCode=${{ github.run_number }}" > out/version.txt
          echo "versionName=$VN" >> out/version.txt
          echo "commit=${{ github.sha }}" >> out/version.txt
          ls -la out

      - name: Compile check only, throwaway branch deps-check, nothing is signed, kept or published
        run: ls -la out
