name: Android build

# Builds the release APK and AAB from the web app, signs them with the upload key when the
# signing secrets exist, and keeps them on a draft release that only collaborators see (never on a public branch).
on:
  push:
    branches: [main]
    paths: ["index.html", "market.json", "modelstats.json", "service.json", "lib/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      skip_guard:
        description: "Build even if the data guard found a breaking ministry schema change"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Ministry schema gate (stops the build when a dataset the app reads changed shape)
        run: node .github/scripts/data-guard.mjs --gate
        env:
          GUARD_SKIP: ${{ inputs.skip_guard && '1' || '0' }}

      - name: Minify the page for the release build
        run: |
          mkdir -p /tmp/minify && cd /tmp/minify && npm init -y >/dev/null && npm i terser@5 >/dev/null
          cd "$GITHUB_WORKSPACE"
          ln -sfn /tmp/minify/node_modules .github/scripts/node_modules
          node .github/scripts/obfuscate.mjs
          rm .github/scripts/node_modules

      - name: Private service-interval data (kept out of the public repo)
        env:
          SERVICE_JSON_B64: ${{ secrets.SERVICE_JSON_B64 }}
        run: |
          if [ -n "$SERVICE_JSON_B64" ]; then echo "$SERVICE_JSON_B64" | base64 -d > service.json; node .github/scripts/seal-service.mjs; else echo "no service data secret; building without it"; fi

      - name: Firebase config for anonymous usage statistics (optional)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json; echo "firebase config added"; else echo "no firebase secret; analytics stays off"; fi

      - name: Build
        working-directory: android
        run: |
          # the user-facing version comes from the app itself (APP_VERSION in index.html)
          VN=$(grep -oP 'APP_VERSION = "\K[^"]+' ../index.html)
          echo "VN=$VN" >> "$GITHUB_ENV"
          gradle --no-daemon assembleRelease bundleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=$VN

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/
          cp android/app/build/outputs/bundle/release/app-release.aab out/app-release-unsigned.aab
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$BT/lib/apksigner.jar" out/
          echo "versionCode=${{ github.run_number }}" > out/version.txt
          echo "versionName=$VN" >> out/version.txt
          echo "commit=${{ github.sha }}" >> out/version.txt
          ls -la out

      - name: Sign with the upload key (only when the signing secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then echo "no signing secrets; publishing unsigned files only"; exit 0; fi
          cd out
          KS="$RUNNER_TEMP/upload.jks"
          printf %s "$KEYSTORE_B64" | tr -d '\r\n \t"' | base64 -d > "$KS" || { echo "KEYSTORE_B64 is not valid base64 (length ${#KEYSTORE_B64}); re-copy the key text into the secret"; exit 1; }
          echo "keystore decoded: $(stat -c %s "$KS") bytes"
          ALIAS="${KEY_ALIAS:-upload}"
          VN=$(grep '^versionName=' version.txt | cut -d= -f2)
          cp app-release-unsigned.aab "luchit-$VN.aab"
          jarsigner -keystore "$KS" -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 "luchit-$VN.aab" "$ALIAS" > /dev/null
          jarsigner -verify "luchit-$VN.aab" | tail -1
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "luchit-$VN.apk" app-release-unsigned.apk
          "$BT/apksigner" verify "luchit-$VN.apk" && echo "signed apk verified"
          rm -f "$KS" "luchit-$VN.apk.idsig" app-release-unsigned.aab app-release-unsigned.apk apksigner.jar
          echo "signed=true" >> version.txt
          ls -la

      # The builds are NOT pushed to a branch of this public repository: the APK carries the private
      # service table (service.json). They go on a DRAFT release, which only collaborators can see
      # (a run artifact would be downloadable by any signed-in GitHub user). Claude downloads it into
      # the release folder; every build deletes the previous build drafts.
      - name: Keep the build on a draft release (collaborators only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.draft) | select(.name | startswith("build-")) | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" && echo "deleted old draft $id"
          done
          gh release create "build-${{ github.run_number }}" --draft --title "build-${{ github.run_number }}" \
            --notes "Version $VN, versionCode ${{ github.run_number }}, commit ${{ github.sha }}. Draft: collaborators only; the next build deletes it." \
            out/*
