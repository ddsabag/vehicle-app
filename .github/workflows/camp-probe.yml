name: Campaign data probe (one-off, probe-perf branch)
# Read-only test run of camp-data.mjs before it reaches main (25.10). Output encrypted, on branch camp-probe-out.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/camp-data.mjs", ".github/workflows/camp-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: node .github/scripts/camp-data.mjs selftest && node .github/scripts/camp-data.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish on camp-probe-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b camp-probe-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Campaign probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" camp-probe-out
