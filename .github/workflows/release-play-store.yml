name: Release to Google Play

# Builds, signs (upload key) and uploads the AAB to Google Play when a tag v* is pushed, e.g.:  git tag -a v1.25 -m "מה חדש בגרסה" && git push origin v1.25
# A tag always goes to the Internal testing track. Alpha/beta/production only through a manual run (workflow_dispatch) with the track chosen.
# Needs repository secrets: ANDROID_KEYSTORE_BASE64, KEYSTORE_ALIAS, KEYSTORE_PASSWORD, KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON
# Optional: SERVICE_JSON_B64, GOOGLE_SERVICES_JSON_B64 (same as android.yml), TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Release status (draft = you press Roll out in Play Console)"
        type: choice
        options: [completed, draft]
        default: draft
      version:
        description: "versionName for a manual run (must equal APP_VERSION in index.html), e.g. 1.25"
        required: false
permissions:
  contents: read
concurrency: release-play-store
env:
  # Play needs a versionCode above everything already uploaded (android.yml runs reached 89). Run numbers of this workflow start at 1, hence the offset.
  VERSION_CODE_BASE: 1000
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Resolve version and make sure it is the released main
        id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; VN="${TAG#v}"; else VN="${{ inputs.version }}"; fi
          APP=$(grep -oP 'APP_VERSION = "\K[^"]+' index.html)
          [ -n "$VN" ] || { echo "::error::no version given"; exit 1; }
          [ "$VN" = "$APP" ] || { echo "::error::tag/version '$VN' differs from APP_VERSION '$APP' in index.html"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::this commit is not on main; release only from main"; exit 1; }
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$(( VERSION_CODE_BASE + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"
          echo "track=${{ github.event_name == 'workflow_dispatch' && inputs.track || 'internal' }}" >> "$GITHUB_OUTPUT"
          echo "status=${{ github.event_name == 'workflow_dispatch' && inputs.status || 'completed' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Minify the page for the release build
        run: |
          mkdir -p /tmp/minify && cd /tmp/minify && npm init -y >/dev/null && npm i terser@5 >/dev/null
          cd "$GITHUB_WORKSPACE"
          ln -sfn /tmp/minify/node_modules .github/scripts/node_modules
          node .github/scripts/obfuscate.mjs
          rm .github/scripts/node_modules

      - name: Private build inputs (kept out of the public repo)
        env:
          SERVICE_JSON_B64: ${{ secrets.SERVICE_JSON_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          [ -n "$SERVICE_JSON_B64" ] && echo "$SERVICE_JSON_B64" | base64 -d > service.json || echo "building without service.json"
          [ -n "$GOOGLE_SERVICES_JSON_B64" ] && echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json || echo "analytics stays off"

      - name: Build the bundle
        working-directory: android
        run: gradle --no-daemon bundleRelease -PversionCode=${{ steps.v.outputs.code }} -PversionName=${{ steps.v.outputs.name }}

      - name: Sign the AAB with the upload key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          EXPECT_PREFIX: ${{ vars.UPLOAD_KEY_SHA256_PREFIX || '8c00dfac' }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/upload.jks"
          echo "$KS_B64" | base64 -d > "$KS"
          # the certificate fingerprint is public; compare it to the registered upload key so a wrong keystore fails here and not in Play
          FP=$(keytool -list -v -keystore "$KS" -alias "$KS_ALIAS" -storepass "$KS_PASS" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "upload key SHA-256 starts with ${FP:0:8}"
          [ "${FP:0:${#EXPECT_PREFIX}}" = "$EXPECT_PREFIX" ] || { echo "::error::keystore fingerprint does not match the registered upload key"; exit 1; }
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab dist/release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$KS" -storepass:env KS_PASS -keypass:env KEY_PASS dist/release.aab "$KS_ALIAS" >/dev/null
          jarsigner -verify dist/release.aab | head -1
          rm -f "$KS"

      - name: Release notes (from the tag message, else the last commit)
        run: |
          mkdir -p whatsnew
          if [ "${{ github.ref_type }}" = "tag" ]; then git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.txt; fi
          [ -s notes.txt ] 2>/dev/null || git log -1 --format=%B > notes.txt
          head -c 480 notes.txt | sed 's/[[:space:]]*$//' > whatsnew/whatsnew-he-IL   # Play limit: 500 characters per language
          cat whatsnew/whatsnew-he-IL

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ddsabag.pratirechev
          releaseFiles: dist/release.aab
          track: ${{ steps.v.outputs.track }}
          status: ${{ steps.v.outputs.status }}
          whatsNewDirectory: whatsnew
          releaseName: ${{ steps.v.outputs.name }}

      - name: Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          OK: ${{ job.status == 'success' }}
        run: |
          [ -n "$TG_TOKEN" ] || { echo "no Telegram secrets"; exit 0; }
          if [ "$OK" = true ]; then
            T="✅ לוחית ${{ steps.v.outputs.name }} (versionCode ${{ steps.v.outputs.code }}) הועלתה ל-Google Play, מסלול ${{ steps.v.outputs.track }} (${{ steps.v.outputs.status }})."
          else
            T="❌ שחרור לוחית ${{ steps.v.outputs.name }} נכשל. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${T}" >/dev/null
