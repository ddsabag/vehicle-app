name: Reviews monitor
# Three times a day, by day only: new 1-3 star Google Play reviews (last 7 days) and Play vitals crash/ANR thresholds, sent to Telegram.
# Also an encrypted snapshot of the week's reviews (branch feedback-data), and once a week the feedback digest written by Claude
# (review-digest.mjs, the monthly API credit; Dudu 1.11): quietly to Telegram and encrypted as digest.enc.json beside the snapshot, with
# each review's themes. Without the key or the SDK the snapshot goes out as before and the morning triage reads the texts.
# 06:15/11:15/17:15 UTC = 09:15/14:15/20:15 Israel summer time (UTC+3), 08:15/13:15/19:15 winter time (UTC+2): never at night in either.
on:
  schedule:
    - cron: "15 6,11,17 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Send a labelled sample alert to Telegram (wording check)"
        type: boolean
        default: false
      dry_run:
        description: "Print instead of sending to Telegram"
        type: boolean
        default: true
      digest:
        description: "Write the weekly digest now (needs dry run off)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: reviews-monitor
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8   # the weekly digest call is bounded at 150 s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Restore already-sent alerts
        uses: actions/cache/restore@v6
        with:
          path: seen.json
          key: reviews-seen-none
          restore-keys: reviews-seen-
      - name: Install the Claude SDK (the weekly digest; a failed install only leaves it out)
        continue-on-error: true
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @anthropic-ai/sdk@0.133.0   # = SDK in claude.mjs
      - name: Check reviews and vitals
        run: node .github/scripts/reviews-monitor.mjs
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON || secrets.GA_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # flash.mjs and the alert router's state (branch alert-state)
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PLAY_DEVELOPER_ID: ${{ vars.PLAY_DEVELOPER_ID }}
          PLAY_APP_ID: ${{ vars.PLAY_APP_ID }}
          REVIEWS_RESPONDER: ${{ vars.REVIEWS_RESPONDER }}   # off = review alerts always sent here
          ANTHROPIC_API_KEY: ${{ vars.AI != 'off' && secrets.ANTHROPIC_API_KEY || '' }}   # the weekly digest only (Console workspace luchit-bots, capped); a dry run never calls
          AI: ${{ vars.AI }}   # one switch for every Claude bot (claude.mjs gate; CEO review 12.11.2026)
          AI_CAP_USD: ${{ vars.AI_CAP_USD }}
          AI_GRANTS: ${{ vars.AI_GRANTS }}
          DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.digest && '1' || '0' }}
          ALERT_UPTIME_URL: ${{ vars.ALERT_UPTIME_URL }}       # luchit-reviews' /health is on the same workers.dev subdomain
          PREVIEW: ${{ inputs.preview && '1' || '0' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      - name: Publish the weekly feedback snapshot on the feedback-data branch (encrypted)
        if: ${{ hashFiles('feedback-out/reviews.enc.json') != '' }}
        run: |
          # the digest is written once a week: a run without it keeps the last one (the branch is replaced on every push)
          if [ ! -f feedback-out/digest.enc.json ] && git fetch -q --depth=1 origin feedback-data 2>/dev/null; then
            git show FETCH_HEAD:digest.enc.json > feedback-out/digest.enc.json 2>/dev/null || rm -f feedback-out/digest.enc.json
          fi
          cd feedback-out && git init -q && git checkout -q -b feedback-data && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Feedback snapshot (encrypted)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" feedback-data
      - name: Save state
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        uses: actions/cache/save@v6
        with:
          path: seen.json
          key: reviews-seen-${{ github.run_id }}
