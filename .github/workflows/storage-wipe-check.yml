name: Storage wipe check (one-off)
# 12.11.2026: Dudu's saved cars and documents were gone after a long time without opening the app (Android). What does Android do to an
# unused app's stores? Runs only on pushes to this branch; storage-wipe-check.cjs, example plate only.
on:
  push:
    branches: [qa/storage-wipe]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c   # v5.0.2, pinned by SHA (supply chain, CEO review 12.11.2026: android.yml holds the signing key)
        with:
          gradle-version: "8.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # blocking, offline, under a second: the page and the app agree on every wire between them (bridge calls and their arguments, the
      # page functions the app calls, the tab a tapped alert opens, shortcuts, shared links, the install referrer, the shrinker's keep rule)
      - name: App wiring
        run: node .github/scripts/app-wiring.mjs
      # and every event the dashboard and the reports read is still sent, also by the app's own code (analytics-flows.cjs --static, 1 s)
      - name: Dashboard reads still sent
        run: node .github/scripts/analytics-flows.cjs --static
      - name: Minify the page as the release build does
        run: |
          mkdir -p /tmp/minify && cd /tmp/minify && npm init -y >/dev/null && npm i --ignore-scripts --no-audit --no-fund terser@5.51.2 >/dev/null
          cd "$GITHUB_WORKSPACE"
          ln -sfn /tmp/minify/node_modules .github/scripts/node_modules
          node .github/scripts/obfuscate.mjs
          rm .github/scripts/node_modules
      - name: Build (release shrinking, debuggable, debug-signed)
        working-directory: android
        run: |
          VN=$(grep -oP 'APP_VERSION = "\K[^"]+' ../index.html)
          gradle --no-daemon assembleQa -PversionCode=1 -PversionName=$VN
          cp app/build/outputs/apk/qa/app-qa.apk ../app-qa.apk
          ls -la ../app-qa.apk
      - uses: actions/upload-artifact@v7
        with:
          name: app-qa
          path: app-qa.apk
          retention-days: 3

  wipe:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 31]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-qa
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.api == 35 && 'swangle_indirect' || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: node .github/scripts/storage-wipe-check.cjs app-qa.apk wipe-${{ matrix.api }}.json
