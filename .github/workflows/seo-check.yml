name: SEO check
# Push: only main, next and seo-auto (staged SEO changes), and only when site files or the SEO scripts change.
# pull_request stays unfiltered: it is the only check on the Dependabot gradle/pip PRs (see dependabot.yml).
on:
  push:
    branches: [main, next, seo-auto]
    paths: ["**.html", "sitemap.xml", "robots.txt", "manifest.json", "model/**", "magazine/**", "guide/**", ".github/scripts/seo-check.mjs", ".github/scripts/pages.mjs", ".github/scripts/landing.mjs", ".github/scripts/brands.mjs", ".github/scripts/model-recalls.mjs", ".github/workflows/seo-check.yml"]
  pull_request:
  schedule:
    - cron: "30 5 * * 1"   # Mondays: also probe the live site
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      # titles, descriptions, h1, canonical, alt, OG, JSON-LD, internal links, orphans, sitemap, robots
      - name: SEO lint
        run: node .github/scripts/seo-check.mjs
      # the home FAQ: the static section crawlers read and the FAQPage JSON-LD must say the same
      - name: FAQ parity
        run: node .github/scripts/faq-parity.mjs
      # the ministry's recall lists per maker (catalog-data branch, catalog.yml) for the model pages' recall section (model-recalls.mjs);
      # without them pages.mjs builds the pages without that section and prints a warning
      - name: Recall lists for the model pages
        run: |
          git fetch -q --depth 1 origin catalog-data && mkdir -p cat-data && git archive FETCH_HEAD r meta.json | tar -x -C cat-data \
            || echo "::warning::catalog-data could not be read: the model pages are built without their recall section"
      # smoke run of the page generators (pages.mjs + landing.mjs + brands.mjs) followed by the same lint, the pair magazine.yml runs before it
      # publishes on the 6th: a crash or a lint error fails here first. Output stays in this checkout (the committed pages drift from it by design).
      - name: Page generators run
        run: |
          node .github/scripts/model-recalls.mjs selftest
          node .github/scripts/pages.mjs
          node .github/scripts/seo-check.mjs
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Probe live URLs
        run: |
          set -u
          curl -fsS https://luchit.app/sitemap.xml -o sm.xml
          grep -o '<loc>[^<]*' sm.xml | sed 's/<loc>//' | awk 'NR<=3 || NR%8==0' > urls.txt
          echo "https://luchit.app/robots.txt" >> urls.txt; echo "https://luchit.app/manifest.json" >> urls.txt
          bad=0
          while read -r u; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$u")
            [ "$code" = 200 ] || { echo "::error::$code $u"; bad=1; }
          done < urls.txt
          echo "probed $(wc -l < urls.txt) urls"; exit $bad
