name: Live load probe (one-off, probe-live branch)
# Read-only: live-28 before release (live-watch dry, the new Worker code with the real keys, the page in Chrome; digits masked). Runs on a
# push to the probe-live branch only, output on the probe-live-out branch
on:
  push:
    branches: [probe-live]
    paths: [".github/scripts/live28-probe.mjs", ".github/workflows/live-load-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm i --no-save --no-audit --no-fund playwright-core@1.48.2 > /dev/null 2>&1; ls -la /usr/bin/google-chrome
      - run: mkdir -p out && node .github/scripts/live28-probe.mjs > out/report.txt 2>&1; wc -c out/report.txt
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Publish on probe-live-out
        run: |
          cd out && git init -q && git checkout -q -b probe-live-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Live load probe"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-live-out
