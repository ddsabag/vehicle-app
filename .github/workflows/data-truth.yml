name: Data truth
# Does what the app shows still match the Ministry of Transport's registers? Two jobs, one branch (data-truth) for their files:
#  audit (daily):       site-data-truth.mjs opens a fresh sample of about 40 cars in this checkout's index.html (main = what is live), reads every
#                       tab like a user and compares it with the ministry's raw rows (site-data-audit.mjs). Only totals, case ids and plate-free
#                       values are published (latest.json, history.json). A field that has to match and did not sends one Telegram line
#                       through the alert router (key truth:<groups>); too few cars read sends truth:fail.
#  invariants (weekly): data-invariants.mjs reads the registers in full and checks the facts the app's rules rest on (fresh test dates,
#                       licence renewals reaching the data, plates shared between registers, the register's current owner against the
#                       ownership log, the towing hook against the model data, the price list, odd dates, public vehicles cancelled for good
#                       against the cancel registers, the registers that lend each other dates) against fixed limits
#                       (invariants.json, inv-history.json). A broken limit sends one line (key truth:inv:<ids>).
#  deep (monthly):      deep-audit.mjs (Claude API use #7, Dudu 28.10.2026): the same audit on about 100 cars drawn with a seed nobody sees,
#                       then Claude reads each car's page against its rows in one Message Batch. Findings the fixed rules missed are
#                       candidates for new rules. Only counts in the clear (deep-summary.json); the findings encrypted (deep-audit.enc.json).
#                       The router hears truth:deep:<areas> (news for the data thread), truth:deep-fail, ai:audit or ai:key. Never red over
#                       the API. The 2nd and the 3rd are retries that end at once when the month's audit is done.
on:
  schedule:
    - cron: "47 4 * * *"   # 04:47 UTC = 07:47 Israel summer time, 06:47 winter: after the ministry's nightly rebuild and Ministry watch (04:07)
    - cron: "17 1 * * 0"   # Sunday 01:17 UTC: the weekly full read (about 40 min), done long before the morning
    - cron: "17 5 1-3 * *"   # the 1st of the month 05:17 UTC (after the daily audit has its cars), the 2nd and the 3rd only when the 1st could not finish
  workflow_dispatch:
    inputs:
      job:
        description: "audit = the daily sample of cars, invariants = the weekly full read, deep = the monthly deep audit with Claude"
        type: choice
        options: [audit, invariants, deep]
        default: audit
      queries:
        description: "audit or deep, e.g. n=30;rare=10;minutes=55 (seed= replaces the date; deep also wait=, effort=, max=, dry=1)"
        default: ""
      dry_run:
        description: "Print the alert instead of sending it (the files are still published)"
        type: boolean
        default: false
      publish:
        description: "Publish latest.json and the day in history.json (off for the check after a web deploy, so the morning's sample stays the day's record)"
        type: boolean
        default: true
permissions:
  contents: write   # the data-truth branch
jobs:
  audit:
    if: ${{ github.event.schedule == '47 4 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'audit') }}
    runs-on: ubuntu-24.04   # Playwright 1.49.1 predates Ubuntu 26.04
    timeout-minutes: 75
    concurrency:
      group: data-truth-publish   # the daily and the weekly job commit to the same branch, one at a time (the deep job's hours do not hold them)
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install a browser (the audit opens the app like a user)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Audit a fresh sample of cars
        run: node .github/scripts/site-data-truth.mjs
        env:
          QUERIES: ${{ inputs.queries }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Publish on the data-truth branch
        if: ${{ always() && hashFiles('out/latest.json') != '' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        run: .github/scripts/data-truth-publish.sh "audit" out/latest.json out/history.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  invariants:
    if: ${{ github.event.schedule == '17 1 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.job == 'invariants') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: data-truth-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Read the registers and check the invariants
        run: node --max-old-space-size=12000 .github/scripts/data-invariants.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Publish on the data-truth branch
        if: ${{ always() && hashFiles('out/invariants.json') != '' }}
        run: .github/scripts/data-truth-publish.sh "invariants" out/invariants.json out/inv-history.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deep:
    if: ${{ github.event.schedule == '17 5 1-3 * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'deep') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # the audit's own budget (minutes=140) and the batch's wait (wait=180: a test batch of 12 took an hour), with room
    concurrency:
      group: data-truth-deep   # its own: it publishes once, at the end, and data-truth-publish.sh starts again from the other jobs' commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Done this month already? (a scheduled retry after a good run ends here)
        id: due
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && git fetch -q --depth 1 origin data-truth 2>/dev/null && git show FETCH_HEAD:deep-summary.json > "$RUNNER_TEMP/prev.json" 2>/dev/null \
            && node -e 'const s = require(process.argv[1]); process.exit(s.d === new Date().toISOString().slice(0, 7) && s.answered >= 10 ? 0 : 1)' "$RUNNER_TEMP/prev.json"; then
            echo "this month's deep audit is done"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: ${{ steps.due.outputs.skip != '1' }}
        with:
          node-version: 20
      - name: Install a browser and the Claude SDK (the version pinned in claude.mjs; the app never loads it)
        if: ${{ steps.due.outputs.skip != '1' }}
        run: |
          # one install for both (a second --no-save install would drop the first); without the SDK the script tells the router (ai:audit)
          npm install --no-save --no-audit --no-fund --loglevel=error playwright@1.49.1 "$(sed -n 's/^export const SDK = "\(.*\)";$/\1/p' .github/scripts/claude.mjs)" \
            || npm install --no-save --no-audit --no-fund --loglevel=error playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Read the cars like a user, then ask Claude about each (Claude API use #7)
        if: ${{ steps.due.outputs.skip != '1' }}
        run: |
          node .github/scripts/deep-audit.mjs
        env:
          OUT: out
          QUERIES: ${{ inputs.queries }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Publish on the data-truth branch (the findings encrypted, the counts in the clear)
        if: ${{ always() && steps.due.outputs.skip != '1' && hashFiles('out/deep-summary.json') != '' }}
        run: .github/scripts/data-truth-publish.sh "deep" out/deep-audit.enc.json out/deep-summary.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
