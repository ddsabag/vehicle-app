name: Performance probe (one-off, probe-perf branch)
# Read-only, 20.10: the day's numbers for "is the direction positive for the store and for Google" (GA4, Search Console, Google Play's
# reports, Cloudflare). The output is encrypted with .github/seo-data.pub.pem, so no business number is in the log or the branch in
# clear. Runs on a push to the probe-perf branch only; output on the probe-perf-out branch.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/perf-probe.mjs", ".github/workflows/perf-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/perf-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Publish on probe-perf-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b probe-perf-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Performance probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-perf-out
