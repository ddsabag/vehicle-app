name: Release guard
# Zone A of the autopilot rules (Dudu approved 25.10): day 1, 3 and 7 after an app version reaches people, compares it per 100 car checks
# with the version before it (compare from card and menu, saves, unsaves over saves, events that stopped) and tells the product thread
# through the alert router (release-guard.mjs). Crashes stay with Release watch. Only reads GA4; the log prints states only.
# Daily 04:23 UTC = 06:23 Israel in winter, 07:23 in summer: the 08:22 morning triage reads what this run opens, and GitHub starts scheduled
# runs late (the first one, 26.10 at 06:10 UTC, started 42 minutes late; 27.10 had not started by 06:27). Owner: measurement.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = judge and show (digits masked), no message; on = as the schedule"
        type: choice
        options: [dry, "on"]   # quoted: YAML reads a bare on as true
        default: dry
      day:
        description: "judge as if today were this Israel date (YYYY-MM-DD), empty = today"
        default: ""
permissions:
  contents: write   # alert.mjs keeps its dedupe state on the alert-state branch
concurrency: release-guard
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the second look reads the release notes' history and the app commits since the base version
          sparse-checkout: |
            .github/scripts/release-guard.mjs
            .github/scripts/guard-explain.mjs
            .github/scripts/claude.mjs
            .github/scripts/ai-usage.mjs
            .github/seo-data.pub.pem
            analytics/review-context.md
            android/release-notes.txt
            .github/scripts/tg-text.mjs
            .github/scripts/alert.mjs
            .github/scripts/bot-names.json
            analytics/ga4-admin.json
            worker/live/worker.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: node .github/scripts/release-guard.mjs selftest
      - name: The Claude SDK for the second look (the version pinned in claude.mjs; without it the guard runs as before)
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund --loglevel=error "$(sed -n 's/^export const SDK = "\(.*\)";$/\1/p' .github/scripts/claude.mjs)"
      - run: node .github/scripts/release-guard.mjs
        env:
          ANTHROPIC_API_KEY: ${{ vars.AI != 'off' && secrets.ANTHROPIC_API_KEY || '' }}
          AI: ${{ vars.AI }}   # one switch for every Claude bot (claude.mjs gate; CEO review 12.11.2026)
          AI_CAP_USD: ${{ secrets.AI_CAP_USD }}   # a secret, so the amount never shows in the public log (rule 11)
          AI_GRANTS: ${{ secrets.AI_GRANTS }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'on' }}
          DAY: ${{ inputs.day }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
