name: Web watch
# Daily PageSpeed (mobile, median of 3) and real-user LCP for the split web build. Silent unless the rollback rule trips (see analytics/web_watch.py).
# Then the pipe canary (.github/scripts/pipe-canary.mjs): yesterday in GA4 against Cloudflare, silent unless the analytics pipe looks broken.
on:
  schedule:
    - cron: "25 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print only, do not save or send"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: web-watch
jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Load saved state
        run: |
          mkdir -p state
          git fetch -q origin web-watch 2>/dev/null && git --work-tree=state checkout FETCH_HEAD -- history.json || true
      - name: Measure
        id: measure
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # flash.mjs: the alert on the /live dashboard; the alert router's state
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
        run: python analytics/web_watch.py state ${{ inputs.dry_run && '--dry' || '' }}
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with: { node-version: 20 }
      # never costs the speed watch or its saved state: a failed canary shows as a failed step, the job goes on
      - name: Pipe canary (analytics)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node .github/scripts/pipe-canary.mjs
      - name: Save state
        if: ${{ !inputs.dry_run }}
        run: |
          cd state
          git init -q -b web-watch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -qm "web-watch $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-watch
      # the state is saved first; the run then fails so the lost alert still reaches Failure alert and GitHub's failure email
      - name: Rollback alert did not reach Telegram
        if: ${{ steps.measure.outputs.telegram_failed == '1' }}
        run: |
          echo "::error::Telegram did not take the rollback alert (see Measure). The state is saved and the /live dashboard has the alert."
          exit 1
