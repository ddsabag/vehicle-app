name: Anomaly check probe (one-off, probe-perf branch)
# Read-only, 8.11.2026: the Sunday anomaly review's check items (week 1-7.11) by hour, platform and version.
# The output is encrypted with .github/seo-data.pub.pem, so no business number is in the log or the branch in clear. Runs on a push to the
# probe-perf branch only; output on the probe-anom1108-out branch.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/anom1108-probe.mjs", ".github/workflows/anom1108-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/anom1108-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish on probe-anom1108-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b probe-anom1108-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Anomaly check probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-anom1108-out
