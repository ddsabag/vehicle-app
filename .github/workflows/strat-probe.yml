name: Strategy pulls probe (probe-perf branch)
# 12.11, CEO full review (Measurement task 2), for strategy's 21.11 prep: PRO taps while everything is free, bulk_check repeat devices,
# app vs web checks. Read-only GA4; output encrypted on branch strat-probe-out. Re-run by adding a line to .github/strat-run.txt.
on:
  push:
    branches: [probe-perf]
    paths: [".github/scripts/strat-probe.mjs", ".github/workflows/strat-probe.yml", ".github/strat-run.txt"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: node .github/scripts/strat-probe.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish on strat-probe-out (encrypted only)
        run: |
          cd out && git init -q && git checkout -q -b strat-probe-out && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Strategy pulls probe (encrypted)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" strat-probe-out
