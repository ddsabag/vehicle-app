name: App guardian (real app)
# PROBE on branch guardian-turn only, never merged (main keeps the real App guardian): on Android 15 the turned phone's screenshot shows
# a second plate row under the buttons and a white band at the right, three runs out of three on 28.10 (40728941690, the next run of
# b85d87bc and the run before); Android 12 is clean. Is it the page or the emulator's drawing? Each try keeps four pictures of the turned
# phone (shots/turn-*.png): a the screen as main takes it, b the page's own picture through DevTools, c the screen 4 s later, d the screen
# after the whole page is drawn again. Android 15 on swangle_indirect (main) twice, on swiftshader_indirect (before 7eadbb4a) twice,
# Android 12 once. Pictures and meta.json to branch guardian-turn-out. Never red.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Unused in the probe"
        type: boolean
        default: false
permissions:
  contents: write   # only the publish job writes, to branch guardian-turn-out
concurrency:
  group: app-guardian-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Minify the page as the release build does
        run: |
          mkdir -p /tmp/minify && cd /tmp/minify && npm init -y >/dev/null && npm i --ignore-scripts --no-audit --no-fund terser@5.51.2 >/dev/null
          cd "$GITHUB_WORKSPACE"
          ln -sfn /tmp/minify/node_modules .github/scripts/node_modules
          node .github/scripts/obfuscate.mjs
          rm .github/scripts/node_modules
      - name: Build (release shrinking, debuggable, debug-signed)
        working-directory: android
        run: |
          VN=$(grep -oP 'APP_VERSION = "\K[^"]+' ../index.html)
          gradle --no-daemon assembleQa -PversionCode=1 -PversionName=$VN
          cp app/build/outputs/apk/qa/app-qa.apk ../app-qa.apk
          ls -la ../app-qa.apk
      - uses: actions/upload-artifact@v7
        with:
          name: app-qa
          path: app-qa.apk
          retention-days: 3

  device:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 35, gfx: swangle_indirect, copy: 1 }
          - { api: 35, gfx: swangle_indirect, copy: 2 }
          - { api: 35, gfx: swiftshader_indirect, copy: 1 }
          - { api: 35, gfx: swiftshader_indirect, copy: 2 }
          - { api: 31, gfx: swiftshader_indirect, copy: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-qa
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the test tools (not part of the app)
        run: npm install --no-save --no-package-lock playwright@1.63.0 pngjs@7.0.0
      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The real app on the emulator (ways in, then turned on its side)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEBUG: pw:android
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gfx }} -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: mkdir -p app-real/${{ matrix.api }}-${{ matrix.gfx }}-${{ matrix.copy }} && node .github/scripts/app-real.cjs --apk app-qa.apk --scenario 411-extra --out app-real/${{ matrix.api }}-${{ matrix.gfx }}-${{ matrix.copy }} --label ${{ matrix.api }}-${{ matrix.gfx }}-${{ matrix.copy }}
      - name: How it ended
        if: ${{ always() }}
        run: |
          D="app-real/${{ matrix.api }}-${{ matrix.gfx }}-${{ matrix.copy }}"
          mkdir -p "$D"
          T=$(node -e 'try { console.log(JSON.stringify(require(process.argv[1]).turn || "no turn")) } catch { console.log("no meta.json") }' "$PWD/$D/meta.json")
          echo "::notice::probe API ${{ matrix.api }} ${{ matrix.gfx }} copy ${{ matrix.copy }}: exit $(cat "$D/exit" 2>/dev/null || echo none)$( [ -f "$D/gone" ] && echo ", gone: $(head -1 "$D/gone")" ); turn $T"
          ls -la "$D/shots" 2>/dev/null | grep -E "landscape|turn-" || true
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: turn-${{ matrix.api }}-${{ matrix.gfx }}-${{ matrix.copy }}
          path: app-real
          retention-days: 3

  publish:
    needs: device
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: turn-*
          merge-multiple: true
          path: app-real
      - name: The turned phone's pictures to branch guardian-turn-out
        run: |
          cd app-real
          # only the landscape pictures and each try's meta.json: the rest of the shots are the real guardian's
          find . -path '*/shots/*' -type f ! -name '*landscape*' ! -name 'turn-*' -delete
          printf '{"commit":"%s","run":"%s/%s/actions/runs/%s","at":"%s"}\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > run.json
          ls -R . | head -60
          git init -q -b guardian-turn-out && git add .
          git -c user.name="app-guardian" -c user.email="app-guardian@users.noreply.github.com" commit -q -m "Turn probe: the real app on ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" guardian-turn-out
