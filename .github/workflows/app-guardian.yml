name: App guardian (real app)
# PROBE on branch guardian-a15 only, never merged (main keeps the real App guardian): why the Android 15 emulator stops in the ways-in
# phone setting (411-extra) in most tries. Eight emulators at once on that one setting: four cut the network as main does (WiFi and
# mobile data off), four through a proxy that is not there (the radio stays on). Each prints one notice line with how it ended, the
# phone's last log lines when the emulator stopped, and the emulator's crash reports. Never red: nothing here is about the app.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Unused in the probe"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: app-guardian-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Minify the page as the release build does
        run: |
          mkdir -p /tmp/minify && cd /tmp/minify && npm init -y >/dev/null && npm i --ignore-scripts --no-audit --no-fund terser@5.51.2 >/dev/null
          cd "$GITHUB_WORKSPACE"
          ln -sfn /tmp/minify/node_modules .github/scripts/node_modules
          node .github/scripts/obfuscate.mjs
          rm .github/scripts/node_modules
      - name: Build (release shrinking, debuggable, debug-signed)
        working-directory: android
        run: |
          VN=$(grep -oP 'APP_VERSION = "\K[^"]+' ../index.html)
          gradle --no-daemon assembleQa -PversionCode=1 -PversionName=$VN
          cp app/build/outputs/apk/qa/app-qa.apk ../app-qa.apk
          ls -la ../app-qa.apk
      - uses: actions/upload-artifact@v7
        with:
          name: app-qa
          path: app-qa.apk
          retention-days: 3

  device:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        cut: [wifi, proxy]
        copy: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-qa
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the test tools (not part of the app)
        run: npm install --no-save --no-package-lock playwright@1.63.0 pngjs@7.0.0
      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The real app on the emulator (Android 15, ways in)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEBUG: pw:android
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: mkdir -p app-real/out && node .github/scripts/app-real.cjs --apk app-qa.apk --scenario 411-extra --out app-real/out --label ${{ matrix.cut }}-${{ matrix.copy }} --cut ${{ matrix.cut }}
      - name: How it ended
        if: ${{ always() }}
        run: |
          D=app-real/out
          CODE=$(cat "$D/exit" 2>/dev/null || echo none)
          GONE=$(head -1 "$D/gone" 2>/dev/null || true)
          F=$(node -e 'try { const f = require(process.argv[1]); console.log(f.length + " findings" + (f.length ? ": " + f.map((x) => x.sev + " " + x.step).join(", ") : "")) } catch { console.log("no findings file") }' "$PWD/$D/findings.json")
          echo "::notice::probe cut=${{ matrix.cut }} copy=${{ matrix.copy }}: exit $CODE${GONE:+, $GONE}; $F"
          echo "--- the emulator's crash reports"
          ls -laR /tmp/android-runner 2>/dev/null | head -40 || true
          for f in $(find /tmp/android-runner -name '*.dmp' 2>/dev/null); do
            echo "== $f"; strings -n 8 "$f" | grep -iE "abort|fatal|assert|check failed|netsim|wifi|gfxstream|vulkan|swiftshader|segv|signal|crash" | sort | uniq -c | sort -rn | head -30
          done
          echo "--- kernel"
          sudo dmesg 2>/dev/null | tail -25 || true
          free -m
