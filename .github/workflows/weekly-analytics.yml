name: Weekly analytics report
# Every Sunday at 08:00 Jerusalem time: pulls the last 7 days from GA4, builds the dashboard, flags anomalies and sends a short brief.
# Two cron lines because GitHub cron is UTC and Israel switches between UTC+2 and UTC+3: the script checks which line is 08:xx in Jerusalem,
# by the line's own time (SCHEDULE below), not by the start time, since GitHub starts scheduled runs late. So exactly one line sends.
# The dashboard holds business numbers, so it is kept as a private run artifact and sent to you, never published on the public site.
# Needs these repository secrets (see analytics/SETUP.md): GA_PROPERTY_ID, GA_SERVICE_ACCOUNT_JSON, and at least one of
# TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID, SLACK_WEBHOOK_URL, or SMTP_HOST + EMAIL_TO (+ SMTP_USER, SMTP_PASSWORD, SMTP_FROM, SMTP_PORT).
# Alert router: the brief opens with the "מחכה לך" block (.github/scripts/waiting.mjs reads the router state, open PRs and scheduled runs,
# so the report job gets read scopes only). When the brief went out, the separate "mark" job (no pip, no third-party code) records it
# on the alert-state branch; it can never turn the run red.
on:
  schedule:
    - cron: "20 5 * * 0"
    - cron: "20 6 * * 0"
  workflow_dispatch:
    inputs:
      sample:
        description: "Use synthetic numbers (layout test, nothing is sent)"
        type: boolean
        default: false
      send:
        description: "Send the brief now, ignoring the Sunday 08:00 check"
        type: boolean
        default: false
      review:
        description: "Run the Claude anomaly review without sending the brief (a test of the review)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:   # read only: this job runs pip packages; the one write (the summary mark) is in "mark" below
      contents: read
      actions: read
      pull-requests: read
    outputs:
      sent: ${{ steps.build.outputs.sent }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analytics/requirements.txt
      - name: Build the report
        id: build
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || secrets.BREVO_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          ALERT_UPTIME_URL: ${{ vars.ALERT_UPTIME_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python analytics/run.py --gate --send
          elif [ "${{ inputs.sample }}" = "true" ]; then
            python analytics/run.py --sample incident
          elif [ "${{ inputs.send }}" = "true" ]; then
            python analytics/run.py --send
          else
            python analytics/run.py
          fi
      # Claude reads the week's anomalies (anomaly-review.mjs, Dudu 1.11.2026, the monthly API credit): only on a real report, never on a
      # sample. The key is in that one step's env; the reply leaves the job encrypted. Nothing here can turn the report red.
      - uses: actions/setup-node@v7
        if: ${{ github.event_name == 'schedule' || inputs.send == true || inputs.review == true }}
        continue-on-error: true
        with:
          node-version: 22
      - name: The Claude SDK (the version pinned in claude.mjs)
        if: ${{ github.event_name == 'schedule' || inputs.send == true || inputs.review == true }}
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund --loglevel=error "$(sed -n 's/^export const SDK = "\(.*\)";$/\1/p' .github/scripts/claude.mjs)"
      - name: Claude reviews the anomalies (encrypted)
        if: ${{ github.event_name == 'schedule' || inputs.send == true || inputs.review == true }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/anomaly-review.mjs analytics/out out-review
      - uses: actions/upload-artifact@v7
        if: ${{ hashFiles('out-review/status.json') != '' }}
        continue-on-error: true
        with:   # encrypted review and a status with no numbers; one day, for the publish job only
          name: anomaly-review
          path: out-review/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.sample == true }}   # layout tests only: the real dashboard holds business numbers and a public repo's artifacts are downloadable
        with:
          name: weekly-report
          path: analytics/out/
          retention-days: 90
          if-no-files-found: ignore
  mark:
    # hb.summaryAt on alert-state: the router keeps summary/silent items for Sunday only while this is under 8 days old,
    # and alert-daily asks for a re-run on Monday when it is missing. A failure here changes nothing else.
    needs: report
    if: needs.report.outputs.sent == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          sparse-checkout: .github/scripts/alert.mjs
          sparse-checkout-cone-mode: false
      - name: Mark the Sunday summary as sent
        continue-on-error: true
        run: node .github/scripts/alert.mjs mark-summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  review-out:
    # no third-party code here: pushes the encrypted review to the branch weekly-review (the measurement thread's Sunday task reads it) and
    # tells the router how the review went. Never turns the run red.
    needs: report
    if: ${{ always() && (github.event_name == 'schedule' || inputs.send == true || inputs.review == true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/alert.mjs
            .github/scripts/anomaly-review.mjs
            .github/scripts/claude.mjs
            .github/scripts/ai-usage.mjs
            .github/seo-data.pub.pem
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: anomaly-review
          path: out-review
      - name: Publish on weekly-review (encrypted only)
        if: ${{ hashFiles('out-review/status.json') != '' }}
        run: |
          set -e
          d="$(mktemp -d)"; cp out-review/* "$d/"
          cd "$(mktemp -d)" && git init -q && git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan weekly-review && cp "$d"/* . && echo "run ${GITHUB_RUN_ID}" > run.txt && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Anomaly review (encrypted)"
          git push -q -f origin weekly-review && echo "published"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tell the router
        run: node .github/scripts/anomaly-review.mjs --route out-review/status.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ROUTE: ${{ vars.ALERT_ROUTE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
