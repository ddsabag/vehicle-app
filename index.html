<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>פרטי רכב</title>
<meta name="description" content="כל הפרטים על רכב לפי מספר רישוי, ממאגרי משרד התחבורה">
<script>
/* Background choice: light (default), dark, or follow the phone. Kept in this browser only. */
(function(){
  var c = "light"; try { c = localStorage.getItem("theme") || "light"; } catch (e) {}
  if (c === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", c);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: an app screen. Navy header band holding the yellow plate search; below it one column of cards: identity, key numbers, then grouped facts. */
:root{
  --bg:#eef0f4; --card:#ffffff; --fg:#151a24; --muted:#5d6676; --line:#e1e4ea;
  --band:#ffffff; --band-fg:#151a24; --band-muted:#5d6676; --band-line:#d5dae3;
  --plate:#f6c500; --plate-ink:#111; --il:#1d4ea8; --accent:#1d4ea8;
  --ok:#147a43; --ok-bg:#dff3e7; --warn:#995400; --warn-bg:#fcefd6; --bad:#b42318; --bad-bg:#fde4e1;
  --f-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1118; --card:#161c27; --fg:#e9edf3; --muted:#97a1b3; --line:#252d3b;
  --band:#0a0f1a; --band-fg:#ffffff; --band-muted:#8d98ad; --band-line:#33415f; --accent:#86a9f0;
  --ok:#6ad49b; --ok-bg:#12301f; --warn:#f2b55c; --warn-bg:#34260e; --bad:#f4877c; --bad-bg:#3b1815;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1118; --card:#161c27; --fg:#e9edf3; --muted:#97a1b3; --line:#252d3b;
  --band:#0a0f1a; --band-fg:#ffffff; --band-muted:#8d98ad; --band-line:#33415f; --accent:#86a9f0;
  --ok:#6ad49b; --ok-bg:#12301f; --warn:#f2b55c; --warn-bg:#34260e; --bad:#f4877c; --bad-bg:#3b1815;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);min-height:100vh}
.band{background:var(--band);color:var(--band-fg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.band-in{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:18px 22px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand h1{margin:0;font-size:1.25rem;font-weight:800;letter-spacing:.01em}
.brand span{color:var(--band-muted);font-size:.85rem}
form{display:flex;gap:10px}
.plate{flex:1;min-width:0;display:flex;direction:ltr;background:var(--plate);border:3px solid #0b0b0b;border-radius:9px;overflow:hidden;height:66px}
.plate .il{background:var(--il);color:#fff;width:40px;flex:0 0 40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7px;font:700 11px/1.15 var(--f-body)}
.plate input{flex:1;min-width:0;border:0;background:transparent;color:var(--plate-ink);font:600 clamp(1.7rem,8vw,2.35rem)/1 var(--f-num);letter-spacing:.05em;text-align:center;padding:0 6px;outline:none}
.plate input::placeholder{color:rgba(0,0,0,.3)}
.plate:focus-within{box-shadow:0 0 0 3px var(--band),0 0 0 5px var(--accent)}
button{font:inherit;cursor:pointer;color:inherit}
.go{flex:0 0 auto;width:66px;height:66px;border-radius:9px;border:0;background:var(--plate);color:#111;display:grid;place-items:center}
.go svg{width:26px;height:26px}
.go[disabled]{opacity:.6;cursor:progress}
.go:focus-visible,.chip:focus-visible,.gear:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.recent{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:transparent;border:1px solid var(--band-line);color:var(--band-fg);border-radius:6px;padding:3px 9px;font:500 .85rem var(--f-num);direction:ltr}

main{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:.82rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.msg{background:var(--card);border-radius:14px;padding:16px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.note{font-size:.85rem;color:var(--muted);margin:0}

/* identity */
.id-title{margin:0;font-size:1.6rem;font-weight:800;line-height:1.2;text-wrap:balance}
.id-sub{margin:0;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bg)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}

/* key numbers */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:14px;padding:14px 16px;min-width:0}
.stat .k{font-size:.85rem;color:var(--muted)}
.stat .v{font:600 1.65rem/1.15 var(--f-num);font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.stat .u{font-size:.8rem;color:var(--muted);margin-inline-start:4px;font-family:var(--f-body)}

/* facts */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:.82rem;color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.facts .wide{grid-column:1/-1}
.mono{font-family:var(--f-num);font-weight:500;direction:ltr;unicode-bidi:isolate}
.flag-bad{color:var(--warn)}
.systems{display:flex;flex-wrap:wrap;gap:6px}
.systems span{font-size:.85rem;padding:4px 10px;border-radius:8px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:82px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.timeline li:first-child{border-top:0}
.timeline time{font:500 .92rem var(--f-num);color:var(--muted);direction:ltr;text-align:right}
.timeline .now{font-size:.75rem;font-weight:700;color:var(--ok);background:var(--ok-bg);padding:1px 7px;border-radius:999px;margin-inline-start:8px}
.recall{border-inline-start:3px solid var(--bad);padding-inline-start:12px}
.recall b{display:block}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
footer{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 32px;font-size:.8rem;color:var(--muted)}
footer a{color:var(--accent)}

/* towing */
.tow-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tow-grid>div{background:var(--bg);border-radius:10px;padding:12px 14px}
.tow-grid .k{font-size:.9rem;color:var(--muted);font-weight:600}
.tow-grid .v{font:600 2rem/1.15 var(--f-num);font-variant-numeric:tabular-nums;margin-top:2px}
.tow-grid .u,.stat .u{font-size:.8rem;color:var(--muted);margin-inline-start:4px;font-family:var(--f-body)}
/* settings */
.brand-actions{display:flex;align-items:center;gap:10px}
.gear{width:38px;height:38px;border-radius:9px;border:1px solid var(--band-line);background:transparent;display:grid;place-items:center}
.gear svg{width:20px;height:20px}
.settings{background:var(--card);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--fg);border:1px solid var(--line)}
.seg{display:flex;background:var(--bg);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
@media (max-width:360px){.facts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="band">
  <div class="band-in">
    <div class="brand"><h1>פרטי רכב</h1><div class="brand-actions"><span>ממאגרי משרד התחבורה</span><button class="gear" id="gear" type="button" aria-label="הגדרות" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div></div>
    <div class="settings" id="settings" hidden><span>רקע</span><div class="seg" role="group" aria-label="רקע"><button type="button" data-theme-choice="light">בהיר</button><button type="button" data-theme-choice="dark">כהה</button><button type="button" data-theme-choice="auto">לפי הטלפון</button></div></div>
    <form id="f" autocomplete="off">
      <label class="plate" for="plate">
        <span class="il" aria-hidden="true"><span>IL</span><span>ישראל</span></span>
        <input id="plate" name="plate" inputmode="numeric" placeholder="12-345-67" maxlength="10" aria-label="מספר רישוי" enterkeyhint="search">
      </label>
      <button class="go" id="go" type="submit" aria-label="חיפוש"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg></button>
    </form>
    <div class="recent" id="recent" hidden></div>
  </div>
</div>
<main id="out" aria-live="polite"></main>
<footer>המידע מגיע מהמאגרים הפתוחים של משרד התחבורה ב-<a href="https://data.gov.il/dataset?organization=ministry_of_transport" target="_blank" rel="noopener">data.gov.il</a>, ואינו מחליף נסח רישום רשמי.</footer>

<script>
"use strict";
const API = "https://data.gov.il/api/3/action/datastore_search";

/* Datasets keyed by plate. role main = the vehicle record itself. */
const PLATE_SETS = [
  {key:"active",     id:"053cea08-09bc-40ec-8f7a-156f0677aff3", role:"main", status:"פעיל"},
  {key:"moto",       id:"bf9df4e2-d90d-4c0a-a400-19e15af8e95f", role:"main", status:"פעיל", kind:"דו-גלגלי"},
  {key:"heavy",      id:"cd3acc5c-03c3-4c89-9c54-d40f93c0d790", role:"main", status:"פעיל", kind:"רכב כבד"},
  {key:"public",     id:"cf29862d-ca25-4691-84f6-1be60dcb4a1e", role:"main", status:"פעיל", kind:"רכב ציבורי"},
  {key:"import",     id:"03adc637-b6fe-402b-9937-7c3d3afc9140", role:"main", status:"פעיל", kind:"יבוא אישי"},
  {key:"inactive",   id:"f6efe89a-fb3d-43a4-bb61-9bf12a9b9099", role:"main", status:"לא פעיל", tone:"warn"},
  {key:"inactive2",  id:"6f6acd03-f351-4a8f-8ecf-df792f4f573a", role:"main", status:"לא פעיל", tone:"warn"},
  {key:"cancel",     id:"851ecab1-0622-4dbe-a6c7-f950cf82abf9", role:"main", status:"ירד מהכביש", tone:"bad", pad:true},
  {key:"cancel2010", id:"4e6b9724-4c1e-43f0-909a-154d4cc4e046", role:"main", status:"ירד מהכביש", tone:"bad", pad:true},
  {key:"cancel2000", id:"ec8cbc34-72e1-4b69-9c48-22821ba0bd6c", role:"main", status:"ירד מהכביש", tone:"bad", pad:true},
  {key:"cont",       id:"0866573c-40cd-4ca8-91d2-9dd2d7a492e5", role:"extra"},
  {key:"tech",       id:"56063a99-8a3e-4ff4-912e-5966c0279bad", role:"extra", pad:true},
  {key:"owners",     id:"bb2355dc-9ec7-4f06-9c3f-3344672171da", role:"extra", pad:true},
  {key:"recall",     id:"36bf1404-0be4-49d2-82dc-2f1ead4a8b93", role:"extra", field:"MISPAR_RECHEV"},
];
/* Datasets keyed by model (tozeret_cd + degem_cd + shnat_yitzur) */
const MODEL_SETS = {
  wltp:   "142afde2-6228-49f9-8a29-9b6c3a0cbe40",
  counts: "5e87a7a1-2f6f-41c1-8aec-7216d52a6cf6",
  price:  "39f455bf-6db0-4926-859d-017f34eacbcb",
};

/* Safety systems listed by name when the model has them */
const SYSTEMS = {
  abs_ind:"ABS", bakarat_yatzivut_ind:"בקרת יציבות", maarechet_ezer_labalam_ind:"בלימה אוטונומית",
  bakarat_stiya_menativ_ind:"התרעת סטייה מנתיב", bakarat_stiya_activ_s:"שמירה על נתיב",
  nitur_merhak_milfanim_ind:"שמירת מרחק", zihuy_beshetah_nistar_ind:"ניטור שטח מת",
  bakarat_shyut_adaptivit_ind:"בקרת שיוט אדפטיבית", zihuy_holchey_regel_ind:"זיהוי הולכי רגל",
  blimat_hirum_lifnei_holhei_regel_ofanaim:"בלימה להולכי רגל ורוכבי אופניים", zihuy_rechev_do_galgali:"זיהוי דו-גלגלי",
  matzlemat_reverse_ind:"מצלמת רוורס", blima_otomatit_nesia_leahor:"בלימה אוטומטית ברוורס",
  hayshaney_lahatz_avir_batzmigim_ind:"חיישני לחץ אוויר", hayshaney_hagorot_ind:"חיישני חגורות",
  shlita_automatit_beorot_gvohim_ind:"אורות גבוהים אוטומטיים", teura_automatit_benesiya_kadima_ind:"תאורה אוטומטית",
  zihuy_tamrurey_tnua_ind:"זיהוי תמרורים", zihuy_matzav_hitkarvut_mesukenet_ind:"התרעת התקרבות מסוכנת",
  bakarat_mehirut_isa:"בקרת מהירות חכמה", hitnagshut_cad_shetah_met:"מניעת התנגשות צד", alco_lock:"אלכו-לוק",
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const empty = v => v === null || v === undefined || String(v).trim() === "" || String(v).trim() === "0000-00-00";
const digits = s => String(s || "").replace(/\D/g, "");
const num = v => Number(String(v).replace(/,/g, ""));
const isNum = v => !empty(v) && !isNaN(num(v));
const fmtN = v => isNum(v) ? num(v).toLocaleString("he-IL") : String(v);
const yes = v => String(v).trim() === "1";
function fmtPlate(d){ d = String(d);
  if (d.length === 7) return d.slice(0,2)+"-"+d.slice(2,5)+"-"+d.slice(5);
  if (d.length === 8) return d.slice(0,3)+"-"+d.slice(3,5)+"-"+d.slice(5);
  return d; }
function fmtDate(v){
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[3]}/${m[2]}/${m[1]}`;
  if ((m = s.match(/^(\d{4})-(\d{1,2})$/))) return `${m[2].padStart(2,"0")}/${m[1]}`;
  if ((m = s.match(/^(\d{4})(\d{2})$/))) return `${m[2]}/${m[1]}`;
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return `${m[3]}/${m[2]}/${m[1]}`;
  return s;
}
function toDate(v){ const m = String(v).match(/^(\d{4})-?(\d{2})-?(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function titleCase(s){ return String(s).trim(); }
/* Make names arrive like "טויוטה יפן" / "פולקסווגן גרמניה": drop the trailing country the record already carries */
function makeName(v){
  let n = String(v.tozeret_nm || "").trim();
  const c = String(v.tozeret_eretz_nm || "").trim();
  if (c && n.endsWith(" " + c)) n = n.slice(0, -c.length - 1);
  return n;
}

/* ---------- API ---------- */
async function ds(resource_id, filters, limit, signal){
  const p = new URLSearchParams({resource_id, filters: JSON.stringify(filters), limit: String(limit || 100)});
  const r = await fetch(`${API}?${p}`, {signal, headers:{Accept:"application/json"}});
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  if (!j.success) throw new Error((j.error && (j.error.message || JSON.stringify(j.error))) || "CKAN error");
  return j.result.records || [];
}
/* Plate columns are text in some datasets and numeric in others; old archives zero-pad. */
async function byPlate(set, plate, signal){
  const field = set.field || "mispar_rechev";
  const forms = [plate, Number(plate)];
  if (set.pad && plate.length < 8) forms.push(plate.padStart(7,"0"), plate.padStart(8,"0"));
  let lastErr = null, ok = false;
  for (const v of [...new Set(forms)]) {
    try { const rows = await ds(set.id, {[field]: v}, 100, signal); ok = true; if (rows.length) return rows; }
    catch (e) { if (e.name === "AbortError") throw e; lastErr = e; }
  }
  if (!ok && lastErr) throw lastErr;
  return [];
}
/* Model datasets: fetch every row for maker + model code (all years), numeric filters first like the
   ministry's own columns, then text. Rows are ranked in JS so a year or trim mismatch never hides data. */
async function modelRows(id, rec, signal){
  const forms = [
    {tozeret_cd: num(rec.tozeret_cd), degem_cd: num(rec.degem_cd)},
    {tozeret_cd: String(rec.tozeret_cd).trim(), degem_cd: String(rec.degem_cd).trim()},
  ];
  for (const f of forms) {
    try { const rows = await ds(id, f, 300, signal); if (rows.length) return rows; }
    catch (e) { if (e.name === "AbortError") throw e; }
  }
  return [];
}
function rankRows(rows, rec){
  const n = s => String(s || "").trim().toLowerCase();
  const year = num(rec.shnat_yitzur);
  const score = r => {
    let sc = 0;
    const dy = Math.abs(num(r.shnat_yitzur) - year);
    sc -= isNaN(dy) ? 50 : dy * 10;
    if (n(r.sug_degem) && n(r.sug_degem) === n(rec.sug_degem)) sc += 3;
    if (n(r.ramat_gimur) && n(r.ramat_gimur) === n(rec.ramat_gimur)) sc += 5;
    if (n(r.kinuy_mishari) && n(r.kinuy_mishari) === n(rec.kinuy_mishari)) sc += 2;
    return sc;
  };
  return rows.slice().sort((a, b) => score(b) - score(a));
}
const hasTow = r => r && (isNum(r.kosher_grira_im_blamim) && num(r.kosher_grira_im_blamim) > 0 || isNum(r.kosher_grira_bli_blamim) && num(r.kosher_grira_bli_blamim) > 0);

/* ---------- render helpers ---------- */
function facts(list){
  const items = list.filter(f => f && !empty(f[1]))
    .map(([k, v, cls]) => `<div class="${cls||""}"><dt>${esc(k)}</dt><dd>${v}</dd></div>`);
  return items.length ? `<dl class="facts">${items.join("")}</dl>` : "";
}
const card = (title, inner) => inner ? `<section class="card"><h2>${esc(title)}</h2>${inner}</section>` : "";
const e = v => empty(v) ? "" : esc(v);
const unit = (v, u) => empty(v) ? "" : `${esc(fmtN(v))} ${u}`;
const mono = v => empty(v) ? "" : `<span class="mono">${esc(v)}</span>`;
function changed(v){ if (empty(v)) return ""; return yes(v) ? `<span class="flag-bad">כן</span>` : "לא"; }

/* ---------- lookup ---------- */
let ctrl = null;
async function lookup(raw){
  const plate = digits(raw).replace(/^0+(?=\d{5})/, "");
  const out = $("#out");
  if (plate.length < 5 || plate.length > 8) { out.innerHTML = `<div class="msg err">מספר רישוי צריך להכיל 5 עד 8 ספרות.</div>`; return; }
  if (ctrl) ctrl.abort();
  ctrl = new AbortController(); const signal = ctrl.signal;
  $("#plate").value = fmtPlate(plate); $("#plate").blur();
  $("#go").disabled = true;
  try { history.replaceState(null, "", "#" + plate); } catch {}
  out.innerHTML = `<div class="msg"><p class="note" style="margin-bottom:10px">מחפש את <span class="mono">${fmtPlate(plate)}</span> במאגרי משרד התחבורה…</p><div class="progress"><i id="bar"></i></div></div>`;

  const res = {}; let done = 0;
  try {
    await Promise.all(PLATE_SETS.map(async s => {
      try { res[s.key] = {rows: await byPlate(s, plate, signal)}; }
      catch (err) { if (err.name === "AbortError") throw err; res[s.key] = {rows: [], err: err.message}; }
      const bar = $("#bar"); if (bar) bar.style.width = (++done / (PLATE_SETS.length + 1) * 100) + "%";
    }));
  } catch (err) { if (err.name === "AbortError") return; throw err; }

  const errs = PLATE_SETS.filter(s => res[s.key].err);
  const mains = PLATE_SETS.filter(s => s.role === "main" && res[s.key].rows.length);
  const extras = PLATE_SETS.filter(s => s.role === "extra" && res[s.key].rows.length);
  $("#go").disabled = false;

  if (errs.length === PLATE_SETS.length) {
    out.innerHTML = `<div class="msg err">אין חיבור למאגרי משרד התחבורה כרגע. בדקו את החיבור לאינטרנט ונסו שוב.</div>`; return;
  }
  if (!mains.length && !extras.length) {
    out.innerHTML = `<div class="msg">לא נמצא רכב עם המספר <span class="mono">${fmtPlate(plate)}</span>. בדקו שהמספר הוקלד נכון.</div>`; return;
  }

  // one merged record: first main dataset wins, the rest fill gaps
  const v = {};
  const fill = r => { for (const [k,x] of Object.entries(r)) if (empty(v[k]) && !empty(x)) v[k] = x; };
  mains.forEach(s => fill(res[s.key].rows[0]));
  ["cont","tech"].forEach(k => res[k].rows[0] && fill(res[k].rows[0]));
  const primary = mains[0];

  let w = {}, towRow = null, counts = null, price = null;
  if (!empty(v.tozeret_cd) && !empty(v.degem_cd)) {
    const [a, b, c] = await Promise.all([
      modelRows(MODEL_SETS.wltp, v, signal).catch(() => []),
      modelRows(MODEL_SETS.counts, v, signal).catch(() => []),
      modelRows(MODEL_SETS.price, v, signal).catch(() => []),
    ]);
    if (signal.aborted) return;
    const ranked = rankRows(a, v);
    if (ranked.length) w = ranked[0];
    towRow = ranked.find(hasTow) || null;
    counts = rankRows(b, v)[0] || null;
    price = rankRows(c, v)[0] || null;
  }
  const pick = (...vals) => vals.find(x => !empty(x));

  const html = [];

  /* identity */
  const make = makeName(v), model = pick(v.kinuy_mishari, w.kinuy_mishari, v.degem_nm) || "";
  const pills = [];
  if (primary) pills.push(`<span class="pill ${primary.tone||"ok"}">${esc(primary.status)}</span>`);
  if (primary && primary.kind) pills.push(`<span class="pill">${esc(primary.kind)}</span>`);
  const exp = toDate(v.tokef_dt);
  if (exp && !/^cancel/.test(primary ? primary.key : "")) pills.push(exp < new Date() ? `<span class="pill bad">טסט לא בתוקף</span>` : `<span class="pill ok">טסט בתוקף</span>`);
  const recalls = res.recall.rows;
  if (recalls.length) pills.push(`<span class="pill bad">${recalls.length === 1 ? "ריקול פתוח" : recalls.length + " ריקולים פתוחים"}</span>`);
  const sub = [v.shnat_yitzur, pick(v.ramat_gimur, w.ramat_gimur), v.tzeva_rechev].filter(x => !empty(x)).map(esc).join(" · ");
  html.push(`<section class="card">
    <div><p class="id-title">${esc([make, model].filter(Boolean).join(" ") || "רכב " + fmtPlate(plate))}</p>
    <p class="id-sub">${sub}</p></div>
    ${pills.length ? `<div class="pills">${pills.join("")}</div>` : ""}
  </section>`);

  /* recalls first: they need action */
  if (recalls.length) html.push(card("ריקולים פתוחים", recalls.map(r =>
    `<div class="recall"><b>${esc(pick(r.TEUR_TAKALA, r.SUG_TAKALA) || "ריקול")}</b><span class="note">${[r.SUG_RECALL, !empty(r.TAARICH_PTICHA) && "נפתח ב-" + fmtDate(r.TAARICH_PTICHA)].filter(Boolean).map(esc).join(" · ")}</span></div>`).join("") +
    `<p class="note">לתיאום התיקון פנו ליבואן הרכב.</p>`));

  /* key numbers */
  const stats = [];
  // Towing: the model's own figures, else any towing field the vehicle record itself carries
  const tSrc = towRow || (hasTow(v) ? v : null);
  const tb = tSrc && tSrc.kosher_grira_im_blamim, tu = tSrc && tSrc.kosher_grira_bli_blamim;
  const tv = x => isNum(x) && num(x) > 0 ? fmtN(x) : "—";
  if (!empty(v.kilometer_test_aharon)) stats.push(["ק״מ בטסט האחרון", fmtN(v.kilometer_test_aharon), "ק״מ"]);
  const hp = pick(w.koah_sus, v.hespek);
  if (!empty(hp)) stats.push(["כוח", fmtN(hp), empty(w.koah_sus) ? "" : "כ״ס"]);
  if (price && !empty(price.mehir)) stats.push(["מחיר מחירון כחדש", fmtN(price.mehir), "₪"]);
  if (counts && !empty(counts.mispar_rechavim_pailim)) stats.push(["רכבים כאלה על הכביש", fmtN(counts.mispar_rechavim_pailim), ""]);
  if (stats.length % 2) stats.pop();
  const towNote = [];
  if (towRow && !empty(towRow.shnat_yitzur) && num(towRow.shnat_yitzur) !== num(v.shnat_yitzur)) towNote.push(`לפי נתוני הדגם משנת ${esc(towRow.shnat_yitzur)}, כי לשנת הייצור של הרכב אין נתון.`);
  if (!empty(v.grira_nm)) towNote.push(`ברישיון הרכב: גרירה ${esc(v.grira_nm)}.`);
  html.push(`<section class="card tow"><h2>כמה מותר לגרור</h2>${tSrc ? `<div class="tow-grid">
      <div><div class="k">עם בלמים</div><div class="v">${tv(tb)}<span class="u">ק״ג</span></div></div>
      <div><div class="k">בלי בלמים</div><div class="v">${tv(tu)}<span class="u">ק״ג</span></div></div>
    </div>` : `<p style="margin:0">אין במאגר של משרד התחבורה נתוני גרירה לדגם הזה.</p>`}
    ${towNote.map(t => `<p class="note">${t}</p>`).join("")}
    <p class="note">משקל הנגרר המותר כולל את המטען שבו. כדי לגרור צריך וו גרירה מאושר ורשום ברישיון הרכב.</p></section>`);
  html.push(stats.length ? `<div class="stats">${stats.map(([k,val,u]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(val)}${u ? `<span class="u">${esc(u)}</span>` : ""}</div></div>`).join("")}</div>` : "");

  /* licence & test */
  const isCancelled = primary && /^cancel/.test(primary.key);
  html.push(card("רישוי וטסט", facts([
    ["טסט אחרון", e(v.mivchan_acharon_dt && fmtDate(v.mivchan_acharon_dt))],
    ["רישיון בתוקף עד", e(v.tokef_dt && fmtDate(v.tokef_dt))],
    ["עלה לכביש", e(v.moed_aliya_lakvish && fmtDate(v.moed_aliya_lakvish))],
    ["רישום ראשון", e(v.rishum_rishon_dt && fmtDate(v.rishum_rishon_dt))],
    isCancelled && ["ירד מהכביש", e(v.bitul_dt && fmtDate(v.bitul_dt))],
    isCancelled && ["סיבה", e(v.bitul_nm)],
    ["סוג יבוא", e(v.sug_yevu)],
  ])));

  /* ownership */
  const own = res.owners.rows.slice().sort((a,b) => String(a.baalut_dt).localeCompare(String(b.baalut_dt)));
  if (own.length) {
    html.push(card(`היסטוריית בעלויות · ${own.length === 1 ? "יד ראשונה" : own.length + " רשומות"}`,
      `<ol class="timeline">${own.slice().reverse().map((r,i) => `<li><time>${esc(fmtDate(r.baalut_dt))}</time><span>${esc(r.baalut || "")}${i === 0 ? `<span class="now">נוכחי</span>` : ""}</span></li>`).join("")}</ol>
       <p class="note">כל רשומה היא העברת בעלות. המאגר מציין את סוג הבעלות בלבד, בלי שמות.</p>`));
  } else if (!empty(v.baalut)) {
    html.push(card("בעלות", facts([["בעלות נוכחית", e(v.baalut)]])));
  }

  /* vehicle condition */
  html.push(card("מצב הרכב", facts([
    ["מקוריות", e(v.mkoriut_nm)],
    ["שינוי מבנה", changed(v.shinui_mivne_ind)],
    ["הותקן גפ״מ", changed(v.gapam_ind)],
    ["שינוי צבע", changed(v.shnui_zeva_ind)],
    ["שינוי צמיגים", changed(v.shinui_zmig_ind)],
  ])));

  /* the car */
  const gearbox = empty(w.automatic_ind) ? "" : yes(w.automatic_ind) ? "אוטומטית" : "ידנית";
  const seats = pick(w.mispar_moshavim, v.mispar_mekomot);
  html.push(card("הרכב", facts([
    ["יצרן", e(make)], ["ארץ ייצור", e(v.tozeret_eretz_nm)],
    ["דגם", e(model)], ["שנת ייצור", e(v.shnat_yitzur)],
    ["סוג רכב", e(v.sug_rechev_nm)], ["מרכב", e(w.merkav)],
    ["דלתות", e(w.mispar_dlatot)], ["מושבים", e(seats)],
    ["צבע", e(v.tzeva_rechev)], ["רמת גימור", e(pick(v.ramat_gimur, w.ramat_gimur))],
  ])));

  html.push(card("מנוע והנעה", facts([
    ["דלק", e(pick(v.sug_delek_nm, w.delek_nm))], ["נפח מנוע", unit(pick(v.nefach_manoa, w.nefah_manoa), "סמ״ק")],
    ["כוח", empty(w.koah_sus) ? e(v.hespek) : unit(w.koah_sus, "כ״ס")], ["תיבת הילוכים", e(gearbox)],
    ["הנעה", e(pick(v.hanaa_nm, w.hanaa_nm))], ["דגם מנוע", mono(v.degem_manoa)],
  ])));

  html.push(card("משקלים וצמיגים", facts([
    ["משקל כולל מותר", unit(pick(v.mishkal_kolel, w.mishkal_kolel), "ק״ג")], ["משקל עצמי", unit(v.mishkal_azmi, "ק״ג")],
    ["כושר העמסה", unit(v.mishkal_mitan_harama, "ק״ג")], ["סרנים", e(v.sranim)],
    ["צמיג קדמי", mono(pick(v.zmig_kidmi, v.mida_zmig_kidmi))], ["צמיג אחורי", mono(pick(v.zmig_ahori, v.mida_zmig_ahori))],
  ])));

  /* safety */
  const present = Object.keys(SYSTEMS).filter(k => yes(w[k])).map(k => SYSTEMS[k]);
  const safetyFacts = facts([
    ["ניקוד בטיחות", e(w.nikud_betihut)], ["רמת אבזור בטיחותי", e(pick(v.ramat_eivzur_betihuty, w.ramat_eivzur_betihuty)) && `${esc(pick(v.ramat_eivzur_betihuty, w.ramat_eivzur_betihuty))} מתוך 8`],
    ["כריות אוויר", e(w.mispar_kariot_avir)],
  ]);
  html.push(card("בטיחות", safetyFacts + (present.length ? `<div class="systems">${present.map(s => `<span>${esc(s)}</span>`).join("")}</div>` : "")));

  /* environment */
  html.push(card("סביבה", facts([
    ["קבוצת זיהום", e(pick(v.kvutzat_zihum, w.kvutzat_zihum)) && `${esc(pick(v.kvutzat_zihum, w.kvutzat_zihum))} <span class="note">(1 הנקי ביותר, 15 המזהם ביותר)</span>`, "wide"],
    ["פליטת CO₂", unit(pick(w.CO2_WLTP, w.kamut_CO2), "גר׳ לק״מ")], ["מדד ירוק", e(w.madad_yarok)],
  ])));

  /* identifiers */
  html.push(card("מספרי זיהוי", facts([
    ["מספר רישוי", mono(fmtPlate(plate))],
    ["מספר שלדה (VIN)", mono(pick(v.misgeret, v.mispar_shilda, v.shilda)), "wide"],
  ])));

  out.innerHTML = html.join("");
  remember(plate);
  window.scrollTo({top: 0});
}

/* recent searches, kept in this browser only */
function getRecent(){ try { return JSON.parse(localStorage.getItem("recentPlates") || "[]"); } catch { return []; } }
function remember(p){ try { localStorage.setItem("recentPlates", JSON.stringify([p, ...getRecent().filter(x => x !== p)].slice(0,5))); } catch {} showRecent(); }
function showRecent(){
  const r = getRecent(), el = $("#recent");
  if (!r.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = r.map(p => `<button type="button" class="chip" data-p="${p}">${fmtPlate(p)}</button>`).join("");
}
function run(p){ lookup(p).catch(err => { $("#out").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; $("#go").disabled = false; }); }
$("#recent").addEventListener("click", ev => { const b = ev.target.closest("[data-p]"); if (b) run(b.dataset.p); });
$("#f").addEventListener("submit", ev => { ev.preventDefault(); run($("#plate").value); });

/* settings */
function themeChoice(){ try { return localStorage.getItem("theme") || "light"; } catch { return "light"; } }
function applyTheme(c){
  const root = document.documentElement;
  if (c === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", c);
  const dark = c === "dark" || (c === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0a0f1a" : "#ffffff");
  try { window.AndroidApp && window.AndroidApp.setDark(dark); } catch {}
  document.querySelectorAll("[data-theme-choice]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === c)));
}
document.querySelectorAll("[data-theme-choice]").forEach(b => b.addEventListener("click", () => {
  try { localStorage.setItem("theme", b.dataset.themeChoice); } catch {}
  applyTheme(b.dataset.themeChoice);
}));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(themeChoice()));
$("#gear").addEventListener("click", () => { const p = $("#settings"); p.hidden = !p.hidden; $("#gear").setAttribute("aria-expanded", String(!p.hidden)); });
applyTheme(themeChoice());
showRecent();
const start = digits(location.hash) || digits(new URLSearchParams(location.search).get("plate"));
if (start) run(start);
else $("#out").innerHTML = `<section class="card"><h2>מה תקבלו</h2><p style="margin:0">סטטוס הרכב ותוקף הטסט, היסטוריית בעלויות, ק״מ בטסט האחרון, שינויים ומקוריות, ריקולים פתוחים, כושר גרירה עם ובלי בלמים, מפרט, מערכות בטיחות, מחיר מחירון וכמה רכבים כאלה על הכביש.</p><p class="note">הקלידו מספר רישוי ולחצו על החיפוש.</p></section>`;
</script>
</body>
</html>
