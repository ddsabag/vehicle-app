<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>פרטי רכב</title>
<meta name="description" content="איתור פרטי רכב לפי מספר רישוי ממאגרי משרד התחבורה ב-data.gov.il">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column. A yellow Israeli plate is the search box; below it a summary, the towing figures, then one block per registry dataset. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --fg:#1b1f1d; --muted:#5f6763; --line:#dcdfda;
  --plate:#f7c600; --plate-ink:#111; --il:#1f4fa8; --accent:#1f4fa8;
  --ok:#1d7a45; --ok-bg:#e3f3e9; --warn:#9a5b00; --warn-bg:#fdf0d8; --bad:#b3261e; --bad-bg:#fbe5e3;
  --f-body:"IBM Plex Sans Hebrew",system-ui,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121514; --surface:#1b1f1d; --fg:#e8ebe8; --muted:#9aa29e; --line:#2e3431;
  --accent:#7fa5ec; --ok:#6fd39a; --ok-bg:#16301f; --warn:#f0b75e; --warn-bg:#33270f; --bad:#f08a82; --bad-bg:#3a1916;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --surface:#1b1f1d; --fg:#e8ebe8; --muted:#9aa29e; --line:#2e3431;
  --accent:#7fa5ec; --ok:#6fd39a; --ok-bg:#16301f; --warn:#f0b75e; --warn-bg:#33270f; --bad:#f08a82; --bad-bg:#3a1916;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.01em}
h2{font-size:1.02rem;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:.86rem;margin:0}
header{display:flex;flex-direction:column;gap:14px}

/* plate */
form{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.plate{flex:1 1 260px;display:flex;direction:ltr;background:var(--plate);border:3px solid #111;border-radius:8px;overflow:hidden;min-height:64px}
.plate .il{background:var(--il);color:#fff;width:38px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 0;font:700 11px/1.1 var(--f-body);gap:2px}
.plate input{flex:1;min-width:0;border:0;background:transparent;color:var(--plate-ink);font:500 clamp(1.6rem,7vw,2.3rem)/1 var(--f-mono);letter-spacing:.06em;text-align:center;padding:0 8px;outline:none}
.plate input::placeholder{color:rgba(0,0,0,.35)}
.plate:focus-within{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
button{font:inherit;cursor:pointer}
.go{flex:0 0 auto;background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:0 22px;font-weight:700;min-height:64px}
.go:focus-visible,.chip-btn:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go[disabled]{opacity:.55;cursor:progress}
.recent{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.chip-btn{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:2px 8px;font:500 .82rem var(--f-mono);direction:ltr}

/* status + summary */
.msg{padding:12px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.msg.err{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.progress{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem;color:var(--muted)}
.progress span{border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.progress span.done{color:var(--ok);border-color:var(--ok)}
.progress span.hit{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:700}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.summary .title{font-size:1.45rem;font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
.summary .meta{color:var(--muted);margin:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.keyfacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px;margin:0}
.keyfacts div{min-width:0}
.keyfacts dt{font-size:.75rem;color:var(--muted)}
.keyfacts dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.tow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tow div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.tow b{display:block;font:500 1.7rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:4px}
.tow small{color:var(--muted)}
.tow .lbl{font-size:.82rem;color:var(--muted)}

/* sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sec>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";width:8px;height:8px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:0 0 auto}
.sec[open]>summary::after{transform:rotate(135deg)}
.sec .src{font-size:.75rem;color:var(--muted);font-weight:400}
.sec .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.group h3{font-size:.78rem;letter-spacing:.04em;color:var(--muted);margin:0 0 6px;font-weight:700}
.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;margin:0;border-top:1px solid var(--line)}
.kv dt,.kv dd{padding:7px 0;border-bottom:1px solid var(--line);margin:0;min-width:0;overflow-wrap:anywhere}
.kv dt{color:var(--muted);font-size:.88rem;padding-inline-end:10px}
.kv dd{font-variant-numeric:tabular-nums}
.yes{color:var(--ok);font-weight:500}.no{color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.timeline time{font:500 .92rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);direction:ltr;text-align:right}
.timeline .n{font-size:.75rem;color:var(--muted);margin-inline-start:6px}
.recall{border-inline-start:3px solid var(--bad);padding-inline-start:12px;display:flex;flex-direction:column;gap:2px}
.note{font-size:.82rem;color:var(--muted);margin:0}
footer{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>פרטי רכב</h1>
      <p class="sub">כל מה שמאגרי משרד התחבורה ב-data.gov.il יודעים על הרכב, לפי מספר רישוי.</p>
    </div>
    <form id="f" autocomplete="off">
      <label class="plate" for="plate">
        <span class="il" aria-hidden="true"><span>IL</span><span>ישראל</span></span>
        <input id="plate" name="plate" inputmode="numeric" pattern="[0-9\- ]*" placeholder="12-345-67" maxlength="10" aria-label="מספר רישוי">
      </label>
      <button class="go" id="go" type="submit">חיפוש</button>
    </form>
    <div class="recent" id="recent" hidden></div>
  </header>
  <main id="out" aria-live="polite"></main>
  <footer>
    <span>המידע נשלף ישירות מהמאגרים הפתוחים של משרד התחבורה ב-<a href="https://data.gov.il/dataset?organization=ministry_of_transport" target="_blank" rel="noopener">data.gov.il</a>. המאגרים מתעדכנים מעת לעת ואינם מחליפים נסח רישום רשמי.</span>
    <span>היסטוריית הבעלות במאגר הפתוח כוללת את סוג הבעלות ותאריך השינוי בלבד, בלי פרטים מזהים של בעלים.</span>
  </footer>
</div>

  bakarat_stiya_activ_s:"בקרת סטייה אקטיבית",blima_otomatit_nesia_leahor:"בלימה אוטומטית ברוורס",bakarat_mehirut_isa:"בקרת מהירות חכמה (ISA)",
  blimat_hirum_lifnei_holhei_regel_ofanaim:"בלימת חירום להולכי רגל ואופניים",hitnagshut_cad_shetah_met:"התנגשות צד בשטח מת",

};
const label = k => L[k] || k.replace(/_/g," ");

const WLTP_GROUPS = [
  ["גרירה ומשקלים",["kosher_grira_im_blamim","kosher_grira_bli_blamim","mishkal_kolel","gova"]],
  ["מנוע והנעה",["nefah_manoa","koah_sus","delek_nm","technologiat_hanaa_nm","hanaa_nm","automatic_ind","sug_tkina_nm","sug_mamir_nm"]],
  ["מרכב ונוחות",["merkav","mispar_dlatot","mispar_moshavim","mazgan_ind","hege_koah_ind","mispar_halonot_hashmal","halon_bagg_ind","galgaley_sagsoget_kala_ind","argaz_ind","ramat_gimur","kinuy_mishari"]],
  ["בטיחות",["nikud_betihut","ramat_eivzur_betihuty","mispar_kariot_avir","abs_ind","bakarat_yatzivut_ind","maarechet_ezer_labalam_ind","bakarat_stiya_menativ_ind","nitur_merhak_milfanim_ind","zihuy_beshetah_nistar_ind","bakarat_shyut_adaptivit_ind","zihuy_holchey_regel_ind","matzlemat_reverse_ind","hayshaney_lahatz_avir_batzmigim_ind","hayshaney_hagorot_ind","teura_automatit_benesiya_kadima_ind","shlita_automatit_beorot_gvohim_ind","zihuy_matzav_hitkarvut_mesukenet_ind","zihuy_tamrurey_tnua_ind","zihuy_rechev_do_galgali","bakarat_stiya_activ_s","blima_otomatit_nesia_leahor","bakarat_mehirut_isa","blimat_hirum_lifnei_holhei_regel_ofanaim","hitnagshut_cad_shetah_met","alco_lock"]],
  ["זיהום ופליטות",["madad_yarok","kvutzat_zihum","CO2_WLTP","kamut_CO2","kamut_CO2_city","kamut_CO2_hway","NOX_WLTP","CO_WLTP","HC_WLTP","PM_WLTP","CO2_WLTP_NEDC"]],
];
const HIDE = new Set(["_id","rank","_full_text"]);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const empty = v => v === null || v === undefined || String(v).trim() === "";
const digits = s => String(s || "").replace(/\D/g, "");
function fmtPlate(d){ d = String(d);
  if (d.length === 7) return d.slice(0,2)+"-"+d.slice(2,5)+"-"+d.slice(5);
  if (d.length === 8) return d.slice(0,3)+"-"+d.slice(3,5)+"-"+d.slice(5);
  return d; }
function fmtDate(v){
  const s = String(v).trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[3]}/${m[2]}/${m[1]}`;
  if ((m = s.match(/^(\d{4})-(\d{1,2})$/))) return `${m[2].padStart(2,"0")}/${m[1]}`;
  if ((m = s.match(/^(\d{4})(\d{2})$/))) return `${m[2]}/${m[1]}`;
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return `${m[3]}/${m[2]}/${m[1]}`;
  return s;
}
function fmtVal(k, v){
  if (empty(v)) return "";
  if (/_ind$|^(alco_lock|bakarat_stiya_activ_s|blima_otomatit_nesia_leahor|bakarat_mehirut_isa|blimat_hirum_lifnei_holhei_regel_ofanaim|hitnagshut_cad_shetah_met|zihuy_rechev_do_galgali)$/.test(k)) {
    const s = String(v).trim();
    if (s === "1") return '<span class="yes">יש</span>';
    if (s === "0") return '<span class="no">אין</span>';
  }
  if (/(_dt|moed_aliya_lakvish|TAARICH_PTICHA)$/.test(k)) return esc(fmtDate(v));
  if (/^(mispar_rechev|MISPAR_RECHEV)$/.test(k)) return `<span dir="ltr">${esc(fmtPlate(digits(v)))}</span>`;
  if (/^(mishkal|kosher_grira|kilometer|mehir|mispar_rechavim)/.test(k) && /^\d+(\.\d+)?$/.test(String(v).trim()))
    return Number(v).toLocaleString("he-IL");
  if (/^(misgeret|mispar_shilda|shilda|mispar_manoa|degem_manoa)$/.test(k)) return `<span dir="ltr" style="font-family:var(--f-mono)">${esc(v)}</span>`;
  return esc(v);
}
function kv(rec, keys){
  keys = keys || Object.keys(rec);
  const rows = keys.filter(k => !HIDE.has(k) && k in rec && !empty(rec[k]))
    .map(k => `<dt>${esc(label(k))}</dt><dd>${fmtVal(k, rec[k])}</dd>`).join("");
  return rows ? `<dl class="kv">${rows}</dl>` : "";
}
function section(title, src, inner, open){
  return `<details class="sec"${open?" open":""}><summary><h2>${esc(title)}</h2>${src && src !== title ? `<span class="src">${esc(src)}</span>` : ""}</summary><div class="body">${inner}</div></details>`;
}

/* ---------- API ---------- */
async function ds(resource_id, filters, limit = 100, signal){
  const p = new URLSearchParams({resource_id, filters: JSON.stringify(filters), limit: String(limit)});
  const r = await fetch(`${API}?${p}`, {signal, headers:{Accept:"application/json"}});
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  if (!j.success) throw new Error((j.error && (j.error.message || JSON.stringify(j.error))) || "CKAN error");
  return j.result.records || [];
}
/* Plate columns are text in some datasets and numeric in others; old archives zero-pad. Try forms until one hits. */
async function byPlate(set, plate, signal){
  const field = set.field || "mispar_rechev";
  const forms = [plate, Number(plate)];
  if (set.pad && plate.length < 8) forms.push(plate.padStart(7,"0"), plate.padStart(8,"0"));
  let lastErr = null, ok = false;
  for (const v of [...new Set(forms)]) {
    try { const rows = await ds(set.id, {[field]: v}, 100, signal); ok = true; if (rows.length) return rows; }
    catch (e) { if (e.name === "AbortError") throw e; lastErr = e; }
  }
  if (!ok && lastErr) throw lastErr;
  return [];
}
async function byModel(set, rec, signal){
  const base = {tozeret_cd: rec.tozeret_cd, degem_cd: rec.degem_cd};
  const tries = [];
  if (!empty(rec.shnat_yitzur)) {
    if (!empty(rec.sug_degem)) tries.push({...base, shnat_yitzur: rec.shnat_yitzur, sug_degem: rec.sug_degem});
    tries.push({...base, shnat_yitzur: rec.shnat_yitzur});
  }
  tries.push(base);
  for (const f of tries) {
    for (const cast of [String, Number]) {
      const ff = {}; for (const k in f) ff[k] = k === "sug_degem" ? String(f[k]) : cast(f[k]);
      try { const rows = await ds(set.id, ff, 50, signal); if (rows.length) return {rows, exact: "shnat_yitzur" in f}; break; }
      catch (e) { if (e.name === "AbortError") throw e; }
    }
  }
  return {rows: [], exact: false};
}
function bestModelRow(rows, rec){
  const norm = s => String(s || "").trim().toLowerCase();
  return rows.find(r => norm(r.ramat_gimur) && norm(r.ramat_gimur) === norm(rec.ramat_gimur) && norm(r.kinuy_mishari) === norm(rec.kinuy_mishari))
      || rows.find(r => norm(r.ramat_gimur) && norm(r.ramat_gimur) === norm(rec.ramat_gimur))
      || rows.find(r => norm(r.kinuy_mishari) && norm(r.kinuy_mishari) === norm(rec.kinuy_mishari))
      || rows[0];
}

/* ---------- render ---------- */
let ctrl = null;
async function lookup(raw){
  const plate = digits(raw).replace(/^0+(?=\d{5})/, "");
  const out = $("#out");
  if (plate.length < 5 || plate.length > 8) { out.innerHTML = `<div class="msg err">מספר רישוי צריך להכיל 5 עד 8 ספרות.</div>`; return; }
  if (ctrl) ctrl.abort();
  ctrl = new AbortController(); const signal = ctrl.signal;
  $("#plate").value = fmtPlate(plate);
  $("#go").disabled = true;
  try { history.replaceState(null, "", "#" + plate); } catch {}
  out.innerHTML = `<div class="msg"><p class="sub" style="margin:0 0 8px">מחפש את <span dir="ltr">${fmtPlate(plate)}</span> ב-${PLATE_SETS.length} מאגרים…</p><div class="progress" id="prog">${PLATE_SETS.map(s=>`<span data-k="${s.key}">${esc(s.name)}</span>`).join("")}</div></div>`;

  const res = {};
  await Promise.all(PLATE_SETS.map(async s => {
    try { res[s.key] = {rows: await byPlate(s, plate, signal)}; }
    catch (e) { if (e.name === "AbortError") throw e; res[s.key] = {rows: [], err: e.message}; }
    const el = document.querySelector(`#prog [data-k="${s.key}"]`);
    if (el) el.className = res[s.key].rows.length ? "hit" : "done";
  })).catch(e => { if (e.name !== "AbortError") throw e; });
  if (signal.aborted) return;

  const errs = PLATE_SETS.filter(s => res[s.key].err);
  const mains = PLATE_SETS.filter(s => s.role === "main" && res[s.key].rows.length);
  const extrasFound = PLATE_SETS.filter(s => s.role === "extra" && res[s.key].rows.length);

  if (errs.length === PLATE_SETS.length) {
    out.innerHTML = `<div class="msg err">לא הצלחתי להתחבר ל-data.gov.il (${esc(errs[0].err)}). בדקו את החיבור לאינטרנט ונסו שוב. אם הדף נפתח מתוך תצוגה מקדימה שחוסמת בקשות לאתרים חיצוניים, פתחו אותו ישירות בדפדפן.</div>`;
    $("#go").disabled = false; return;
  }
  if (!mains.length && !extrasFound.length) {
    out.innerHTML = `<div class="msg">לא נמצא רכב עם המספר <span dir="ltr">${fmtPlate(plate)}</span> באף אחד מהמאגרים.${errs.length?` <br><span class="note">${errs.length} מאגרים לא ענו: ${esc(errs.map(s=>s.name).join(", "))}.</span>`:""}</div>`;
    $("#go").disabled = false; return;
  }

  // merge main record: first main dataset wins, others fill gaps
  const rec = {};
  for (const s of mains) for (const [k,v] of Object.entries(res[s.key].rows[0])) if (!(k in rec) || empty(rec[k])) rec[k] = v;
  for (const s of extrasFound) if (s.key === "cont" || s.key === "tech") for (const [k,v] of Object.entries(res[s.key].rows[0])) if (!(k in rec) || empty(rec[k])) rec[k] = v;
  const primary = mains[0];

  // model-level data
  let wltp = null, wltpRows = [], wltpExact = false, counts = null, price = null;
  if (!empty(rec.tozeret_cd) && !empty(rec.degem_cd)) {
    const [w, c, p] = await Promise.all([
      byModel(MODEL_SETS.wltp, rec, signal).catch(()=>({rows:[]})),
      byModel(MODEL_SETS.counts, rec, signal).catch(()=>({rows:[]})),
      byModel(MODEL_SETS.price, rec, signal).catch(()=>({rows:[]})),
    ]);
    if (signal.aborted) return;
    wltpRows = w.rows; wltpExact = w.exact; wltp = wltpRows.length ? bestModelRow(wltpRows, rec) : null;
    counts = c.rows[0] || null;
    price = p.rows.length ? bestModelRow(p.rows, rec) : null;
  }

  const html = [];
  // summary
  const make = rec.tozeret_nm || "", model = rec.kinuy_mishari || rec.degem_nm || "";
  const pills = [];
  const st = primary ? primary : null;
  if (st) pills.push(`<span class="pill ${st.tone||"ok"}">${esc(st.status)}</span>`);
  if (primary && primary.key !== "active" && primary.key !== "inactive" && primary.key !== "inactive2" && !/^cancel/.test(primary.key)) pills.push(`<span class="pill">${esc(primary.name)}</span>`);
  if (!empty(rec.tokef_dt)) { const t = new Date(String(rec.tokef_dt).slice(0,10)); if (!isNaN(t)) pills.push(t < new Date() ? `<span class="pill bad">רישיון רכב פג תוקף</span>` : `<span class="pill ok">רישיון בתוקף עד ${esc(fmtDate(rec.tokef_dt))}</span>`); }
  const recalls = res.recall.rows;
  if (recalls.length) pills.push(`<span class="pill bad">${recalls.length === 1 ? "ריקול פתוח" : recalls.length + " ריקולים פתוחים"}</span>`);
  if (res.safety.rows.length) pills.push(`<span class="pill ok">זכאי להנחת מערכות בטיחות</span>`);
  const own = res.owners.rows.slice().sort((a,b)=>String(a.baalut_dt).localeCompare(String(b.baalut_dt)));
  if (own.length) pills.push(`<span class="pill">${own.length} רשומות בעלות</span>`);

  const facts = [
    ["שנת ייצור", rec.shnat_yitzur], ["עלייה לכביש", rec.moed_aliya_lakvish && fmtDate(rec.moed_aliya_lakvish)],
    ["בעלות נוכחית", rec.baalut], ["צבע", rec.tzeva_rechev], ["סוג דלק", rec.sug_delek_nm || (wltp && wltp.delek_nm)],
    ["טסט אחרון", rec.mivchan_acharon_dt && fmtDate(rec.mivchan_acharon_dt)],
    ["ק״מ בטסט האחרון", !empty(rec.kilometer_test_aharon) ? Number(rec.kilometer_test_aharon).toLocaleString("he-IL") : ""],
    ["נפח מנוע", rec.nefach_manoa || (wltp && wltp.nefah_manoa)], ["כוח סוס", wltp && wltp.koah_sus],
    ["רמת גימור", rec.ramat_gimur], ["מקוריות", rec.mkoriut_nm], ["תאריך ביטול", rec.bitul_dt && fmtDate(rec.bitul_dt)],
  ].filter(([,v]) => !empty(v));
  html.push(`<section class="summary">
    <div><p class="title">${esc([make, model].filter(Boolean).join(" · ") || "רכב " + fmtPlate(plate))}</p>
    <p class="meta"><span dir="ltr">${fmtPlate(plate)}</span>${rec.degem_nm && rec.degem_nm !== model ? " · דגם " + esc(rec.degem_nm) : ""}${rec.tozeret_eretz_nm ? " · " + esc(rec.tozeret_eretz_nm) : ""}</p></div>
    <div class="pills">${pills.join("")}</div>
    <dl class="keyfacts">${facts.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
  </section>`);

  // towing
  const towB = wltp && wltp.kosher_grira_im_blamim, towU = wltp && wltp.kosher_grira_bli_blamim;
  const towRec = rec.grira_nm;
  if (!empty(towB) || !empty(towU)) {
    const n = v => empty(v) ? "—" : Number(v).toLocaleString("he-IL");
    html.push(`<section class="tow" aria-label="כושר גרירה">
      <div><span class="lbl">גרירה עם בלמים</span><b>${n(towB)}</b><small>ק״ג</small></div>
      <div><span class="lbl">גרירה בלי בלמים</span><b>${n(towU)}</b><small>ק״ג</small></div>
    </section>${!empty(towRec)?`<p class="note">ברישום הרכב: גרירה ${esc(towRec)}.</p>`:""}${!wltpExact?`<p class="note">נתוני הגרירה לקוחים מהדגם בלי התאמה לשנת הייצור, כי לא נמצאה רשומה לשנה המדויקת.</p>`:""}`);
  } else if (!empty(towRec)) {
    html.push(`<div class="msg">גרירה לפי רישום הרכב: <b>${esc(towRec)}</b></div>`);
  }

  // recalls
  if (recalls.length) html.push(section("ריקולים פתוחים", "ריקולים פתוחים לרכב", recalls.map(r =>
    `<div class="recall"><b>${esc(r.TEUR_TAKALA || r.SUG_TAKALA || "ריקול")}</b><span class="note">${[r.SUG_RECALL, r.RECALL_ID && "מספר " + r.RECALL_ID, r.TAARICH_PTICHA && "נפתח " + fmtDate(r.TAARICH_PTICHA)].filter(Boolean).map(esc).join(" · ")}</span></div>`).join(""), true));

  // registration record(s)
  for (const s of mains) html.push(section(s === primary ? "פרטי רישום" : s.name, s.name, kv(res[s.key].rows[0]), s === primary));

  // ownership history
  if (own.length) html.push(section("היסטוריית בעלויות", "היסטוריית בעלויות",
    `<ol class="timeline">${own.map((r,i)=>`<li><time>${esc(fmtDate(r.baalut_dt))}</time><span>${esc(r.baalut || "")}${i===own.length-1?'<span class="n">נוכחי</span>':""}</span></li>`).join("")}</ol>
     <p class="note">המאגר הפתוח מפרט את סוג הבעלות ותאריך תחילתה. שמות הבעלים אינם מפורסמים.</p>`, true));

  // tech history + continuation
  for (const k of ["tech","cont"]) if (res[k].rows.length) {
    const s = PLATE_SETS.find(x=>x.key===k);
    html.push(section(s.name, s.name, res[k].rows.map(r => kv(r)).join(""), false));
  }

  // model specs
  if (wltp) {
    const used = new Set();
    const groups = WLTP_GROUPS.map(([t, keys]) => { keys.forEach(k=>used.add(k)); const body = kv(wltp, keys); return body ? `<div class="group"><h3>${esc(t)}</h3>${body}</div>` : ""; }).join("");
    const rest = Object.keys(wltp).filter(k => !used.has(k) && !HIDE.has(k));
    const restBody = kv(wltp, rest);
    html.push(section("מפרט הדגם", MODEL_SETS.wltp.name,
      groups + (restBody ? `<div class="group"><h3>שאר הנתונים</h3>${restBody}</div>` : "") +
      (wltpRows.length > 1 ? `<p class="note">נמצאו ${wltpRows.length} גרסאות לדגם הזה. מוצגת הגרסה שרמת הגימור שלה תואמת לרכב${wltp.ramat_gimur && wltp.ramat_gimur === rec.ramat_gimur ? "" : " ככל האפשר"}.</p>` : ""), false));
  }
  if (counts || price) {
    let inner = "";
    if (counts) inner += kv(counts, ["mispar_rechavim_pailim","mispar_rechavim_le_pailim"]);
    if (price) inner += kv(price, ["mehir","shem_yevuan","kinuy_mishari","shnat_yitzur"]);
    html.push(section("הדגם בשוק", [counts && MODEL_SETS.counts.name, price && MODEL_SETS.price.name].filter(Boolean).join(" · "), inner, false));
  }
  if (res.safety.rows.length) html.push(section(PLATE_SETS.find(s=>s.key==="safety").name, "", kv(res.safety.rows[0]), false));

  // sources
  const found = [...mains, ...extrasFound].map(s=>s.name);
  if (wltp) found.push(MODEL_SETS.wltp.name);
  html.push(`<p class="note">נמצא ב: ${esc(found.join(" · "))}.${errs.length ? ` לא ענו: ${esc(errs.map(s=>s.name).join(" · "))}.` : ""}</p>`);

  out.innerHTML = html.join("");
  $("#go").disabled = false;
  remember(plate);
}

/* recent searches (this browser only) */
function getRecent(){ try { return JSON.parse(localStorage.getItem("recentPlates") || "[]"); } catch { return []; } }
function remember(p){ try { localStorage.setItem("recentPlates", JSON.stringify([p, ...getRecent().filter(x=>x!==p)].slice(0,6))); } catch {} showRecent(); }
function showRecent(){
  const r = getRecent(), el = $("#recent");
  if (!r.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<span>חיפושים אחרונים:</span>` + r.map(p=>`<button type="button" class="chip-btn" data-p="${p}">${fmtPlate(p)}</button>`).join("");
}
$("#recent").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b) lookup(b.dataset.p); });
$("#f").addEventListener("submit", e => { e.preventDefault(); lookup($("#plate").value).catch(err => { $("#out").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; $("#go").disabled = false; }); });
showRecent();
const start = digits(location.hash) || digits(new URLSearchParams(location.search).get("plate"));
if (start) lookup(start);
else $("#out").innerHTML = `<div class="msg"><p style="margin:0 0 6px"><b>מה תקבלו:</b> פרטי רישום, סטטוס (פעיל, לא פעיל, ירד מהכביש), היסטוריית בעלויות, ק״מ בטסט, שינויים ומקוריות, ריקולים פתוחים, כושר גרירה עם ובלי בלמים, מפרט דגם מלא, מחיר מחירון וכמה רכבים כאלה על הכביש.</p><p class="note">הקלידו מספר רישוי של 7 או 8 ספרות ולחצו חיפוש.</p></div>`;
