name = "luchit-uptime"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["global_fetch_strictly_public"]   # probes reach luchit.app through the public front door (Pages + the /api/* route)
workers_dev = true                                        # no luchit.app route: /health is at luchit-uptime.<subdomain>.workers.dev
preview_urls = false                                      # no preview URLs for each version
keep_vars = true                                          # any other dashboard variable survives a deploy
[vars]
ALERT_ROUTE = "critical"   # paging ON since 24.10.2026 (Dudu chose "כן, להדליק" on the decision card); remove the line to go back to observe mode
[observability]
enabled = false
[triggers]
crons = ["*/10 * * * *"]
[[kv_namespaces]]
binding = "ALERTS"
id = "KV_NAMESPACE_ID"   # the id of luchit-alerts, filled in after Dudu creates it (prompt reports/פרומפט-לתוסף-בדיקת-זמינות.md); not a secret
# Send Email binding MAIL: the second paging channel next to Telegram (a site-down page also goes by mail). Destination = FORWARD_TO in
# worker/mail/wrangler.toml, already a verified Email Routing address. It was planned as a dashboard step and never added: /health said
# email:false until this line (ops area checklist 7.11.2026).
[[send_email]]
name = "MAIL"
destination_address = "luchit.app.service@gmail.com"
# Secrets (Dudu pastes them): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID; optional BREVO_KEY.
[version_metadata]
binding = "CF_VERSION_METADATA"   # the running version's id: answers carry it as x-luchit-version, so the Workers deploy check knows which version answered
