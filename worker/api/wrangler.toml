name = "luchit-api"
main = "worker.js"
compatibility_date = "2026-10-13"   # as set live in the dashboard
routes = [{ pattern = "luchit.app/api/*", zone_name = "luchit.app" }]
workers_dev = true     # as live
preview_urls = false   # as live
keep_vars = true   # no [vars] block at all: the values live in the dashboard, so a deploy can never blank or change them
# Dashboard variables (Settings > Variables and Secrets, type Text), read by worker.js:
#   BREVO_LIST_ID       numeric id of the "Magazine" list in Brevo
#   BREVO_B2B_LIST_ID   numeric id of the business waitlist in Brevo
#   NOTIFY_TO           where a business lead is mailed (unset = the support inbox luchit.app.service@gmail.com, the default in worker.js)
#   GA_MEASUREMENT_ID   optional, G-XXXXXXXXXX of the web data stream, together with the secret GA_API_SECRET
# Secrets (never in this file): BREVO_KEY; optional CONFIRM_SECRET and GA_API_SECRET.
[observability]
enabled = false   # Workers Logs would keep request URLs, and a confirm link carries the email address (?e=): not kept
[version_metadata]
binding = "CF_VERSION_METADATA"   # the running version's id: answers carry it as x-luchit-version, so the Workers deploy check knows which version answered
