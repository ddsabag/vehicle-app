name = "luchit-og"
main = "worker.js"
compatibility_date = "2026-10-12"   # as set live in the dashboard
keep_vars = true   # the preview needs no variables; any set in the dashboard survive a deploy
routes = [{ pattern = "luchit.app/", zone_name = "luchit.app" }]   # the home page only, where ?plate= and ?cmp= links land (as live)
workers_dev = true     # as live
preview_urls = false   # as live
[observability]
enabled = false   # Workers Logs would keep request URLs, and a shared link carries the plate (?plate=): not kept
[version_metadata]
binding = "CF_VERSION_METADATA"   # the running version's id: answers carry it as x-luchit-version, so the Workers deploy check knows which version answered
