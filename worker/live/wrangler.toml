name = "luchit-live"
main = "worker.js"
compatibility_date = "2026-10-14"   # as set live in the dashboard
routes = [{ pattern = "luchit.app/live*", zone_name = "luchit.app" }]
keep_vars = true   # the Access settings below live in the dashboard, so a deploy can never blank them
workers_dev = true     # as live (worker.js itself refuses a request without a valid Access token, so the workers.dev address shows nothing)
preview_urls = false   # as live
# Secrets (never in this file):  wrangler secret put GA_SERVICE_ACCOUNT_JSON   and   wrangler secret put CF_API_TOKEN
# Dashboard variables (type Text), read by worker.js:
#   CF_ACCOUNT_ID        same value as the GitHub secret CF_ACCOUNT_ID
#   ACCESS_TEAM_DOMAIN   e.g. myteam.cloudflareaccess.com  (Zero Trust > Settings > Custom pages)
#   ACCESS_AUD           the Application Audience (AUD) tag of the Access application that protects luchit.app/live*
[triggers]
crons = ["*/10 * * * *"]   # live-31: keeps the realtime tally of today's installs and checks going while nobody has the screen open
[observability]
enabled = true   # as live: the dashboard's requests carry no plate or email
[[kv_namespaces]]
binding = "ALERTS"
id = "KV_NAMESPACE_ID"   # the id of luchit-alerts (luchit-uptime creates it); the Workers deploy workflow fills it in by title; not a secret. This Worker writes only "lv:" keys: today's realtime counts (live-30)
[vars]
GA_PROPERTY_ID = "557990379"
# PLAY_REPORTS_BUCKET: the Cloud Storage bucket of Play Console's reports (pubsite_prod_..., Download reports > Statistics > Copy Cloud Storage URI).
# Without it the installs tile counts first opens in GA4; with it, Google Play's own installs (needs the account-level permission
# "View app information and download bulk reports" for the service account).
PLAY_REPORTS_BUCKET = "pubsite_prod_4688106336294834537"
